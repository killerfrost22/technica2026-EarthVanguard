<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<canvas id="c" width="720" height="1280" style="display:block"></canvas>
<script>
window.R={};
const c=document.getElementById('c'); const g=c.getContext('webgl');
const d=g&&g.getExtension('WEBGL_debug_renderer_info'); R.renderer=g?(d?g.getParameter(d.UNMASKED_RENDERER_WEBGL):'?'):'none';
const o=document.createElement('canvas');o.width=720;o.height=1280;const x=o.getContext('2d');
let frames=0,t0=performance.now();
const tex=g.createTexture();
function loop(){frames++;
 x.fillStyle='#03030a';x.fillRect(0,0,720,1280);x.globalCompositeOperation='lighter';
 for(let i=0;i<300;i++){x.fillStyle='hsl('+(i*7)+',90%,60%)';x.fillRect((i*37+frames*3)%720,(i*91)%1280,6,18);} x.globalCompositeOperation='source-over';
 g.bindTexture(g.TEXTURE_2D,tex);g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,o);
 g.clearColor((frames%60)/60,0,0.2,1);g.clear(g.COLOR_BUFFER_BIT);
 R.fps=Math.round(frames/((performance.now()-t0)/1000));R.frames=frames;requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
