    x.fillRect(0, 0, 90, 160);
    return c;
  }

  function composite2D(fx) {
    const c = c2;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
    c.drawImage(R.scene, 0, 0, bw, bh);
    if (fx.vig > 0.001) {
      c.globalAlpha = Math.min(1, fx.vig * 1.25);
      c.drawImage(vigCanvas, 0, 0, bw, bh);
    }
    if (fx.desat > 0.01) {
      c.globalCompositeOperation = 'saturation';
      c.globalAlpha = fx.desat;
      c.fillStyle = '#808080';
      c.fillRect(0, 0, bw, bh);
    }
    if (fx.flashA > 0.004) {
      c.globalCompositeOperation = 'screen';
      c.globalAlpha = fx.flashA;
      c.fillStyle = 'rgb(' + fx.flashC[0] + ',' + fx.flashC[1] + ',' + fx.flashC[2] + ')';
      c.fillRect(0, 0, bw, bh);
    }
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';

  function chooseOutput() {
    const want = !!G && !glLost && QUALITY[R.quality].gl;
    glActive = want;
    R.hasGL = !!G && !glLost;
    R.distortion = glActive;
    if (!glActive) ensure2D();
    if (glCanvas) {
      glCanvas.hidden = !glActive;
      glCanvas.id = glActive ? 'screen' : 'screen-gl';
    }
    if (c2Canvas) {
      c2Canvas.hidden = glActive;
      c2Canvas.id = glActive ? 'screen-2d' : 'screen';
    }
  }

  // ------------------------------------------------------------------ frame
  const mergedFx = makeFx();
  function mergeFx() {
    const m = mergedFx;
    m.chroma = Math.max(fxU.chroma, fxD.chroma);
    const fu = fxU.flashA >= fxD.flashA ? fxU : fxD;
    m.flashA = fu.flashA;
    m.flashC[0] = fu.flashC[0]; m.flashC[1] = fu.flashC[1]; m.flashC[2] = fu.flashC[2];
    m.desat = Math.max(fxU.desat, fxD.desat);
    const v = Math.max(fxU.vig, fxD.vig);
    m.vig = v >= 0 ? v : 0.35;
    return m;
  }

  function reportDrawError(err) {
    const key = String(err && err.message);
    if (drawErrors.has(key) || drawErrors.size > 40) return;
    drawErrors.add(key);
    console.error('[SL.render] scene draw threw:', err);
  }

  function trackTiming(now) {
    const dt = lastFrame ? now - lastFrame : 16.7;
    lastFrame = now;
    if (dt > 0 && dt < 250) {
      R.frameMs += (dt - R.frameMs) * 0.05;
      R.fps = 1000 / Math.max(1, R.frameMs);
    }
    if (!autoStart) autoStart = now;
    const paused = SL.game && SL.game.paused;
    // one-off hitches (lazy sprite generation, GC) count at most 50 ms each, so a few long frames cannot trip the
    // 20 ms average on their own; a steadily slow machine still averages above it
    if (R.auto && dt > 0 && dt < 250 && !paused && document.visibilityState !== 'hidden') { autoAcc += Math.min(dt, 50); autoN++; }
    if (now - autoStart >= 3000) {
      if (R.auto && autoN >= 30) autoStep(autoAcc / autoN);
      autoAcc = 0; autoN = 0; autoStart = now;
    }
  }

  // Auto quality: above 20 ms average over 3 s, step down one level. Each step is checked over the next window: if it
  // bought no speed (>= 85% of the frame time before the first step), frames are paced by the browser or display (a
  // 30 Hz power-saving clock), not by our work, so the next level is tried, and if even Low gains nothing the starting
  // quality is restored and auto holds until frames are fast again (< 18 ms).
  let autoProbe = null, autoHold = false;
  function autoStep(avg) {
    if (autoHold) { if (avg < 18) autoHold = false; return; }
    const i = ORDER.indexOf(R.quality);
    if (autoProbe) {
      if (avg <= autoProbe.avg * 0.85) { autoProbe = null; } else if (i >= 0 && i < ORDER.length - 1) {
        console.warn('[SL.render] quality ' + R.quality + ' did not help (' + avg.toFixed(1) + ' ms); trying ' + ORDER[i + 1]);
        R.setQuality(ORDER[i + 1]);
        return;
      } else {
        console.warn('[SL.render] lower quality did not speed frames up (' + avg.toFixed(1) + ' ms): the frame clock is capped; back to ' + autoProbe.from);
        R.setQuality(autoProbe.from);
        autoProbe = null;
        autoHold = true;
        return;
      }
    }
    if (avg > 20 && i >= 0 && i < ORDER.length - 1) {
      console.warn('[SL.render] average frame time ' + avg.toFixed(1) + ' ms; quality ' + R.quality + ' -> ' + ORDER[i + 1]);
      autoProbe = { from: R.quality, avg };

  }

  function frame() {
    if (!R.ctx) return;
    const now = performance.now();
    // frames rendered inside SL.debug.sim are not real frames: keep them out of fps and auto quality
    if (SL.debug && SL.debug.simulating) lastFrame = 0; else trackTiming(now);
    // a DPR-only change (window moved to another monitor) fires no resize event
    if (!dirty && Math.min(window.devicePixelRatio || 1, 2) !== R.dpr) dirty = true;
    if (dirty) measure();

    const ctx = R.ctx, q = R.q;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#03040a';
    ctx.fillRect(0, 0, R.scene.width, R.scene.height);
    const sh = SL.fx && SL.fx.shakeOffset ? SL.fx.shakeOffset() : null;
    const sx = sh ? sh.x : 0, sy = sh ? sh.y : 0;
    R.base.s = q;
    R.base.shakeX = sx;
    R.base.shakeY = sy;
    R.base.x = sx * q;
    R.base.y = sy * q;
    ctx.setTransform(q, 0, 0, q, R.base.x, R.base.y);
    try {

    } catch (err) {
      reportDrawError(err);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    const fx = mergeFx();
    let done = false;

    if (!done) { ensure2D(); if (!glActive) composite2D(fx); }

    if (hudCtx) {
      hudCtx.setTransform(1, 0, 0, 1, 0, 0);
      hudCtx.clearRect(0, 0, bw, bh);
      hudCtx.setTransform(bw / W, 0, 0, bh / H, 0, 0);
      hudCtx.globalAlpha = 1;
      hudCtx.globalCompositeOperation = 'source-over';
      try {
        if (SL.hud && typeof SL.hud.draw === 'function') SL.hud.draw(hudCtx);
      } catch (err) { reportDrawError(err); }
      hudCtx.setTransform(bw / W, 0, 0, bh / H, 0, 0);
      hudCtx.globalAlpha = 1;
      hudCtx.globalCompositeOperation = 'source-over';
      try {
        if (SL.debug && typeof SL.debug.drawOverlay === 'function') SL.debug.drawOverlay(hudCtx);
      } catch (err) { reportDrawError(err); }
    }

    if (ambCtx && frameNo % 4 === 0) {
      ambCtx.globalAlpha = 1;
      ambCtx.drawImage(R.scene, 0, 0, ambientEl.width, ambientEl.height);
    }
    clearFx(fxD);
  }

  // ------------------------------------------------------------------ boot
  function boot() {
    appEl = document.getElementById('app');
    gameEl = document.getElementById('game');
    hudEl = document.getElementById('hud');
    ambientEl = document.getElementById('ambient');
    glCanvas = document.getElementById('screen');
    if (!gameEl) {
      gameEl = document.createElement('div');
      gameEl.id = 'game';
      document.body.appendChild(gameEl);
    }
    if (!glCanvas) {
      glCanvas = document.createElement('canvas');
      glCanvas.id = 'screen';
      gameEl.insertBefore(glCanvas, gameEl.firstChild);
    }
    glCanvas.classList.add('sl-screen-canvas');
    if (!hudEl) {
      hudEl = document.createElement('canvas');
      hudEl.id = 'hud';
      gameEl.appendChild(hudEl);
    }
    try { cqSupported = !!(window.CSS && CSS.supports && CSS.supports('width', '1cqw')); } catch (e) { cqSupported = false; }

    R.scene = document.createElement('canvas');
    R.ctx = R.scene.getContext('2d', { alpha: false });
    hudCtx = hudEl.getContext('2d');
    R.hud = hudCtx;
    if (ambientEl) {
      ambientEl.width = 36;
      ambientEl.height = 64;
      ambCtx = ambientEl.getContext('2d', { alpha: false });
      ambCtx.imageSmoothingQuality = 'high';
      ambCtx.fillStyle = '#04050b';
      ambCtx.fillRect(0, 0, 36, 64);
    }
    vigCanvas = makeVignette();

    const params = (SL.debug && SL.debug.params) || {};
    noGL = params.nogl === '1' || params.nogl === 'true';
    const setting = (SL.save && SL.save.settings && SL.save.settings.quality) || 'auto';
    const forced = QUALITY[params.quality] ? params.quality : null;
    R.qualitySetting = forced || setting;
    R.auto = !forced && setting === 'auto';
    R.quality = forced || (QUALITY[setting] ? setting : 'high');
    R.q = QUALITY[R.quality].q;

    measure();
    R.scene.width = Math.round(W * R.q);
    R.scene.height = Math.round(H * R.q);
    initGL();
    chooseOutput();
    if (SL.fx && SL.fx.setCap) SL.fx.setCap(QUALITY[R.quality].particles);

    glCanvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      glLost = true;
      console.warn('[SL.render] WebGL context lost; using 2D output until it is restored.');
      chooseOutput();
    }, false);
    glCanvas.addEventListener('webglcontextrestored', () => {
      glLost = false;
      G = null;
      const gl = getContext(glCanvas);
      if (gl) {
        try { G = buildGL(gl); sizeTargets(); } catch (err) { console.warn('[SL.render] WebGL restore failed.', err && err.message); G = null; }
      }
      chooseOutput();
    }, false);

    if (typeof ResizeObserver === 'function') {
      const ro = new ResizeObserver(() => { dirty = true; });
      ro.observe(gameEl);
      if (appEl) ro.observe(appEl);
    }
    window.addEventListener('resize', () => { dirty = true; });
    window.addEventListener('orientationchange', () => { dirty = true; });
    SL.bus.on('settingsChanged', (e) => {
      if (!e || e.key !== 'quality' || QUALITY[params.quality]) return;
      R.qualitySetting = e.value;
      R.auto = e.value === 'auto';
      autoProbe = null;
      autoHold = false;
      R.setQuality(R.auto ? 'high' : e.value);
    });
  }

  SL.onBoot(boot);
})(window.SL = window.SL || {});

<script>
/* 05_art.js (core)
   Provides: SL.art = { define(key, w, h, drawFn(ctx, w, h), {pad, res}), get(key), has(key), prewarm(keys),
   drawSprite(ctx, key, x, y, rot, scale, alpha), getFlash(key), drawFlash(ctx, key, x, y, rot, scale, alpha),
   glow(color, radius, {core}), drawGlow(ctx, x, y, radius, color, alpha), ring(color, radius, width),
   metal(ctx, path, {base, light, dark, angle, rim, spec, specPos, edge, bounds}), panelLines(ctx, path, color, alpha),
   emissive(ctx, path, color, glow, {stroke}), flame(ctx, x, y, width, length, inner, outer, t),
   noise(w, h, {scale, octaves, seed, gain, lacunarity, ridged, warp}), noiseCanvas(w, h, {palette, alphaCurve, ...}),
   poly(points), symPath(cx, halfPoints), canvas(w, h), lightDir } and SL.pal (shared palette).
   Sprites are generated once (lazily on first get, or in prewarm) and cached; generators may use
   shadowBlur, filters and gradients freely. Per-frame helpers (drawSprite, drawGlow, flame) only blit
   cached canvases. */
(function (SL) {
  'use strict';

  const U = SL.util, C = SL.color;
  const TAU = Math.PI * 2;
  const gens = Object.create(null);
  const cache = new Map();
  const flashCache = new WeakMap();
  const glowCache = new Map();
  const flameCache = new Map();
  const ringCache = new Map();
  const canvasWraps = new WeakMap();

  SL.pal = {
    player: { hull: '#e8eef7', trim: '#3fc8ff', glow: '#7fe3ff', engine: '#9fe8ff' },
    player2: { hull: '#2b2f3a', trim: '#ffb53f', glow: '#ffd27a', engine: '#ffb070' },
    enemy: { hull: '#1c1f2b', hull2: '#3a3f55', seam: '#ff2f6d', glow: '#ff5c8a', engine: '#ff7a3d' },
    ebullet: { pink: '#ff4fd8', orange: '#ff8a3d', violet: '#b26bff', red: '#ff3b4f' },
    credit: '#ffd34d',
    rescue: '#5dffb0',
    space: { deep: '#03040a', navy: '#070b1c', violet: '#1a0f2e', teal: '#06222a' },
    ui: { cyan: '#3fc8ff', amber: '#ffb53f', magenta: '#ff2f6d', text: '#e8eef7', dim: '#93a0ba' },
  };

  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    return c;
  }

  function placeholder(key) {
    const s = 32;
    const c = makeCanvas(s, s);
    const x = c.getContext('2d');
    x.fillStyle = '#ff00ff';
    x.fillRect(0, 0, s, s);
    x.fillStyle = '#000';
    x.fillRect(0, 0, s / 2, s / 2);
    x.fillRect(s / 2, s / 2, s / 2, s / 2);
    return { key, canvas: c, w: s, h: s, pad: 0, res: 1, cw: s, ch: s, placeholder: true };
  }

  /** {canvas} (or a bare canvas wrapped by the caller) -> a full sprite record drawn at the canvas size. */
  function normalizeSprite(o) {
    const c = o.canvas;
    const w = o.w || c.width, h = o.h || c.height;
    return Object.assign(o, { key: o.key || null, w, h, pad: o.pad || 0, res: o.res || 1, cw: w + 2 * (o.pad || 0), ch: h + 2 * (o.pad || 0) });
  }

  function build(key, g) {
    const pad = g.pad, res = g.res;
    const cw = g.w + pad * 2, ch = g.h + pad * 2;
    const canvas = makeCanvas(cw * res, ch * res);
    const ctx = canvas.getContext('2d');
    ctx.scale(res, res);
    ctx.translate(pad, pad);
    try {
      g.fn(ctx, g.w, g.h);
    } catch (err) {
      console.error('[SL.art] sprite generator "' + key + '" threw:', err);
      return placeholder(key);
    }
    return { key, canvas, w: g.w, h: g.h, pad, res, cw, ch };
  }

  /** Inverse-transformed canvas rectangle in the current user space (default gradient bounds). */
  function localBounds(ctx) {
    let m;
    try { m = ctx.getTransform().inverse(); } catch (e) { m = null; }
    const cw = ctx.canvas.width, ch = ctx.canvas.height;
    if (!m) return { x: 0, y: 0, w: cw, h: ch };
    const pts = [[0, 0], [cw, 0], [0, ch], [cw, ch]].map(([x, y]) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f]);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const x0 = Math.min(...xs), y0 = Math.min(...ys);
    return { x: x0, y: y0, w: Math.max(...xs) - x0, h: Math.max(...ys) - y0 };
  }

  // ------------------------------------------------------------------ noise
  function gradTable(seed) {
    const rng = SL.makeRng(seed);
    const gx = new Float32Array(256), gy = new Float32Array(256), perm = new Uint8Array(512);
    for (let i = 0; i < 256; i++) {
      const a = rng.next() * TAU;
      gx[i] = Math.cos(a);
      gy[i] = Math.sin(a);
      perm[i] = i;
    }
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(rng.next() * (i + 1));
      const t = perm[i]; perm[i] = perm[j]; perm[j] = t;
    }
    for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
    return { gx, gy, perm };
  }
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  /** Periodic 2D gradient noise in about [-0.7, 0.7]; periods px, py in lattice cells. */
  function pnoise(T, x, y, px, py) {
    const xf = Math.floor(x), yf = Math.floor(y);
    const fx = x - xf, fy = y - yf;
    const x0 = ((xf % px) + px) % px, y0 = ((yf % py) + py) % py;
    const x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
    const p = T.perm;
    const h00 = p[(p[x0 & 255] + y0) & 255], h10 = p[(p[x1 & 255] + y0) & 255];
    const h01 = p[(p[x0 & 255] + y1) & 255], h11 = p[(p[x1 & 255] + y1) & 255];
    const n00 = T.gx[h00] * fx + T.gy[h00] * fy;
    const n10 = T.gx[h10] * (fx - 1) + T.gy[h10] * fy;
    const n01 = T.gx[h01] * fx + T.gy[h01] * (fy - 1);
    const n11 = T.gx[h11] * (fx - 1) + T.gy[h11] * (fy - 1);
    const u = fade(fx), v = fade(fy);
    const a = n00 + (n10 - n00) * u, b = n01 + (n11 - n01) * u;
    return a + (b - a) * v;
  }

  function noise(w, h, o) {
    o = o || {};
    w = Math.max(1, Math.floor(w));
    h = Math.max(1, Math.floor(h));
    const scale = o.scale || 64;
    const octaves = U.clamp(o.octaves || 4, 1, 8);
    const gain = o.gain != null ? o.gain : 0.5;
    const lac = Math.max(1, Math.round(o.lacunarity || 2));
    const seed = o.seed != null ? o.seed : 1;
    const warp = o.warp || 0;
    const T = gradTable(seed), Tw = warp ? gradTable(seed + 7919) : null;
    const cx = Math.max(1, Math.round(w / scale)), cy = Math.max(1, Math.round(h / scale));
    const out = new Float32Array(w * h);
    let lo = Infinity, hi = -Infinity;
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        let u = i / w, v = j / h;
        if (warp) {
          const wx = pnoise(Tw, u * cx, v * cy, cx, cy) + 0.5 * pnoise(Tw, u * cx * 2 + 5.2, v * cy * 2 + 1.3, cx * 2, cy * 2);
          const wy = pnoise(Tw, u * cx + 9.7, v * cy + 3.1, cx, cy) + 0.5 * pnoise(Tw, u * cx * 2 + 2.8, v * cy * 2 + 7.4, cx * 2, cy * 2);
          u += wx * warp;
          v += wy * warp;
        }
        let sum = 0, amp = 1, fX = cx, fY = cy;
        for (let k = 0; k < octaves; k++) {
          let n = pnoise(T, u * fX, v * fY, fX, fY);
          if (o.ridged) { n = 1 - Math.abs(n * 1.4); n *= n; }
          sum += n * amp;
          amp *= gain;
          fX *= lac;
          fY *= lac;
        }
        out[j * w + i] = sum;
        if (sum < lo) lo = sum;
        if (sum > hi) hi = sum;
      }
    }
    const span = hi - lo || 1;
    for (let k = 0; k < out.length; k++) out[k] = (out[k] - lo) / span;
    return out;
  }

  function paletteLUT(palette, alphaCurve) {
    const stops = (palette && palette.length ? palette : [[0, '#000000'], [1, '#ffffff']])
      .map((s) => ({ t: s[0], c: C.parse(s[1]), a: s.length > 2 ? s[2] : C.parse(s[1])[3] }))
      .sort((a, b) => a.t - b.t);
    const lut = new Uint8ClampedArray(256 * 4);
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      let k = 0;
      while (k < stops.length - 1 && stops[k + 1].t < t) k++;
      const s0 = stops[k], s1 = stops[Math.min(k + 1, stops.length - 1)];
      const f = s1.t > s0.t ? U.clamp((t - s0.t) / (s1.t - s0.t), 0, 1) : 0;
      let a = s0.a + (s1.a - s0.a) * f;
      if (typeof alphaCurve === 'function') a *= U.clamp(+alphaCurve(t) || 0, 0, 1);
      else if (typeof alphaCurve === 'number') a *= Math.pow(t, alphaCurve);
      lut[i * 4] = s0.c[0] + (s1.c[0] - s0.c[0]) * f;
      lut[i * 4 + 1] = s0.c[1] + (s1.c[1] - s0.c[1]) * f;
      lut[i * 4 + 2] = s0.c[2] + (s1.c[2] - s0.c[2]) * f;
      lut[i * 4 + 3] = a * 255;
    }
    return lut;
  }

  // ------------------------------------------------------------------ public API
  const A = SL.art = {
    lightDir: { x: -0.6, y: -0.8 },

    define(key, w, h, fn, opts) {
      if (typeof fn !== 'function') { console.warn('[SL.art] define("' + key + '") needs a draw function'); return; }
      opts = opts || {};
      gens[key] = { w: Math.max(1, w), h: Math.max(1, h), fn, pad: opts.pad != null ? opts.pad : 2, res: opts.res || 1 };
      cache.delete(key);
    },

    has(key) { return !!gens[key] || cache.has(key); },

    get(key) {
      // a sprite object (from get, or built by hand as {canvas, cw, ch}) passes straight through; a bare canvas is
      // wrapped once (cached)
      if (key && typeof key === 'object') {
        if (key.canvas) return key.cw ? key : normalizeSprite(key);
        if (typeof key.getContext === 'function') {
          let wrap = canvasWraps.get(key);
          if (!wrap) { wrap = normalizeSprite({ canvas: key }); canvasWraps.set(key, wrap); }
          return wrap;
        }
      }
      let s = cache.get(key);
      if (s) return s;
      const g = gens[key];
      if (!g) {
        U.warnOnce('art:' + key, 'unknown sprite "' + key + '"; drawing a placeholder');
        s = placeholder(key);
      } else s = build(key, g);
      cache.set(key, s);
      return s;
    },

    prewarm(keys) { (keys || Object.keys(gens)).forEach((k) => A.get(k)); },

    drawSprite(ctx, key, x, y, rot, scale, alpha) {
      if (!key) return;
      const s = typeof key === 'string' || !key.cw ? A.get(key) : key;
      scale = scale == null ? 1 : scale;
      alpha = alpha == null ? 1 : alpha;
      if (alpha <= 0 || scale === 0) return;
      const w = s.cw * scale, h = s.ch * scale;
      const pa = ctx.globalAlpha;
      if (alpha !== 1) ctx.globalAlpha = pa * alpha;
      if (!rot) ctx.drawImage(s.canvas, x - w / 2, y - h / 2, w, h);
      else {
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.drawImage(s.canvas, -w / 2, -h / 2, w, h);
        ctx.rotate(-rot);
        ctx.translate(-x, -y);
      }
      if (alpha !== 1) ctx.globalAlpha = pa;
    },

    /** White silhouette of a sprite (cached), for hit flashes. */
    getFlash(key) {
      const s = typeof key === 'string' || !key.cw ? A.get(key) : key;
      let f = flashCache.get(s);
      if (f) return f;
      const c = makeCanvas(s.canvas.width, s.canvas.height);
      const x = c.getContext('2d');
      x.drawImage(s.canvas, 0, 0);
      x.globalCompositeOperation = 'source-in';
      x.fillStyle = '#ffffff';
      x.fillRect(0, 0, c.width, c.height);
      f = { key: s.key, canvas: c, w: s.w, h: s.h, pad: s.pad, res: s.res, cw: s.cw, ch: s.ch, src: s };
      flashCache.set(s, f);

    },

    drawFlash(ctx, key, x, y, rot, scale, alpha) {
      if (!(alpha > 0)) return;
      A.drawSprite(ctx, A.getFlash(key), x, y, rot, scale, Math.min(1, alpha));
    },

    /** Cached radial glow canvas (2r x 2r): white-hot core, color body, soft transparent edge. */
    glow(color, radius, opts) {
      const core = (opts && opts.core) || '#ffffff';
      const r = Math.max(2, Math.ceil(radius || 32));
      const key = color + '|' + r + '|' + core;
      let c = glowCache.get(key);
      if (c) return c;
      c = makeCanvas(r * 2, r * 2);
      const x = c.getContext('2d');
      const g = x.createRadialGradient(r, r, 0, r, r, r);
      g.addColorStop(0, C.rgba(core, 1));
      g.addColorStop(0.1, C.rgba(C.mix(core, color, 0.45), 0.95));
      g.addColorStop(0.24, C.rgba(color, 0.72));
      g.addColorStop(0.44, C.rgba(color, 0.3));
      g.addColorStop(0.7, C.rgba(color, 0.09));
      g.addColorStop(1, C.rgba(color, 0));

    /** Additive blit of a cached glow (one 64 px master per color, scaled). */
    drawGlow(ctx, x, y, radius, color, alpha) {
      if (!(radius > 0)) return;
      alpha = alpha == null ? 1 : alpha;
      if (alpha <= 0) return;
      const c = A.glow(color, 64);
      const pa = ctx.globalAlpha, po = ctx.globalCompositeOperation;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = pa * alpha;

      ctx.globalCompositeOperation = po;

    /** Cached glowing ring canvas (2r x 2r) with the given line width (px at that radius). */
    ring(color, radius, width) {
      const r = Math.max(4, Math.ceil(radius || 64));
      const lw = Math.max(1, width || r * 0.08);
      const key = color + '|' + r + '|' + lw;
      let c = ringCache.get(key);
      if (c) return c;
      c = makeCanvas(r * 2, r * 2);
      const x = c.getContext('2d');
      const inner = Math.max(0, r - lw * 3.2);
      const g = x.createRadialGradient(r, r, inner, r, r, r);
      const mid = U.clamp((r - lw * 1.6 - inner) / (r - inner), 0.05, 0.95);
      g.addColorStop(0, C.rgba(color, 0));
      g.addColorStop(mid * 0.7, C.rgba(color, 0.25));
      g.addColorStop(mid, C.rgba(C.mix(color, '#ffffff', 0.6), 1));

    },

    /** Glossy metal fill lit from the upper left: gradient body, specular band, inner edge shading,
        rim light on lit edges and a dark outline. For sprite generators. */
    metal(ctx, path, o) {
      o = o || {};
      const base = o.base || '#9aa6bb';
      const light = o.light || C.lighten(base, 0.55);
      const dark = o.dark || C.darken(base, 0.62);
      const b = o.bounds || localBounds(ctx);
      const ang = o.angle != null ? o.angle : Math.atan2(A.lightDir.y, A.lightDir.x);
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const ext = Math.max(b.w, b.h) * 0.55;
      const dx = Math.cos(ang) * ext, dy = Math.sin(ang) * ext;
      ctx.save();
      const g = ctx.createLinearGradient(cx + dx, cy + dy, cx - dx, cy - dy);
      g.addColorStop(0, light);
      g.addColorStop(0.36, base);
      g.addColorStop(0.7, C.mix(base, dark, 0.55));
      g.addColorStop(1, dark);

      ctx.clip(path);
      const spec = o.spec != null ? o.spec : 0.55;
      if (spec > 0) {
        const p0 = o.specPos != null ? o.specPos : 0.3;
        const sg = ctx.createLinearGradient(cx + dx, cy + dy, cx - dx, cy - dy);
        const st = (t) => U.clamp(t, 0, 1);
        sg.addColorStop(st(p0 - 0.13), 'rgba(255,255,255,0)');
        sg.addColorStop(st(p0 - 0.025), 'rgba(255,255,255,' + spec + ')');
        sg.addColorStop(st(p0 + 0.02), 'rgba(255,255,255,' + spec * 0.42 + ')');
        sg.addColorStop(st(p0 + 0.15), 'rgba(255,255,255,0)');
        sg.addColorStop(st(p0 + 0.3), 'rgba(255,255,255,0)');
        sg.addColorStop(st(p0 + 0.36), 'rgba(255,255,255,' + spec * 0.16 + ')');
        sg.addColorStop(st(p0 + 0.42), 'rgba(255,255,255,0)');
        ctx.fillStyle = sg;
        ctx.fill(path);
      }
      ctx.lineJoin = 'round';
      const edge = o.edge != null ? o.edge : 2.6;
      if (edge > 0) {
        ctx.strokeStyle = C.rgba(dark, 0.6);
        ctx.lineWidth = edge * 2;
        ctx.stroke(path);
      }
      const rg = ctx.createLinearGradient(cx + dx, cy + dy, cx - dx * 0.2, cy - dy * 0.2);
      rg.addColorStop(0, C.rgba(C.mix(light, '#ffffff', 0.5), 0.95));
      rg.addColorStop(1, C.rgba(light, 0));
      ctx.strokeStyle = rg;
      ctx.lineWidth = o.rimLight != null ? o.rimLight : 2.4;
      ctx.stroke(path);
      ctx.restore();
      if (o.rim !== false) {
        ctx.save();
        ctx.lineJoin = 'round';
        ctx.strokeStyle = typeof o.rim === 'string' ? o.rim : C.rgba(C.darken(dark, 0.45), 0.92);
        ctx.lineWidth = o.rimWidth || 1.3;

    },

    /** Engraved panel seams: dark groove plus a faint lower-right highlight. */
    panelLines(ctx, path, color, alpha) {
      alpha = alpha == null ? 0.45 : alpha;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 1;
      ctx.strokeStyle = C.rgba(color || '#000000', alpha);
      ctx.stroke(path);
      ctx.translate(0.8, 0.8);
      ctx.strokeStyle = C.rgba('#ffffff', alpha * 0.32);
      ctx.stroke(path);
      ctx.restore();
    },

    /** Glowing seams and lights (fill, or stroke with {stroke: width}). */
    emissive(ctx, path, color, glow, o) {
      glow = glow == null ? 8 : glow;
      const stroke = o && o.stroke;
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = glow;
      if (stroke) {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = color;
        ctx.lineWidth = stroke;
        ctx.stroke(path);
        ctx.stroke(path);
      } else {
        ctx.fillStyle = color;
        ctx.fill(path);
        ctx.fill(path);
      }
      ctx.shadowBlur = 0;
      const hot = C.rgba(C.mix(color, '#ffffff', 0.65), 0.7);
      if (stroke) {
        ctx.strokeStyle = hot;
        ctx.lineWidth = Math.max(0.6, stroke * 0.45);
        ctx.stroke(path);
      } else {
        ctx.fillStyle = hot;
        ctx.save();
        ctx.clip(path);
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.85;
        ctx.fill(path);
        ctx.restore();
      }
      ctx.restore();
    },

    /** Animated engine plume pointing +y from (x, y), additive. Cheap: two cached blits. */
    flame(ctx, x, y, width, length, inner, outer, t) {
      if (!(length > 0) || !(width > 0)) return;
      inner = inner || '#ffffff';
      outer = outer || '#3fc8ff';
      const key = inner + '|' + outer;
      let spr = flameCache.get(key);
      if (!spr) {
        spr = makeFlame(inner, outer);
        if (flameCache.size > 64) flameCache.clear();
        flameCache.set(key, spr);
      }
      t = t || 0;
      const ph = x * 0.37 + y * 0.11;
      const flick = 0.84 + 0.09 * Math.sin(t * 47 + ph) + 0.07 * Math.sin(t * 29.3 + ph * 1.7);
      const L = length * flick;
      const wd = width * (0.93 + 0.07 * Math.sin(t * 61 + ph));
      const po = ctx.globalCompositeOperation;
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(spr, x - wd / 2, y - wd * 0.3, wd, L + wd * 0.3);
      const gc = A.glow(outer, 64);
      const gr = wd * 1.05;
      ctx.drawImage(gc, x - gr, y - gr * 0.85, gr * 2, gr * 2);
      ctx.globalCompositeOperation = po;
    },

    noise,

    noiseCanvas(w, h, o) {
      o = o || {};
      w = Math.max(1, Math.floor(w));
      h = Math.max(1, Math.floor(h));
      const f = noise(w, h, o);
      const lut = paletteLUT(o.palette, o.alphaCurve);
      const c = makeCanvas(w, h);
      const x = c.getContext('2d');
      const img = x.createImageData(w, h);
      const d = img.data;
      for (let i = 0; i < f.length; i++) {
        const k = Math.min(255, Math.max(0, Math.round(f[i] * 255))) * 4;
        const j = i * 4;
        d[j] = lut[k];
        d[j + 1] = lut[k + 1];
        d[j + 2] = lut[k + 2];
        d[j + 3] = lut[k + 3];

      x.putImageData(img, 0, 0);
      return c;
    },

    /** Path2D from a flat [x0, y0, x1, y1, ...] or [[x, y], ...] list (closed). */
    poly(points, open) {
      const p = new Path2D();
      const flat = Array.isArray(points[0]) ? points.flat() : points;
      for (let i = 0; i < flat.length; i += 2) {
        if (i === 0) p.moveTo(flat[0], flat[1]); else p.lineTo(flat[i], flat[i + 1]);
      }
      if (!open) p.closePath();
      return p;
    },

    /** Closed symmetric hull: halfPoints are [dx, y] pairs down the right side (dx >= 0 from cx). */
    symPath(cx, halfPoints) {
      const p = new Path2D();
      const pts = Array.isArray(halfPoints[0]) ? halfPoints : chunk(halfPoints);
      pts.forEach(([dx, y], i) => { if (i === 0) p.moveTo(cx + dx, y); else p.lineTo(cx + dx, y); });
      for (let i = pts.length - 1; i >= 0; i--) p.lineTo(cx - pts[i][0], pts[i][1]);
      p.closePath();
      return p;
    },

    canvas: makeCanvas,
    localBounds,
  };

  function chunk(flat) {
    const out = [];
    for (let i = 0; i < flat.length; i += 2) out.push([flat[i], flat[i + 1]]);
    return out;
  }

  function makeFlame(inner, outer) {
    const w = 32, h = 128;
    const c = makeCanvas(w, h);
    const x = c.getContext('2d');
    x.globalCompositeOperation = 'lighter';
    const outerGlow = A.glow(outer, 32, { core: outer });
    const innerGlow = A.glow(inner, 32, { core: '#ffffff' });
    const n = 26;
    for (let i = 0; i < n; i++) {
      const k = i / (n - 1);
      const r = 15 * (1 - k * 0.82);
      const yy = 6 + k * (h - 26);
      x.globalAlpha = 0.34 * Math.pow(1 - k, 1.35);
      x.drawImage(outerGlow, w / 2 - r, yy - r, r * 2, r * 2);
    }
    for (let i = 0; i < 14; i++) {
      const k = i / 13;
      const r = 7.5 * (1 - k * 0.75);
      const yy = 5 + k * (h * 0.42);
      x.globalAlpha = 0.5 * Math.pow(1 - k, 1.6);
      x.drawImage(innerGlow, w / 2 - r, yy - r, r * 2, r * 2);
    }
    return c;
  }
})(window.SL = window.SL || {});

<script>
/* 06_fx.js (core)
   Provides: SL.fx = { emit(p), explode(x, y, {size, palette, debris, shake, sound, scale}), hit(x, y, color, {dir}),
   sparks(x, y, {count, color, speed, angle, spread, life, size}), shockwave(x, y, {radius, duration, strength,
   ring, color}), shake(px, seconds), flash(color, alpha, seconds), chromatic(amount, seconds), hitstop(seconds),
   slowmo(scale, seconds),
   text(x, y, str, {color, size, life, rise, font}), update(dt), realUpdate(realDt), draw(ctx), clear(),
   count(), setCap(n), cap, shakeOffset(), timeScale(), hitstopLeft(), PALETTES }.
   Particles live in one pooled ring buffer (cap 2500 / 1600 / 900 by quality; the oldest is dropped
   when full). Sprites per shape and color are generated once. Normal-blend particles (smoke, debris)
   draw before additive ones. Shake, flash, hit-stop and slow-mo run on real time. */
(function (SL) {
  'use strict';

  const U = SL.util, C = SL.color;
  const TAU = Math.PI * 2;
  const rnd = Math.random;
  const rr = (a, b) => a + (b - a) * rnd();

  // ------------------------------------------------------------------ sprites
  const SHAPES = { glow: 0, spark: 1, square: 2, ring: 3, smoke: 4, debris: 5, sprite: 6, fire: 7 };
  const spriteCache = new Map();

  function qColor(c) {
    const p = C.parse(c);
    return C.toHex(p[0] & 0xf8, p[1] & 0xf8, p[2] & 0xf8);
  }

  function makeShape(shape, color) {
    const A = SL.art;
    if (shape === SHAPES.glow) return A.glow(color, 32);
    if (shape === SHAPES.ring) return A.ring(color, 64, 5);
    if (shape === SHAPES.spark) {
      const c = A.canvas(64, 16), x = c.getContext('2d');
      x.translate(32, 8);
      x.scale(4, 1);
      const g = x.createRadialGradient(0, 0, 0, 0, 0, 8);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.28, C.rgba(C.mix(color, '#ffffff', 0.5), 0.95));
      g.addColorStop(0.6, C.rgba(color, 0.55));
      g.addColorStop(1, C.rgba(color, 0));
      x.fillStyle = g;
      x.beginPath();
      x.arc(0, 0, 8, 0, TAU);
      x.fill();
      return c;
    }
    if (shape === SHAPES.square) {
      const c = A.canvas(16, 16), x = c.getContext('2d');
      x.fillStyle = color;
      x.fillRect(2, 2, 12, 12);
      x.fillStyle = C.rgba('#ffffff', 0.55);
      x.fillRect(4, 4, 6, 6);
      return c;
    }
    if (shape === SHAPES.smoke) {
      const c = A.canvas(64, 64), x = c.getContext('2d');
      const mask = smokeMask();
      x.drawImage(mask, 0, 0);
      x.globalCompositeOperation = 'source-in';
      const g = x.createLinearGradient(8, 8, 56, 56);
      g.addColorStop(0, C.lighten(color, 0.22));
      g.addColorStop(1, C.darken(color, 0.3));
      x.fillStyle = g;
      x.fillRect(0, 0, 64, 64);
      return c;
    }
    if (shape === SHAPES.fire) {
      const c = A.canvas(64, 64), x = c.getContext('2d');
      x.drawImage(fireMask(), 0, 0);
      x.globalCompositeOperation = 'source-in';
      const g = x.createRadialGradient(28, 26, 2, 32, 32, 34);
      g.addColorStop(0, C.mix(color, '#ffffff', 0.5));
      g.addColorStop(0.55, color);
      g.addColorStop(1, C.darken(color, 0.35));
      x.fillStyle = g;
      x.fillRect(0, 0, 64, 64);
      return c;
    }
    if (shape === SHAPES.debris) {
      const out = [];
      for (let v = 0; v < 4; v++) {
        const c = A.canvas(24, 24), x = c.getContext('2d');
        const n = 3 + v % 3, pts = [];
        for (let i = 0; i < n; i++) {
          const a = (i / n) * TAU + rr(-0.4, 0.4);
          const r = rr(5, 10.5);
          pts.push(12 + Math.cos(a) * r, 12 + Math.sin(a) * r * rr(0.45, 1));
        }
        const path = A.poly(pts);
        A.metal(x, path, { base: color, spec: 0.7, edge: 1.2, rimWidth: 0.8, bounds: { x: 0, y: 0, w: 24, h: 24 } });
        out.push(c);
      }
      return out;
    }
    return A.glow(color, 32);
  }

  // Billowy fire puff: radial falloff eaten into by fbm noise, so overlapping puffs read as flame.
  let fireMaskCanvas = null;
  function fireMask() {
    if (fireMaskCanvas) return fireMaskCanvas;
    const A = SL.art, S = 64;
    const n = A.noise(S, S, { scale: 12, octaves: 4, seed: 91, warp: 0.25 });
    const c = A.canvas(S, S), x = c.getContext('2d');
    const img = x.createImageData(S, S), d = img.data;
    for (let j = 0; j < S; j++) {
      for (let i = 0; i < S; i++) {
        const dx = ((i + 0.5) / S) * 2 - 1, dy = ((j + 0.5) / S) * 2 - 1;
        const r = Math.sqrt(dx * dx + dy * dy);
        let a = Math.max(0, 1 - r) * 1.7 - (1 - n[j * S + i]) * 0.9 * (0.35 + r);
        a = a <= 0 ? 0 : a >= 1 ? 1 : a * a * (3 - 2 * a);
        const k = (j * S + i) * 4;
        d[k] = d[k + 1] = d[k + 2] = 255;
        d[k + 3] = Math.round(a * 255);
      }
    }
    x.putImageData(img, 0, 0);
    fireMaskCanvas = c;
    return c;
  }

  let smokeMaskCanvas = null;
  function smokeMask() {
    if (smokeMaskCanvas) return smokeMaskCanvas;
    const A = SL.art;
    const c = A.canvas(64, 64), x = c.getContext('2d');
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * TAU, r = i ? 11 : 0;
      const cx = 32 + Math.cos(a) * r, cy = 32 + Math.sin(a) * r;
      const rad = i ? 17 : 24;
      const g = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, 'rgba(255,255,255,0.55)');
      g.addColorStop(0.6, 'rgba(255,255,255,0.22)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g;
      x.beginPath();
      x.arc(cx, cy, rad, 0, TAU);
      x.fill();
    }
    const n = A.noiseCanvas(64, 64, { scale: 16, octaves: 3, seed: 77, palette: [[0, '#ffffff', 0.25], [1, '#ffffff', 1]] });
    x.globalCompositeOperation = 'destination-in';
    x.drawImage(n, 0, 0);
    smokeMaskCanvas = c;
    return c;
  }

  function sprite(shape, color) {
    const key = shape + '|' + color;
    let s = spriteCache.get(key);
    if (!s) {
      if (spriteCache.size > 1500) spriteCache.clear();
      s = makeShape(shape, color);
      spriteCache.set(key, s);
    }
    return s;
  }
  /** Six-step color ramp of a shape (cached): c1 -> c2, or c1 -> c2 -> c3 when c3 is given. */
  function ramp(shape, c1, c2, c3) {
    const key = 'r' + shape + '|' + c1 + '|' + c2 + '|' + (c3 || '');
    let r = spriteCache.get(key);
    if (!r) {
      r = [];
      for (let i = 0; i < 6; i++) {
        const u = i / 5;
        const c = !c3 ? C.mix(c1, c2, u) : u < 0.5 ? C.mix(c1, c2, u * 2) : C.mix(c2, c3, u * 2 - 1);
        r.push(sprite(shape, qColor(c)));
      }
      spriteCache.set(key, r);
    }
    return r;
  }

  // ------------------------------------------------------------------ particle pool (ring buffer)
  const MAXCAP = 2500;
  let cap = 2500;
  let pool = [];
  let head = 0, used = 0, alive = 0;
  function newParticle() {
    return {
      alive: false, x: 0, y: 0, vx: 0, vy: 0, life: 1, age: 0, size: 8, size2: 8, alpha: 1, alpha2: 0,
      add: true, drag: 0, gravity: 0, rot: 0, spin: 0, stretch: 0, shape: 0, spr: null, ramp: null, sprites: null,
      trail: null, trailEvery: 0, trailT: 0, ease: 0,
    };
  }
  for (let i = 0; i < cap; i++) pool.push(newParticle());

  function alloc() {
    if (used >= cap) {
      const old = pool[head];
      if (old.alive) { old.alive = false; alive--; }
      head = (head + 1) % cap;
      used--;
    }
    const p = pool[(head + used) % cap];
    used++;
    alive++;
    p.alive = true;
    p.age = 0;
    p.ramp = null;
    p.sprites = null;
    p.trail = null;
    p.rot = 0;
    p.spin = 0;
    p.stretch = 0;
    p.gravity = 0;
    p.drag = 0;
    p.ease = 0;
    return p;
  }

  /** Internal fast spawn (no option object). */
  function spawn(shape, x, y, vx, vy, life, size, size2, a1, a2, add, drag, spr, rmp) {
    const p = alloc();
    p.shape = shape; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = Math.max(0.01, life);
    p.size = size; p.size2 = size2; p.alpha = a1; p.alpha2 = a2; p.add = add; p.drag = drag;
    p.spr = spr; p.ramp = rmp;
    return p;
  }

  // ------------------------------------------------------------------ palettes
  const PALETTES = {
    enemy: { flash: '#fff2dc', core: '#ffd27a', fire: ['#ffe7a0', '#ff7a2f', '#b8183c'], spark: '#ffd88a', ember: '#ff7a3d', smoke: '#2a2030', ring: '#ff9a5c', debris: '#3a3f55' },
    player: { flash: '#ffffff', core: '#c9f6ff', fire: ['#eefcff', '#55cfff', '#1c4fd0'], spark: '#c4f4ff', ember: '#7fe3ff', smoke: '#1a2433', ring: '#9fe8ff', debris: '#c8d2e2' },
    blue: { flash: '#f2f8ff', core: '#9fc8ff', fire: ['#e0f0ff', '#4f8bff', '#2a2fb8'], spark: '#b8d6ff', ember: '#6f9dff', smoke: '#161c34', ring: '#7fa8ff', debris: '#4a5578' },
    green: { flash: '#f0fff6', core: '#a8ffd6', fire: ['#e8fff3', '#3fe89a', '#0f7a55'], spark: '#b8ffdc', ember: '#5dffb0', smoke: '#14261f', ring: '#7dffc4', debris: '#3c5a4c' },
    violet: { flash: '#fbf2ff', core: '#d9b0ff', fire: ['#f6e8ff', '#b26bff', '#5a1fb0'], spark: '#e2c4ff', ember: '#c48aff', smoke: '#211631', ring: '#c99bff', debris: '#4a3e66' },
    gold: { flash: '#fffbe8', core: '#ffe9a0', fire: ['#fff6d0', '#ffcf3d', '#c76a10'], spark: '#fff0b0', ember: '#ffd34d', smoke: '#2a2414', ring: '#ffe27a', debris: '#7a6430' },
  };
  const SIZES = {
    s: { k: 1, shake: 0, shakeT: 0 },
    m: { k: 1.7, shake: 4, shakeT: 0.22 },
    l: { k: 2.6, shake: 8, shakeT: 0.35 },
    xl: { k: 3.6, shake: 13, shakeT: 0.5 },
    boss: { k: 5.2, shake: 22, shakeT: 1.1 },
  };

  // ------------------------------------------------------------------ waves, flashes, texts, timers
  const waves = [];
  const flashes = [];
  const texts = [];
  for (let i = 0; i < 48; i++) texts.push({ alive: false, x: 0, y: 0, str: '', color: '#fff', size: 26, life: 1, age: 0, rise: 60, font: '' });
  let textCursor = 0;
  const shakeState = { amp: 0, t: 0, dur: 0, time: 0 };
  const shakeOut = { x: 0, y: 0 };
  let hitstopT = 0;
  const slow = { scale: 1, t: 0, dur: 0 };
  const chroma = { a: 0, t: 0, dur: 0 };

  function settings() { return (SL.save && SL.save.settings) || {}; }
  function reduced() {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; }
  }
  let reducedMotion = false;

  /** Burning streak behind a debris chunk, aligned with its velocity (draw time only, no particles). */
  function drawStreak(ctx, p, bs, bx, by) {
    const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (sp < 30) return;
    const fade = 1 - p.age / p.life;
    const len = 10 + sp * 0.09;
    const th = Math.max(3, p.size * 0.75);
    const c = (p.vx / sp) * bs, s = (p.vy / sp) * bs;
    ctx.globalAlpha = 0.85 * fade;
    ctx.setTransform(c, s, -s, c, bx + p.x * bs, by + p.y * bs);
    ctx.drawImage(p.trail.streak, -len, -th / 2, len + th * 0.5, th);
  }

  const F = SL.fx = {
    PALETTES,
    SHAPES,
    get cap() { return cap; },

    emit(o) {
      if (!o) return null;
      const shapeName = o.shape || 'glow';
      let shape = SHAPES[shapeName];
      const color = qColor(o.color || '#ffffff');
      let spr = null, rmp = null;
      if (shape === undefined) {
        shape = SHAPES.sprite;
        spr = SL.art.has(shapeName) ? SL.art.get(shapeName).canvas : sprite(SHAPES.glow, color);
      } else if (o.color2 && shape !== SHAPES.debris) {
        rmp = ramp(shape, color, qColor(o.color2));
      } else spr = sprite(shape, color);
      const add = o.blend ? o.blend !== 'normal' : !(shape === SHAPES.smoke || shape === SHAPES.debris || shape === SHAPES.sprite);
      const size = o.size != null ? o.size : 12;
      const p = spawn(shape, o.x || 0, o.y || 0, o.vx || 0, o.vy || 0, o.life || 0.6, size,
        o.size2 != null ? o.size2 : size, o.alpha != null ? o.alpha : 1, o.alpha2 != null ? o.alpha2 : 0, add,
        o.drag || 0, spr, rmp);
      if (shape === SHAPES.debris) { p.sprites = spr; p.spr = spr[(rnd() * spr.length) | 0]; }
      p.gravity = o.gravity || 0;
      p.rot = o.rot || 0;
      p.spin = o.spin || 0;
      p.stretch = o.stretch || 0;
      p.ease = o.ease ? 1 : 0;
      if (o.delay > 0) p.age = -o.delay;
      return p;
    },

    explode(x, y, o) {
      o = o || {};
      const sz = SIZES[o.size] ? o.size : 's';
      const S = SIZES[sz];
      const k = S.k * (o.scale || 1);
      const P = PALETTES[o.palette] || PALETTES.enemy;
      const G = SHAPES.glow, FI = SHAPES.fire;
      const kp = Math.pow(k, 0.6), ks = Math.pow(k, 0.75);
      let p;
      // smoke first, so the fire paints over it; it shows as the fire cools
      const smk = sprite(SHAPES.smoke, qColor(P.smoke));
      const nk = Math.round(2 + 2.4 * k);
      for (let i = 0; i < nk; i++) {
        const a = rnd() * TAU, sp = rr(15, 80) * kp, off = rr(0, 12 * k);
        p = spawn(SHAPES.smoke, x + Math.cos(a) * off, y + Math.sin(a) * off, Math.cos(a) * sp, Math.sin(a) * sp - 18,
          rr(0.9, 1.7) * Math.pow(k, 0.25), rr(30, 46) * ks, rr(84, 120) * ks, rr(0.45, 0.65), 0, false, 1.3, smk, null);
        p.rot = rnd() * TAU;
        p.spin = rr(-0.7, 0.7);
        p.ease = 1;
        p.age = -rr(0.06, 0.2);
      }
      // fireball: billowy puffs, painted (normal blend) so they keep their colour, cooling to deep red
      const fire = ramp(FI, qColor(P.fire[0]), qColor(P.fire[1]), qColor(P.fire[2]));
      const fireMid = ramp(FI, qColor(P.fire[1]), qColor(P.fire[2]), qColor(C.mix(P.fire[2], P.smoke, 0.55)));
      const nf = Math.round(5 + 5 * k);
      for (let i = 0; i < nf; i++) {
        const a = rnd() * TAU, sp = rr(40, 220) * kp, off = rr(0, 10 * k);
        p = spawn(FI, x + Math.cos(a) * off, y + Math.sin(a) * off, Math.cos(a) * sp, Math.sin(a) * sp,
          rr(0.36, 0.66) * Math.pow(k, 0.3), rr(16, 26) * ks, rr(46, 72) * ks, rr(0.8, 0.98), 0, false, 3.2, null, i % 3 ? fire : fireMid);
        p.rot = rnd() * TAU;
        p.spin = rr(-2.5, 2.5);
        p.ease = 1;
        if (k >= 2.5 && i % 3 === 2) p.age = -rr(0.04, 0.28);
      }
      // light: white flash, hot core and heat glows (additive, these feed the bloom)
      spawn(G, x, y, 0, 0, 0.1 + 0.014 * k, 120 * Math.pow(k, 0.8), 40 * k, 1, 0, true, 0, sprite(G, qColor(P.flash)), null);
      p = spawn(G, x, y, 0, 0, 0.24 + 0.05 * k, 40 * k, 92 * k, 0.5, 0, true, 0, sprite(G, qColor(P.core)), null);
      p.ease = 1;
      const heat = sprite(G, qColor(P.fire[1]));
      const nh = Math.round(1 + k);
      for (let i = 0; i < nh; i++) {
        const a = rnd() * TAU, d = rr(0, 22) * k;
        p = spawn(G, x + Math.cos(a) * d, y + Math.sin(a) * d, Math.cos(a) * 60, Math.sin(a) * 60, rr(0.3, 0.5) * Math.pow(k, 0.3),
          34 * ks, 96 * ks, 0.32, 0, true, 2, heat, null);
        p.ease = 1;
      }
      // sparks
      const sparkR = ramp(SHAPES.spark, qColor(P.spark), qColor(P.ember));
      const ns = Math.round(8 + 7 * k);
      for (let i = 0; i < ns; i++) {
        const a = rnd() * TAU, sp = rr(260, 820) * Math.pow(k, 0.35);
        p = spawn(SHAPES.spark, x, y, Math.cos(a) * sp, Math.sin(a) * sp, rr(0.2, 0.55), rr(5, 8), 2, 1, 0, true, 2.8, null, sparkR);
        p.stretch = 0.045;
      }
      // embers
      const emb = sprite(G, qColor(P.ember));
      const ne = Math.round(3 + 3 * k);
      for (let i = 0; i < ne; i++) {
        const a = rnd() * TAU, sp = rr(40, 170) * Math.pow(k, 0.5);
        p = spawn(G, x, y, Math.cos(a) * sp, Math.sin(a) * sp, rr(0.7, 1.5), rr(7, 12), 2, 1, 0, true, 1.6, emb, null);
        p.gravity = -12;
      }
      // debris with burning streaks and smoke trails
      if (o.debris !== false && k >= 1.5) {
        const deb = sprite(SHAPES.debris, qColor(P.debris));
        const trail = { streak: sprite(SHAPES.spark, qColor(P.fire[1])), smoke: smk };
        const nd = Math.round(1 + 1.6 * k);
        for (let i = 0; i < nd; i++) {
          const a = rnd() * TAU, sp = rr(170, 440) * Math.pow(k, 0.3);
          p = spawn(SHAPES.debris, x, y, Math.cos(a) * sp, Math.sin(a) * sp, rr(0.8, 1.4), rr(10, 18) * Math.pow(k, 0.4),
            rr(8, 14) * Math.pow(k, 0.4), 1, 0.2, false, 1.2, deb[(rnd() * deb.length) | 0], null);
          p.sprites = deb;
          p.rot = rnd() * TAU;
          p.spin = rr(-9, 9);
          p.trail = trail;
          p.trailEvery = cap > 1000 ? 0.05 : 0.1;
          p.trailT = 0;
        }
      }
      // ring and shockwave
      p = spawn(SHAPES.ring, x, y, 0, 0, 0.3 + 0.05 * k, 14 * k, 170 * Math.pow(k, 0.85), 0.85, 0, true, 0, sprite(SHAPES.ring, qColor(P.ring)), null);
      p.ease = 1;
      if (k >= 1.7) F.shockwave(x, y, { radius: 105 * k, duration: 0.42 + 0.08 * k, strength: 0.45 + 0.22 * k, ring: k >= 2.6, color: P.ring });
      if (sz === 'boss') {
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * TAU + rr(-0.2, 0.2), d = rr(50, 120);
          p = spawn(FI, x + Math.cos(a) * d, y + Math.sin(a) * d, Math.cos(a) * 150, Math.sin(a) * 150, rr(0.6, 1),
            rr(44, 64), rr(120, 170), 0.9, 0, false, 2.5, null, i % 2 ? fire : fireMid);
          p.rot = rnd() * TAU;
          p.spin = rr(-1.5, 1.5);
          p.ease = 1;
          p.age = -rr(0.1, 0.45);
        }
        F.flash(P.flash, 0.75, 0.6);
        F.chromatic(0.8, 0.5);
        F.hitstop(0.08);
      } else if (k >= 2.6) {
        F.flash(P.flash, Math.min(0.32, 0.06 * k), 0.14 + 0.03 * k);
      }
      if (o.shake !== false && S.shake) F.shake(S.shake * (o.scale || 1), S.shakeT);
      if (o.sound !== false) U.sfx('explode_' + sz, { x });
    },

    hit(x, y, color, o) {
      color = qColor(color || '#ffd27a');
      const dir = o && o.dir != null ? o.dir : -Math.PI / 2;
      const spr = sprite(SHAPES.spark, color);
      for (let i = 0; i < 4; i++) {
        const a = dir + rr(-0.75, 0.75), sp = rr(200, 460);
        const p = spawn(SHAPES.spark, x, y, Math.cos(a) * sp, Math.sin(a) * sp, rr(0.1, 0.22), rr(4, 6), 2, 1, 0, true, 4, spr, null);
        p.stretch = 0.04;
      }
      spawn(SHAPES.glow, x, y, 0, 0, 0.09, 26, 40, 0.9, 0, true, 0, sprite(SHAPES.glow, color), null);
    },

    sparks(x, y, o) {
      o = o || {};
      const color = qColor(o.color || '#ffd27a');
      const n = Math.min(80, o.count != null ? o.count : 8);
      const speed = o.speed || 420, life = o.life || 0.35;
      const angle = o.angle != null ? o.angle : 0, spread = o.spread != null ? o.spread : TAU;
      const spr = sprite(SHAPES.spark, color);
      for (let i = 0; i < n; i++) {
        const a = angle + (rnd() - 0.5) * spread, sp = speed * rr(0.45, 1);
        const p = spawn(SHAPES.spark, x, y, Math.cos(a) * sp, Math.sin(a) * sp, life * rr(0.6, 1.1), o.size || 5, 2, 1, 0, true, 3, spr, null);
        p.stretch = 0.04;
      }
    },

    shockwave(x, y, o) {
      o = o || {};
      if (waves.length >= 12) waves.shift();
      waves.push({
        x, y, radius: o.radius || 260, dur: Math.max(0.05, o.duration || 0.6), t: 0,
        strength: o.strength != null ? o.strength : 1, ring: o.ring !== false,
        ringSpr: SL.art.ring(qColor(o.color || '#bfeaff'), 128, 7),
      });
    },

    shake(px, seconds) {
      const s = settings();
      const mul = (s.shake != null ? s.shake : 1) * (reducedMotion ? 0.4 : 1);
      const amp = (+px || 0) * mul;
      if (amp <= 0) return;
      const curAmp = shakeState.dur > 0 ? shakeState.amp * (shakeState.t / shakeState.dur) : 0;
      if (amp >= curAmp) {
        shakeState.amp = amp;
        shakeState.t = shakeState.dur = Math.max(0.05, +seconds || 0.25);
      }
    },

    flash(color, alpha, seconds) {
      const s = settings();
      let a = U.clamp(+alpha || 0, 0, 1);
      if (s.flashes === false || reducedMotion) a *= 0.3;
      if (a <= 0) return;
      if (flashes.length >= 4) flashes.shift();
      flashes.push({ color: color || '#ffffff', a, t: 0, dur: Math.max(0.03, +seconds || 0.15) });
    },

    hitstop(seconds) { hitstopT = Math.max(hitstopT, U.clamp(+seconds || 0, 0, 0.12)); },

    /** Timed chromatic aberration pulse (0..1) that decays over `seconds` of real time. */
    chromatic(amount, seconds) {
      const a = U.clamp(+amount || 0, 0, 1) * (reducedMotion ? 0.5 : 1);
      const cur = chroma.dur > 0 ? chroma.a * (chroma.t / chroma.dur) : 0;
      if (a <= cur) return;
      chroma.a = a;
      chroma.t = chroma.dur = Math.max(0.03, +seconds || 0.3);
    },

    slowmo(scale, seconds) {
      slow.scale = U.clamp(+scale || 1, 0.05, 1);
      slow.t = slow.dur = Math.max(0, +seconds || 0);
    },

    text(x, y, str, o) {
      o = o || {};
      let t = null;
      for (let i = 0; i < texts.length; i++) {
        const c = texts[(textCursor + i) % texts.length];
        if (!c.alive) { t = c; break; }
      }
      if (!t) t = texts[textCursor];
      textCursor = (textCursor + 1) % texts.length;
      t.alive = true; t.x = x; t.y = y; t.str = String(str); t.color = o.color || '#ffffff';
      t.size = o.size || 26; t.life = o.life || 0.9; t.rise = o.rise != null ? o.rise : 60; t.age = 0;
      t.font = (o.weight || 700) + ' ' + Math.round(t.size) + 'px ' + (o.font || 'Oxanium, "Segoe UI", sans-serif');
    },

    /** Game-time update (particles, shockwaves, floating text). */
    update(dt) {
      for (let k = 0; k < used; k++) {
        const p = pool[(head + k) % cap];
        if (!p.alive) continue;
        p.age += dt;
        if (p.age < 0) continue;
        if (p.age >= p.life) { p.alive = false; alive--; continue; }
        if (p.drag) { const f = 1 / (1 + p.drag * dt); p.vx *= f; p.vy *= f; }
        if (p.gravity) p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.spin) p.rot += p.spin * dt;
        if (p.trail) {
          p.trailT -= dt;
          for (let g = 0; g < 2 && p.trailT <= 0; g++) {
            p.trailT += p.trailEvery;
            const fade = 1 - p.age / p.life;
            const q = spawn(SHAPES.smoke, p.x, p.y, p.vx * 0.05, p.vy * 0.05 - 14, 0.7, 8 + 6 * fade, 26, 0.32 * fade, 0, false, 1.5, p.trail.smoke, null);
            q.rot = rnd() * TAU;
            q.spin = rr(-1, 1);
            q.ease = 1;
          }
        }
      }
      while (used > 0 && !pool[head].alive) { head = (head + 1) % cap; used--; }
      for (let i = waves.length - 1; i >= 0; i--) {
        const w = waves[i];
        w.t += dt;
        if (w.t >= w.dur) { waves.splice(i, 1); continue; }
        const k = w.t / w.dur;
        const r = w.radius * SL.ease.outCubic(k);
        const s = Math.min(2.2, w.strength);
        if (SL.render) SL.render.addRipple(w.x, w.y, r, 16 * s * Math.pow(1 - k, 1.3), 20 + 46 * k * Math.min(1.5, s));
      }
      for (let i = 0; i < texts.length; i++) {
        const t = texts[i];
        if (!t.alive) continue;
        t.age += dt;
        if (t.age >= t.life) t.alive = false;
      }
    },

    /** Real-time update (shake, flash, hit-stop, slow-mo); frozen while paused. */
    realUpdate(dt) {
      shakeState.time += dt;
      if (shakeState.t > 0) shakeState.t = Math.max(0, shakeState.t - dt);
      if (hitstopT > 0) hitstopT = Math.max(0, hitstopT - dt);
      if (slow.t > 0) slow.t = Math.max(0, slow.t - dt);
      if (chroma.t > 0) {
        chroma.t = Math.max(0, chroma.t - dt);
        const k = chroma.t / chroma.dur;
        if (SL.render) SL.render.chromatic(chroma.a * k * k);
      }
      for (let i = flashes.length - 1; i >= 0; i--) {
        const f = flashes[i];
        f.t += dt;
        if (f.t >= f.dur) { flashes.splice(i, 1); continue; }
        const k = 1 - f.t / f.dur;
        if (SL.render) SL.render.flash(f.color, f.a * k * k);
      }
    },

    shakeOffset() {
      if (shakeState.t <= 0 || shakeState.dur <= 0) { shakeOut.x = 0; shakeOut.y = 0; return shakeOut; }
      const a = shakeState.amp * (shakeState.t / shakeState.dur);
      const t = shakeState.time;
      shakeOut.x = a * (Math.sin(t * 53.1) * 0.6 + Math.sin(t * 31.7 + 1.3) * 0.4);
      shakeOut.y = a * (Math.sin(t * 47.3 + 0.7) * 0.6 + Math.sin(t * 27.9 + 2.1) * 0.4);
      return shakeOut;
    },

    /** Current slow-mo factor (eases back to 1 over the last quarter). */
    timeScale() {
      if (slow.t <= 0) return 1;
      const k = slow.t / Math.max(0.0001, slow.dur);
      return k > 0.25 ? slow.scale : U.lerp(1, slow.scale, k / 0.25);
    },
    hitstopLeft() { return hitstopT; },

    draw(ctx) {
      const b = SL.render.base, bs = b.s, bx = b.x, by = b.y;
      for (let pass = 0; pass < 2; pass++) {
        const add = pass === 1;
        ctx.globalCompositeOperation = add ? 'lighter' : 'source-over';
        for (let k = 0; k < used; k++) {
          const p = pool[(head + k) % cap];
          if (!p.alive || p.age < 0) continue;
          if (add && p.trail) drawStreak(ctx, p, bs, bx, by);
          if (p.add !== add) continue;
          const t = p.age / p.life;
          const a = p.alpha + (p.alpha2 - p.alpha) * (p.ease ? t * t : t);
          if (a <= 0.004) continue;
          const size = p.size + (p.size2 - p.size) * (p.ease ? t * (2 - t) : t);
          if (size <= 0.1) continue;
          const img = p.ramp ? p.ramp[Math.min(5, (t * 6) | 0)] : p.spr;
          if (!img) continue;
          ctx.globalAlpha = a > 1 ? 1 : a;
          if (p.shape === 1) {
            const sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
            const len = size * 2 + sp * p.stretch;
            const ang = Math.atan2(p.vy, p.vx);
            const c = Math.cos(ang) * bs, s = Math.sin(ang) * bs;
            ctx.setTransform(c, s, -s, c, bx + p.x * bs, by + p.y * bs);
            ctx.drawImage(img, -len / 2, -size / 2, len, size);
          } else if (p.rot) {
            const c = Math.cos(p.rot) * bs, s = Math.sin(p.rot) * bs;
            ctx.setTransform(c, s, -s, c, bx + p.x * bs, by + p.y * bs);
            ctx.drawImage(img, -size / 2, -size / 2, size, size);
          } else {
            ctx.setTransform(bs, 0, 0, bs, bx, by);
            ctx.drawImage(img, p.x - size / 2, p.y - size / 2, size, size);
          }
        }
        ctx.setTransform(bs, 0, 0, bs, bx, by);
      }
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < waves.length; i++) {
        const w = waves[i];
        if (!w.ring) continue;
        const k = w.t / w.dur;
        const r = w.radius * SL.ease.outCubic(k);
        ctx.globalAlpha = Math.min(1, 0.65 * Math.min(1.5, w.strength)) * (1 - k) * (1 - k);
        ctx.drawImage(w.ringSpr, w.x - r, w.y - r, r * 2, r * 2);
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < texts.length; i++) {
        const t = texts[i];
        if (!t.alive) continue;
        const k = t.age / t.life;
        const pop = k < 0.12 ? SL.ease.outBack(k / 0.12) : 1;
        ctx.globalAlpha = k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
        ctx.font = t.font;
        const y = t.y - t.rise * SL.ease.outCubic(k);
        ctx.setTransform(bs * pop, 0, 0, bs * pop, bx + t.x * bs, by + y * bs);
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(4,6,14,0.75)';
        ctx.strokeText(t.str, 0, 0);
        ctx.fillStyle = t.color;
        ctx.fillText(t.str, 0, 0);
      }
      ctx.setTransform(bs, 0, 0, bs, bx, by);
      ctx.globalAlpha = 1;
    },

    clear() {
      for (let i = 0; i < pool.length; i++) pool[i].alive = false;
      head = 0; used = 0; alive = 0;
      waves.length = 0;
      flashes.length = 0;
      for (const t of texts) t.alive = false;
      shakeState.t = 0;
      hitstopT = 0;
      slow.t = 0;
      chroma.t = 0;
    },

    count() { return alive; },

    setCap(n) {
      n = U.clamp(Math.round(+n || 2500), 100, MAXCAP);
      if (n === cap) return;
      const keep = [];
      for (let k = 0; k < used; k++) {
        const p = pool[(head + k) % cap];
        if (p.alive) keep.push(p);
      }
      const all = new Set(pool);
      const fresh = keep.slice(Math.max(0, keep.length - n));
      for (const p of keep.slice(0, Math.max(0, keep.length - n))) p.alive = false;
      const spare = [];
      for (const p of all) if (!p.alive) spare.push(p);
      const next = fresh.slice();
      while (next.length < n) next.push(spare.pop() || newParticle());
      pool = next;
      cap = n;
      head = 0;
      used = fresh.length;
      alive = fresh.length;
    },
  };

  SL.onBoot(() => {
    reducedMotion = reduced();
    try {
      const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (mq.addEventListener) mq.addEventListener('change', () => { reducedMotion = reduced(); });
    } catch (e) { /* matchMedia missing */ }
  });
})(window.SL = window.SL || {});
