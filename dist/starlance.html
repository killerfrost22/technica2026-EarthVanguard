</script>
<script>
/* 08_player.js (core)
   Provides: SL.player = { create(index, stats), update(p, dt), draw(p, ctx), push(p, ax, ay, dt), heal(p, n),
   addShield(p, n), addBomb(p, n), bomb(p), respawn(p), revive(p, x, y), kill(p), defaultStats(), statsFor(index),
   drawPlaceholder(p, ctx) }.
   Movement is instant (560 px/s, focus 260) from SL.input.players[i] axes plus pointer drag, clamped 16 px
   inside the playfield, with an external push velocity that decays at 3/s. Banking is visual only.
   Firing goes through SL.weapons.update(p, dt) (p.firing says whether to shoot this frame); bombs are a
   2 s nova; skills go through SL.skills. Down logic: solo spends a life and respawns after 1.2 s; co-op with a
   partner alive ejects a pilot pod the partner can fly over within stats.reviveTime to revive. */
(function (SL) {
  'use strict';

  const U = SL.util, C = SL.color;
  const W = SL.W, H = SL.H, TAU = U.TAU;
  const MARGIN = 16;

  const DEFAULT_STATS = {
    maxHull: 100, shield: 0, maxShield: 60, bombs: 2, maxBombs: 5, speed: 560, focusSpeed: 260, fireRateMul: 1,
    damageMul: 1, magnet: 90, missileStart: 0, weaponStart: { type: 'pulse', level: 1 }, gravityResist: 0,
    damageTaken: 1, bonusLives: 0, creditMul: 1, regen: 0, reviveTime: 8,
  };

  function settings() { return (SL.save && SL.save.settings) || {}; }
  function session() { return SL.game && SL.game.session; }

  /** Merged stats with every numeric default kept finite (a NaN from a progress formula would freeze or hide the
      jet), weaponStart kept valid, and the bomb / shield caps consistent. */
  function sanitize(st) {
    for (const k in DEFAULT_STATS) {
      const d = DEFAULT_STATS[k];
      if (typeof d === 'number' && !(typeof st[k] === 'number' && isFinite(st[k]))) {
        U.warnOnce('stat:' + k, 'player stat "' + k + '" is not a finite number (' + st[k] + '); using ' + d);
        st[k] = d;
      }
    }
    if (!(st.maxHull > 0)) st.maxHull = DEFAULT_STATS.maxHull;
    if (!(st.speed > 0)) st.speed = DEFAULT_STATS.speed;
    if (!(st.focusSpeed > 0)) st.focusSpeed = DEFAULT_STATS.focusSpeed;
    if (st.maxShield < 0) st.maxShield = 0;
    if (st.maxBombs < 0) st.maxBombs = 0;
    const ws = st.weaponStart;
    if (!ws || typeof ws !== 'object') st.weaponStart = { type: 'pulse', level: 1 };
    else {
      if (typeof ws.type !== 'string' || !ws.type) ws.type = 'pulse';
      if (!(ws.level >= 1)) ws.level = 1;
    }
    return st;
  }
  function spawnX(index, coop) { return coop ? (index === 0 ? W / 2 - 110 : W / 2 + 110) : W / 2; }

  const P = SL.player = {
    defaultStats() { return U.deepMerge(DEFAULT_STATS, null); },

    /** Stats for a player index from SL.progress.playerStats when available, merged over defaults. */
    statsFor(index) {
      let st = null;
      if (SL.progress && typeof SL.progress.playerStats === 'function') {
        try { st = SL.progress.playerStats(SL.save.data, index); } catch (err) { console.error('[SL.player] progress.playerStats threw:', err); }
      }
      return sanitize(U.deepMerge(DEFAULT_STATS, st || {}));
    },

    create(index, stats) {
      const st = sanitize(U.deepMerge(DEFAULT_STATS, stats || {}));
      const s = session();
      const coop = !!(s && s.coop);
      const ws = st.weaponStart || DEFAULT_STATS.weaponStart;
      const save = (SL.save && SL.save.data) || {};
      const p = {
        kind: 'player', id: U.uid(), index, def: null, team: 'player',
        x: spawnX(index, coop), y: H - 190, vx: 0, vy: 0, r: 22, hitR: 7, rot: 0, scale: 1, alpha: 1,
        hull: st.maxHull, maxHull: st.maxHull, shield: Math.min(st.shield || 0, st.maxShield), maxShield: st.maxShield,
        bombs: Math.min(st.bombs, st.maxBombs), maxBombs: st.maxBombs,
        weapon: { type: ws.type || 'pulse', level: U.clamp(ws.level || 1, 1, 5) },
        missiles: U.clamp(st.missileStart || 0, 0, 3),
        invuln: 0, alive: true, down: false, out: false, focus: false, firing: false, bank: 0,
        push: { x: 0, y: 0 }, stats: st,
        skill: { id: (save.skills && save.skills.equipped && save.skills.equipped[index]) || null, cooldown: 0, active: false, t: 0 },
        age: 0, flash: 0, hitT: 0, shieldHitT: 0, contT: 0, lowHullArmed: true, respawnT: 0, reviveT: 0, pod: null,
        novaT: 0, state: 'fly', control: true, entering: 0, data: {},
        callsign: index === 0 ? save.callsign || 'LANCE' : save.p2callsign || 'P2',
        palette: index === 0 ? SL.pal.player : SL.pal.player2,
        fireT: 0, gun: 0,
      };
      return p;
    },

    update(p, dt) {
      p.age += dt;
      if (p.display) return;
      if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
      if (p.hitT > 0) p.hitT -= dt;
      if (p.shieldHitT > 0) p.shieldHitT -= dt;
      if (p.contT > 0) p.contT -= dt;
      if (p.flash > 0) p.flash -= dt;

      if (!p.alive) { updateDown(p, dt); return; }

      const inp = (SL.input && SL.input.players[p.index]) || {};
      const st = p.stats;
      let vx = 0, vy = 0;
      if (p.control && !p.outro) {
        const spd = inp.focus ? st.focusSpeed : st.speed;
        let mx = inp.mx || 0, my = inp.my || 0;
        const ml = Math.sqrt(mx * mx + my * my);
        if (ml > 1) { mx /= ml; my /= ml; }
        vx = mx * spd;
        vy = my * spd;
        p.x += vx * dt + (inp.dragX || 0);
        p.y += vy * dt + (inp.dragY || 0);
        if (dt > 0 && (inp.dragX || inp.dragY)) { vx += (inp.dragX || 0) / dt; vy += (inp.dragY || 0) / dt; }
        p.focus = !!inp.focus;
      } else p.focus = false;

      if (p.entering > 0) {
        p.entering = Math.max(0, p.entering - dt);
        p.y = U.lerp(p.y, H - 190, Math.min(1, dt * 7));
      }
      if (p.outro) {
        p.data.outroV = (p.data.outroV || 0) + 1500 * dt;
        p.y -= p.data.outroV * dt;
        vy = -p.data.outroV;
        if (p.y < -260) { p.y = -260; p.data.outroV = 0; vy = 0; }
      }

      p.x += p.push.x * dt;
      p.y += p.push.y * dt;
      const decay = Math.exp(-3 * dt);
      p.push.x *= decay;
      p.push.y *= decay;
      p.vx = vx;
      p.vy = vy;
      if (!(isFinite(p.x) && isFinite(p.y))) {
        // a NaN from content (push, drag, scripted move) would lose the jet for good: put it back
        U.warnOnce('player-nan', 'player ' + p.index + ' position became ' + p.x + ',' + p.y + '; reset to the spawn point');
        p.x = spawnX(p.index, !!(session() && session().coop));
        p.y = H - 190;
        p.push.x = p.push.y = 0;
        vx = vy = 0;
        p.vx = p.vy = 0;
      }
      if (!p.outro) {
        p.x = U.clamp(p.x, MARGIN, W - MARGIN);
        p.y = U.clamp(p.y, MARGIN, H - MARGIN);
      }
      const targetBank = U.clamp((vx / Math.max(1, st.speed)) * 0.35, -0.35, 0.35);
      p.bank = U.lerp(p.bank, targetBank, Math.min(1, dt * 10));

      const canFire = p.control && !p.outro && p.entering <= 0.2;
      p.firing = canFire && (settings().autoFire !== false || (SL.input && SL.input.forceAutoFire) || !!inp.fire);
      if (SL.weapons && typeof SL.weapons.update === 'function') {
        try { SL.weapons.update(p, dt); } catch (err) { reportOnce('weapons.update', err); defaultFire(p, dt); }
      } else defaultFire(p, dt);

      if (inp.bomb && p.control && !p.outro) P.bomb(p);
      if (SL.skills) {
        try {
          if (inp.skill && p.control && !p.outro && typeof SL.skills.activate === 'function') SL.skills.activate(p);
          if (typeof SL.skills.update === 'function') SL.skills.update(p, dt);
        } catch (err) { reportOnce('skills', err); }
      }
      if (st.regen > 0 && p.hull < p.maxHull) P.heal(p, st.regen * dt, true);
      if (p.novaT > 0) {
        p.novaT -= dt;
        SL.world.clearEnemyBullets({});
      }
      if (!p.lowHullArmed && p.hull > p.maxHull * 0.4) p.lowHullArmed = true;
    },

    draw(p, ctx) {
      if (!p.alive && !p.display) return;
      const t = SL.time.real;
      const blink = p.invuln > 0 && !p.display && !p.outro && Math.floor(t * 15) % 2 === 0;
      const pa = ctx.globalAlpha;
      if (blink) ctx.globalAlpha = pa * 0.32;
      if (SL.weapons && typeof SL.weapons.drawShip === 'function') {
        try { SL.weapons.drawShip(p, ctx); } catch (err) { reportOnce('weapons.drawShip', err); P.drawPlaceholder(p, ctx); }
      } else P.drawPlaceholder(p, ctx);
      ctx.globalAlpha = pa;
      ctx.globalCompositeOperation = 'source-over';
      const b = SL.render.base;
      ctx.setTransform(b.s, 0, 0, b.s, b.x, b.y);
      if (p.shield > 0 || p.shieldHitT > 0) drawShield(p, ctx, t);
      if (p.novaT > 1.6) {
        const k = (2 - p.novaT) / 0.4;
        SL.art.drawGlow(ctx, p.x, p.y, 60 + 200 * k, '#bfefff', 1 - k);
      }
      const showHit = p.focus || settings().showHitbox === 'always';
      if (showHit && !p.display) {
        // dark backing disc so the dot reads on a white hull, then the white core and a trim ring
        SL.art.drawGlow(ctx, p.x, p.y, 18, p.palette.trim, 0.75);
        ctx.fillStyle = 'rgba(2,8,18,0.85)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.hitR + 2.4, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4.2, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = C.rgba(C.mix(p.palette.trim, '#ffffff', 0.35), 1);
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.hitR + 0.6, 0, TAU);
        ctx.stroke();
      }
    },

    drawPlaceholder(p, ctx) {
      const key = 'core:jet' + p.index;
      if (!SL.art.has(key)) {
        const pal = p.palette;
        SL.art.define(key, 60, 72, (c, w, h) => {
          const hull = SL.art.symPath(w / 2, [[0, 2], [7, 22], [9, 40], [28, 58], [28, 64], [9, 62], [6, 70], [0, 66]]);
          SL.art.metal(c, hull, { base: pal.hull, spec: 0.6 });
          SL.art.emissive(c, SL.art.poly([w / 2 - 3, 20, w / 2 + 3, 20, w / 2, 34]), pal.trim, 6);
        }, { pad: 4 });
      }
      SL.art.drawSprite(ctx, key, p.x, p.y, 0, 1, 1);
      SL.art.flame(ctx, p.x, p.y + 34, 10, 30, '#ffffff', p.palette.engine, SL.time.real);
    },

    push(p, ax, ay, dt) {
      if (!p || !p.alive || !isFinite(ax) || !isFinite(ay) || !isFinite(dt)) return;
      const k = 1 - U.clamp((p.stats && p.stats.gravityResist) || 0, 0, 1);
      p.push.x += ax * dt * k;
      p.push.y += ay * dt * k;
    },

    heal(p, n, silent) {
      if (!p || !p.alive) return 0;
      const before = p.hull;
      p.hull = Math.min(p.maxHull, p.hull + (n || 0));
      if (!p.lowHullArmed && p.hull > p.maxHull * 0.4) p.lowHullArmed = true;
      if (!silent && p.hull > before) SL.bus.emit('playerHeal', { p, amount: p.hull - before });
      return p.hull - before;
    },

    addShield(p, n) {
      if (!p) return 0;
      const before = p.shield;
      p.shield = Math.min(p.maxShield, p.shield + (n || 0));
      return p.shield - before;
    },

    addBomb(p, n) {
      if (!p) return false;
      n = n == null || !isFinite(n) ? 1 : Math.round(n);
      if (p.bombs >= p.maxBombs) return false;
      p.bombs = Math.min(p.maxBombs, p.bombs + n);
      return true;
    },

    /** Uses a bomb: 2 s nova that clears enemy bullets (to credits), 400 damage to non-boss enemies on
        screen, 2% of max HP (cap 600) to bosses, 1.5 s invulnerability, shockwave and flash. */
    bomb(p) {
      if (!p || !p.alive || p.bombs <= 0 || p.novaT > 0.6) return false;
      p.bombs--;
      p.novaT = 2.0;
      p.invuln = Math.max(p.invuln, 1.5);
      const s = session();
      if (s) s.bombsUsed++;
      SL.world.clearEnemyBullets({ toCredits: true, beams: true });
      const list = SL.world.enemies.slice();
      for (const e of list) {
        if (e.dead || e.dying || !SL.world.onScreen(e, 0)) continue;
        if (e.isBoss) SL.damageEnemy(e, Math.min(600, e.maxHp * 0.02), { by: p, type: 'bomb' });
        else SL.damageEnemy(e, 400, { by: p, type: 'bomb' });
      }
      SL.fx.shockwave(p.x, p.y, { radius: 980, duration: 1.1, strength: 1.8, color: '#bfefff' });
      SL.fx.shockwave(p.x, p.y, { radius: 520, duration: 0.7, strength: 1.2, ring: false });
      SL.fx.flash('#d8f6ff', 0.62, 0.4);
      SL.fx.shake(12, 0.6);
      SL.fx.hitstop(0.05);
      SL.fx.chromatic(0.5, 0.45);
      for (let i = 0; i < 36; i++) {
        const a = (i / 36) * TAU;
        SL.fx.emit({ x: p.x, y: p.y, vx: Math.cos(a) * 900, vy: Math.sin(a) * 900, life: 0.7, size: 26, size2: 6, color: '#bfefff', color2: '#3fc8ff', drag: 1.5 });
      }
      U.sfx('bomb', { x: p.x });
      SL.bus.emit('bomb', { p });
      return true;
    },

    respawn(p) {
      const s = session();
      p.alive = true;
      p.down = false;
      p.state = 'fly';
      p.hull = p.maxHull;
      p.shield = 0;
      p.x = spawnX(p.index, !!(s && s.coop));
      p.y = H + 60;
      p.entering = 0.9;
      p.invuln = 2.5;
      p.push.x = p.push.y = 0;
      p.lowHullArmed = true;
      if (p.pod) { p.pod.dead = true; p.pod = null; }
      SL.bus.emit('playerRespawn', { p });
    },

    revive(p, x, y, by) {
      if (!p || p.alive || p.out) return;
      p.alive = true;
      p.down = false;
      p.state = 'fly';
      p.hull = Math.max(1, Math.round(p.maxHull * 0.5));
      p.x = U.clamp(x != null ? x : p.x, MARGIN, W - MARGIN);
      p.y = U.clamp(y != null ? y : p.y, MARGIN, H - MARGIN);
      p.invuln = 2.0;
      p.push.x = p.push.y = 0;
      if (p.pod) { p.pod.dead = true; p.pod = null; }
      SL.fx.explode(p.x, p.y, { size: 's', palette: 'green', debris: false, shake: false, sound: false });
      U.sfx('revive', { x: p.x });
      SL.bus.emit('playerRevive', { p, by: by || null });
    },

    /** Hull reached 0 (or forced): explode, then pod (co-op) or life/respawn/out. */
    kill(p) {
      if (!p || !p.alive) return;
      p.alive = false;
      p.down = true;
      p.hull = 0;
      p.shield = 0;
      p.novaT = 0;
      p.firing = false;
      const s = session();
      if (s) s.deaths = (s.deaths || 0) + 1;
      SL.fx.explode(p.x, p.y, { size: 'l', palette: 'player' });
      SL.fx.shake(14, 0.5);
      SL.fx.flash('#ffffff', 0.35, 0.25);
      SL.fx.chromatic(1, 0.6);
      SL.bus.emit('playerDown', { p });
      if (SL.weapons && typeof SL.weapons.onPlayerDown === 'function') {
        try { SL.weapons.onPlayerDown(p); } catch (err) { reportOnce('weapons.onPlayerDown', err); }
      } else p.weapon.level = Math.max(1, p.weapon.level - 1);
      const partner = SL.world.players.find((q) => q !== p && q.alive && !q.down && !q.display);
      if (s && s.coop && partner) {
        p.state = 'pod';
        p.reviveT = p.stats.reviveTime || 8;
        let pod = null;
        if (SL.rescue && typeof SL.rescue.spawnPilotPod === 'function') {
          try { pod = SL.rescue.spawnPilotPod(p); } catch (err) { reportOnce('rescue.spawnPilotPod', err); }
        }
        p.pod = pod && !pod.dead ? pod : spawnCorePilotPod(p);
      } else resolveLife(p, s && s.coop ? 1.0 : 1.2);
    },
  };

  function resolveLife(p, delay) {
    const s = session();
    if (p.pod) { p.pod.dead = true; p.pod = null; }
    if (s && s.lives > 0) {
      s.lives--;
      s.livesLost++;
      p.state = 'respawn';
      p.respawnT = delay;
    } else {
      p.state = 'out';
      p.out = true;
      SL.bus.emit('playerOut', { p });
      if (SL.game && SL.game.checkFail) SL.game.checkFail();
    }
  }

  function updateDown(p, dt) {
    if (p.state === 'respawn') {
      p.respawnT -= dt;
      if (p.respawnT <= 0) P.respawn(p);
    } else if (p.state === 'pod') {
      p.reviveT -= dt;
      if (p.pod && p.pod.dead && !p.alive && p.state === 'pod' && p.reviveT > 0 && !p.pod.revived) {
        // pod destroyed or lost before rescue: treat as timeout
        p.reviveT = 0;
      }
      if (p.reviveT <= 0 && !p.alive) {
        if (p.pod && !p.pod.dead) SL.fx.explode(p.pod.x, p.pod.y, { size: 's', palette: 'player', debris: false });
        resolveLife(p, 1.0);
      }
    }
  }

  // Minimal pilot pod used when 17_rescue.js does not provide spawnPilotPod.
  function spawnCorePilotPod(p) {
    const def = {
      r: 18, sprite: 'core:pod',
      update(pod, dt) { pod.vy = U.approach(pod.vy, 40, 200 * dt); pod.vx *= 1 / (1 + 2 * dt); },
      onTouch(pod, q) {
        if (q === pod.data.owner || pod.dead) return;
        pod.revived = true;
        pod.dead = true;
        P.revive(pod.data.owner, pod.x, pod.y, q);
      },
    };
    const pod = SL.world.spawnEntity('pods', def, { x: p.x, y: p.y, vx: (SL.rng.next() - 0.5) * 80, vy: -60 });
    pod.data.owner = p;
    pod.data.pilot = true;
    return pod;
  }

  const shieldCache = {};
  function shieldSprite(color) {
    if (shieldCache[color]) return shieldCache[color];
    const r = 46;
    const c = SL.art.canvas(r * 2 + 8, r * 2 + 8), x = c.getContext('2d');
    const cx = r + 4, cy = r + 4;
    const g = x.createRadialGradient(cx - 10, cy - 14, r * 0.2, cx, cy, r);
    g.addColorStop(0, C.rgba(color, 0.0));
    g.addColorStop(0.72, C.rgba(color, 0.10));
    g.addColorStop(0.93, C.rgba(color, 0.55));
    g.addColorStop(1, C.rgba('#ffffff', 0.9));
    x.fillStyle = g;
    x.beginPath();
    x.arc(cx, cy, r, 0, TAU);
    x.fill();
    x.strokeStyle = C.rgba('#ffffff', 0.35);
    x.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      x.beginPath();
      x.moveTo(cx + Math.cos(a) * r * 0.55, cy + Math.sin(a) * r * 0.55);
      x.lineTo(cx + Math.cos(a) * r * 0.97, cy + Math.sin(a) * r * 0.97);
      x.stroke();
    }
    x.beginPath();
    x.arc(cx, cy, r * 0.55, 0, TAU);
    x.stroke();
    x.fillStyle = C.rgba('#ffffff', 0.5);
    x.beginPath();
    x.ellipse(cx - r * 0.38, cy - r * 0.45, r * 0.22, r * 0.09, -0.7, 0, TAU);
    x.fill();
    shieldCache[color] = c;
    return c;
  }

  function drawShield(p, ctx, t) {
    const color = p.palette.glow;
    const spr = shieldSprite(color);
    const k = p.maxShield > 0 ? U.clamp(p.shield / p.maxShield, 0, 1) : 0;
    const hit = p.shieldHitT > 0 ? p.shieldHitT / 0.3 : 0;
    const a = Math.min(1, 0.35 + 0.45 * k + 0.25 * Math.sin(t * 6) * 0.3 + hit * 0.8);
    const r = 46 + 2 * Math.sin(t * 5) + hit * 6;
    const po = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a;
    ctx.drawImage(spr, p.x - r - 4, p.y - r - 4, (r + 4) * 2, (r + 4) * 2);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = po;
  }

  // Twin pulse used only when no weapons module is loaded.
  function defaultFire(p, dt) {
    p.fireT -= dt;
    if (!p.firing || p.fireT > 0) return;
    p.fireT += 0.1 / (p.stats.fireRateMul || 1);
    if (p.fireT < 0) p.fireT = 0;
    const dmg = 7 * (p.stats.damageMul || 1);
    SL.firePlayer(p, p.x - 9, p.y - 26, -Math.PI / 2, 1500, 'pulse', dmg);
    SL.firePlayer(p, p.x + 9, p.y - 26, -Math.PI / 2, 1500, 'pulse', dmg);
  }

  const reported = new Set();
  function reportOnce(what, err) {
    if (reported.has(what)) return;
    reported.add(what);
    console.error('[SL.player] ' + what + ' threw:', err);
  }
})(window.SL = window.SL || {});

//# sourceURL=src/08_player.js
</script>
<script>
/* STUB: replaced by weapons
   09_weapons.js provides: SL.weapons = { update(p, dt), drawShip(p, ctx), setType(p, type), levelUp(p),
   onPlayerDown(p) }, pbullet types 'pulse' and 'spread', and placeholder XF-9 jet art for P1 and P2
   (9 pre-rendered bank frames each, drawn with SL.art.metal, live engine plumes and muzzle flashes).
   Pulse: twin lasers (L1 ~140 DPS, L5 ~330 DPS). Spread: a widening fan. Missiles are not in the stub. */
(function (SL) {
  'use strict';

  const U = SL.util, C = SL.color, A = SL.art;
  const TAU = Math.PI * 2;
  const FRAMES = 9;
  const JW = 88, JH = 104;

  const PULSE = { bolts: [2, 3, 4, 4, 5], rate: [10, 10, 10.5, 11.5, 12], dmg: [7, 5.6, 4.6, 5.4, 5.5] };
  const SPREAD = { bolts: [3, 4, 5, 6, 7], rate: [7, 7.5, 8, 8.5, 9], dmg: [6, 5.4, 5, 4.8, 4.6], arc: [0.32, 0.42, 0.52, 0.62, 0.72] };

  /** Laser bolt pointing +x: soft halo, tapered colored body fading toward the tail, white-hot core. */
  function defineBolt(key, len, thick, color) {
    A.define(key, len, thick, (ctx, w, h) => {
      const cy = h / 2;
      ctx.globalCompositeOperation = 'lighter';
      ctx.save();
      ctx.translate(w * 0.58, cy);
      ctx.scale(w * 0.46, h * 0.5);
      const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      halo.addColorStop(0, C.rgba(color, 0.5));
      halo.addColorStop(0.45, C.rgba(color, 0.2));
      halo.addColorStop(1, C.rgba(color, 0));
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(0, 0, 1, 0, TAU);
      ctx.fill();
      ctx.restore();
      const body = ctx.createLinearGradient(0, 0, w, 0);
      body.addColorStop(0, C.rgba(color, 0));
      body.addColorStop(0.35, C.rgba(color, 0.75));
      body.addColorStop(0.8, C.rgba(C.mix(color, '#ffffff', 0.35), 1));
      body.addColorStop(1, C.rgba(C.mix(color, '#ffffff', 0.6), 1));
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(w * 0.04, cy);
      ctx.quadraticCurveTo(w * 0.55, cy - h * 0.3, w * 0.9, cy - h * 0.24);
      ctx.quadraticCurveTo(w * 1.0, cy, w * 0.9, cy + h * 0.24);
      ctx.quadraticCurveTo(w * 0.55, cy + h * 0.3, w * 0.04, cy);
      ctx.fill();
      const core = ctx.createLinearGradient(w * 0.2, 0, w, 0);
      core.addColorStop(0, 'rgba(255,255,255,0)');
      core.addColorStop(0.5, 'rgba(255,255,255,0.9)');
      core.addColorStop(1, 'rgba(255,255,255,1)');
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.ellipse(w * 0.62, cy, w * 0.33, h * 0.085, 0, 0, TAU);
      ctx.fill();
    }, { pad: 1, res: 2 });
  }

  SL.pbulletTypes.define('pulse', { r: 7, damage: 7, sprite: 'wpn:pulse', orient: true, color: '#7fe3ff' });
  SL.pbulletTypes.define('spread', { r: 6, damage: 6, sprite: 'wpn:spread', orient: true, color: '#9fe8ff' });

  // ------------------------------------------------------------------ jet art
  function jetFrame(pal, roll) {
    return (ctx, w, h) => {
      const cx = w / 2;
      const sx = 1 - 0.24 * Math.abs(roll);
      ctx.translate(cx, 0);
      ctx.scale(sx, 1);
      ctx.translate(-cx, 0);
      const lightAng = Math.atan2(A.lightDir.y, A.lightDir.x) + roll * 0.55;
      const dark = C.darken(pal.hull, 0.55);
      const wingBase = (side) => {
        const dip = roll * side;
        return dip > 0 ? C.mix(pal.hull, dark, 0.32 * dip) : C.mix(pal.hull, '#ffffff', 0.12 * -dip);
      };
      const B = { x: 0, y: 0, w, h };
      // wings (drawn first, under the fuselage)
      for (const side of [-1, 1]) {
        const wx = (dx) => cx + side * dx;
        const wing = A.poly([wx(9), 44, wx(41), 78, wx(42), 87, wx(30), 86, wx(13), 82]);
        A.metal(ctx, wing, { base: wingBase(side), angle: lightAng, spec: 0.5, specPos: 0.34, bounds: B });
        A.panelLines(ctx, A.poly([wx(16), 58, wx(34), 80, wx(20), 79], true), '#000', 0.35);
        A.emissive(ctx, A.poly([wx(11), 46, wx(39), 77.5], true), pal.trim, 5, { stroke: 1.6 });
        const tip = new Path2D();
        tip.arc(wx(41.2), 82, 1.8, 0, TAU);
        A.emissive(ctx, tip, pal.glow, 6);
        const can = A.poly([wx(7), 30, wx(19), 37, wx(19.5), 41, wx(8), 39]);
        A.metal(ctx, can, { base: wingBase(side), angle: lightAng, spec: 0.4, edge: 1.2, bounds: B });
        const tail = A.poly([wx(10), 76, wx(19), 95, wx(17), 100, wx(9), 91]);
        A.metal(ctx, tail, { base: C.darken(wingBase(side), 0.12), angle: lightAng, spec: 0.45, edge: 1.2, bounds: B });
      }
      // engine housings
      for (const side of [-1, 1]) {
        const eng = new Path2D();
        eng.roundRect(cx + side * 7 - 4.5, 84, 9, 17, 3);
        A.metal(ctx, eng, { base: '#5b6577', angle: lightAng, spec: 0.35, edge: 1, bounds: B });
        const noz = new Path2D();
        noz.ellipse(cx + side * 7, 100.5, 3.6, 2.2, 0, 0, TAU);
        ctx.fillStyle = '#0b0f18';
        ctx.fill(noz);
        A.emissive(ctx, noz, pal.engine, 5);
      }
      // fuselage
      const body = A.symPath(cx, [[0, 1], [2.6, 8], [5.4, 18], [7.4, 30], [9.4, 44], [10.6, 58], [11.6, 72], [10.6, 86], [8.4, 95], [0, 97]]);
      A.metal(ctx, body, { base: pal.hull, angle: lightAng, spec: 0.62, specPos: 0.3, bounds: { x: cx - 12, y: 0, w: 24, h: 98 } });
      A.panelLines(ctx, A.poly([cx - 8, 46, cx + 8, 46], true), '#000', 0.4);
      A.panelLines(ctx, A.poly([cx - 10, 66, cx + 10, 66], true), '#000', 0.35);
      A.panelLines(ctx, A.poly([cx, 44, cx, 92], true), '#000', 0.25);
      A.emissive(ctx, A.poly([cx - 1.2, 6, cx + 1.2, 6, cx + 1.4, 15, cx - 1.4, 15]), pal.trim, 5);
      A.emissive(ctx, A.poly([cx - 9.6, 62, cx - 7, 62, cx - 6.4, 76, cx - 9, 76]), pal.trim, 4);
      A.emissive(ctx, A.poly([cx + 9.6, 62, cx + 7, 62, cx + 6.4, 76, cx + 9, 76]), pal.trim, 4);
      // canopy
      const can = new Path2D();
      can.ellipse(cx, 29, 4.6, 11, 0, 0, TAU);
      const g = ctx.createLinearGradient(cx - 5, 18, cx + 5, 40);
      g.addColorStop(0, '#9fd8ff');
      g.addColorStop(0.35, '#1d3f6e');
      g.addColorStop(1, '#060b18');
      ctx.fillStyle = g;
      ctx.fill(can);
      ctx.strokeStyle = 'rgba(10,14,24,0.9)';
      ctx.lineWidth = 1;
      ctx.stroke(can);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.ellipse(cx - 1.6 - roll * 1.2, 24, 1.2, 5, -0.15, 0, TAU);
      ctx.fill();
    };
  }

  function defineJets() {
    defineBolt('wpn:pulse', 54, 18, '#3fc8ff');
    defineBolt('wpn:spread', 40, 16, '#5fe0ff');
    [SL.pal.player, SL.pal.player2].forEach((pal, i) => {
      for (let f = 0; f < FRAMES; f++) {
        const roll = (f / (FRAMES - 1)) * 2 - 1;
        A.define('wpn:jet' + i + ':' + f, JW, JH, jetFrame(pal, roll), { pad: 6, res: 2 });
      }
    });
  }

  // ------------------------------------------------------------------ firing
  function fire(p) {
    const lv = U.clamp(p.weapon.level, 1, 5) - 1;
    const mul = (p.stats && p.stats.damageMul) || 1;
    const up = -Math.PI / 2;
    if (p.weapon.type === 'spread') {
      const n = SPREAD.bolts[lv], arc = SPREAD.arc[lv], dmg = SPREAD.dmg[lv] * mul;
      for (let i = 0; i < n; i++) {
        const a = up + (n === 1 ? 0 : (i / (n - 1) - 0.5) * arc);
        SL.firePlayer(p, p.x + Math.cos(a) * 30, p.y - 20 + Math.sin(a) * 10, a, 1250, 'spread', dmg);
      }
      p.gun = 1;
      return 1 / SPREAD.rate[lv];
    }
    const n = PULSE.bolts[lv], dmg = PULSE.dmg[lv] * mul;
    const offs = [[-9, 9], [-12, 0, 12], [-16, -6, 6, 16], [-16, -6, 6, 16], [-22, -11, 0, 11, 22]][lv];
    for (let i = 0; i < n; i++) {
      const ox = offs[i];
      const a = up + ox * 0.0016;
      SL.firePlayer(p, p.x + ox, p.y - 30 + Math.abs(ox) * 0.6, a, 1500, 'pulse', dmg);
    }
    p.gun = 1;
    return 1 / PULSE.rate[lv];
  }

  SL.weapons = {
    update(p, dt) {
      p.fireT = (p.fireT || 0) - dt;
      if (p.gun > 0) p.gun = Math.max(0, p.gun - dt * 18);
      if (!p.firing) { if (p.fireT < 0) p.fireT = 0; return; }
      let guard = 3;
      while (p.fireT <= 0 && guard-- > 0) {
        p.fireT += fire(p) / ((p.stats && p.stats.fireRateMul) || 1);
        if (SL.audio && SL.audio.sfx && Math.random() < 0.5) SL.audio.sfx('shot_pulse', { x: p.x, vol: 0.4 });
      }
    },

    drawShip(p, ctx) {
      const i = p.index ? 1 : 0;
      const f = Math.round(((U.clamp(p.bank, -0.35, 0.35) / 0.35 + 1) / 2) * (FRAMES - 1));
      const key = 'wpn:jet' + i + ':' + f;
      const t = SL.time.real;
      const pal = p.palette || SL.pal.player;
      const vy = p.vy || 0;
      const throttle = U.clamp(1 + (-vy / 560) * 0.45, 0.55, 1.5);
      const sx = 1 - 0.24 * Math.abs(p.bank / 0.35);
      for (const side of [-1, 1]) {
        A.flame(ctx, p.x + side * 7 * sx, p.y + 47, 9, 34 * throttle, '#ffffff', pal.engine, t + side * 0.37);
      }
      A.drawSprite(ctx, key, p.x, p.y, 0, 1, 1);
      if (p.gun > 0) {
        A.drawGlow(ctx, p.x - 9, p.y - 34, 14 * p.gun + 6, pal.glow, p.gun);
        A.drawGlow(ctx, p.x + 9, p.y - 34, 14 * p.gun + 6, pal.glow, p.gun);
      }
      const blink = (Math.sin(t * 5 + i) + 1) / 2;
      A.drawGlow(ctx, p.x - 41 * sx, p.y + 30, 6 + 3 * blink, pal.glow, 0.35 + 0.4 * blink);
      A.drawGlow(ctx, p.x + 41 * sx, p.y + 30, 6 + 3 * blink, pal.glow, 0.35 + 0.4 * blink);
    },

    setType(p, type) {
      if (type !== 'pulse' && type !== 'spread' && type !== 'lance') return;
      if (p.weapon.type === type) SL.weapons.levelUp(p);
      else p.weapon.type = type === 'lance' ? 'pulse' : type;
    },

    levelUp(p) {
      if (p.weapon.level >= 5) {
        if (SL.game && SL.game.addScore) SL.game.addScore(5000, p.x, p.y - 40);
        return false;
      }
      p.weapon.level++;
      return true;
    },

    onPlayerDown(p) { p.weapon.level = Math.max(1, p.weapon.level - 1); },
  };

  SL.onBoot(() => {
    defineJets();
    A.prewarm(['wpn:pulse', 'wpn:spread', 'wpn:jet0:4']);
  });

  if (SL.debug && SL.debug.sandbox) {
    SL.debug.sandbox('weapons', () => {
      SL.every(2.5, () => SL.spawnEnemy('dummy_gunship', { x: 200 + Math.random() * 320, y: -60, hpMul: 0.6 }));
    });
  }
})(window.SL = window.SL || {});

//# sourceURL=src/09_weapons.js
</script>
<script>
/* STUB: replaced by weapons
   10_pickups.js provides: SL.pickups = { spawn(id, x, y, opts), drop(enemy) } and the pickup types credit,
   credit_big, weapon_spread, shield and bomb (sprites drawn with SL.art; credits spin, capsules pulse).
   drop(e) spills e.credits or def.credits ([min, max] or a number) as gold crystals, then rolls def.drops
   ('id' or [{id, chance}], at most one item) unless the spawn passed drop:false; drop:'id' forces that item.
   Sandbox: 'pickups'. */
(function (SL) {
  'use strict';

  const C = SL.color, A = SL.art;
  const TAU = Math.PI * 2;

  const CAPSULES = {
    weapon_spread: { color: '#46f0a8', letter: 'S' },
    shield: { color: '#4fb4ff', letter: '' },
    bomb: { color: '#ff5a4a', letter: 'B' },
  };

  function defineArt() {
    const gem = (w, h, base, light, dark) => (ctx) => {
      const cx = w / 2;
      const body = A.poly([cx, 0, w, h * 0.38, cx, h, 0, h * 0.38]);
      A.metal(ctx, body, { base, light, dark, spec: 0.8, edge: 0.7, rimWidth: 0.8, rimLight: 1.4, bounds: { x: 0, y: 0, w, h } });
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fill(A.poly([cx, 1.5, cx + w * 0.2, h * 0.38, cx, h * 0.52, cx - w * 0.2, h * 0.38]));
    };
    A.define('pk:credit', 14, 20, gem(14, 20, '#f2b928', '#fff6c8', '#7a4806'), { pad: 2, res: 2 });
    A.define('pk:credit_big', 22, 30, gem(22, 30, '#ffc93a', '#fffbe0', '#8a5208'), { pad: 3, res: 2 });

    for (const id of Object.keys(CAPSULES)) {
      const { color, letter } = CAPSULES[id];
      A.define('pk:' + id, 44, 44, (ctx, w, h) => {
        const cx = w / 2, cy = h / 2;
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 9;
        ctx.strokeStyle = C.rgba(C.mix(color, '#ffffff', 0.35), 0.95);
        ctx.lineWidth = 2.4;
        if (id === 'shield') {
          const hex = A.poly(Array.from({ length: 6 }, (_, i) => [cx + Math.cos(i * TAU / 6 - Math.PI / 2) * 20, cy + Math.sin(i * TAU / 6 - Math.PI / 2) * 20]));
          ctx.stroke(hex);
        } else {
          ctx.beginPath();
          ctx.arc(cx, cy, 19.5, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
        const body = new Path2D();
        if (id === 'shield') {
          body.addPath(A.poly(Array.from({ length: 6 }, (_, i) => [cx + Math.cos(i * TAU / 6 - Math.PI / 2) * 15, cy + Math.sin(i * TAU / 6 - Math.PI / 2) * 15])));
        } else body.arc(cx, cy, 15, 0, TAU);
        A.metal(ctx, body, { base: C.mix(color, '#141a28', 0.45), light: C.mix(color, '#ffffff', 0.55), dark: C.darken(color, 0.78), spec: 0.55 });
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 6;
        ctx.fillStyle = '#ffffff';
        if (letter) {
          ctx.font = '800 18px Oxanium, "Segoe UI", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(letter, cx, cy + 1);
        } else {
          const crest = A.poly([cx, cy - 8, cx + 7, cy - 4, cx + 6, cy + 3, cx, cy + 9, cx - 6, cy + 3, cx - 7, cy - 4]);
          ctx.fill(crest);
        }
        ctx.restore();
        ctx.fillStyle = 'rgba(255,255,255,0.32)';
        ctx.beginPath();
        ctx.ellipse(cx - 4, cy - 8, 7, 3.2, -0.35, 0, TAU);
        ctx.fill();
      }, { pad: 6, res: 2 });
    }
  }

  function drawCredit(pk, ctx) {
    const b = SL.render.base, s = A.get(pk.def.sprite);
    const spin = Math.cos(pk.age * 6 + pk.bob);
    const sx = (0.25 + 0.75 * Math.abs(spin)) * b.s;
    A.drawGlow(ctx, pk.x, pk.y, s.w * 1.5, SL.pal.credit, 0.4 + 0.25 * Math.abs(spin));
    ctx.setTransform(sx, 0, 0, b.s, b.x + pk.x * b.s, b.y + pk.y * b.s);
    ctx.drawImage(s.canvas, -s.cw / 2, -s.ch / 2, s.cw, s.ch);
  }

  function drawCapsule(pk, ctx) {
    const col = CAPSULES[pk.typeId] ? CAPSULES[pk.typeId].color : '#ffffff';
    const y = pk.y + Math.sin(pk.age * 3 + pk.bob) * 4;
    const pulse = 0.5 + 0.5 * Math.sin(pk.age * 6);
    A.drawGlow(ctx, pk.x, y, 34 + 6 * pulse, col, 0.45 + 0.25 * pulse);
    A.drawSprite(ctx, 'pk:' + pk.typeId, pk.x, y, Math.sin(pk.age * 2) * 0.12, 1, 1);
  }

  function sfx(id, x) { if (SL.audio && SL.audio.sfx) SL.audio.sfx(id, { x }); }
  function label(p, text, color) { SL.fx.text(p.x, p.y - 46, text, { color, size: 24, life: 1, rise: 50 }); }

  SL.pickupTypes.define('credit', {
    r: 12, magnet: true, sprite: 'pk:credit', draw: drawCredit,
    apply(p, pk) { SL.game.addCredits(pk.value || 1, null, null, p); sfx('credit', pk.x); },
  });
  SL.pickupTypes.define('credit_big', {
    r: 16, magnet: true, sprite: 'pk:credit_big', draw: drawCredit,
    apply(p, pk) { SL.game.addCredits(pk.value || 10, pk.x, pk.y, p); sfx('credit_big', pk.x); },
  });
  SL.pickupTypes.define('weapon_spread', {
    r: 22, magnet: 0.6, life: 14, draw: drawCapsule,
    apply(p) {
      if (SL.weapons && SL.weapons.setType) SL.weapons.setType(p, 'spread');
      label(p, 'SPREAD L' + p.weapon.level, CAPSULES.weapon_spread.color);
      sfx('powerup', p.x);
    },
  });
  SL.pickupTypes.define('shield', {
    r: 22, magnet: 0.6, life: 14, draw: drawCapsule,
    apply(p) { SL.player.addShield(p, 40); label(p, 'SHIELD', CAPSULES.shield.color); sfx('shield_up', p.x); },
  });
  SL.pickupTypes.define('bomb', {
    r: 22, magnet: 0.6, life: 14, draw: drawCapsule,
    apply(p) {
      if (SL.player.addBomb(p, 1)) label(p, 'BOMB +1', CAPSULES.bomb.color);
      else SL.game.addScore(2000, p.x, p.y - 40);
      sfx('powerup', p.x);
    },
  });

  function spawn(id, x, y, opts) {
    return SL.world.spawnPickup(id, x, y, opts || {});
  }

  function burst(id, e, value) {
    const rng = SL.rng;
    spawn(id, e.x + (rng.next() - 0.5) * (e.r || 20), e.y + (rng.next() - 0.5) * (e.r || 20), {
      value, vx: (rng.next() - 0.5) * 240, vy: -110 - rng.next() * 140,
    });
  }

  SL.pickups = {
    spawn,
    drop(e) {
      if (!e) return;
      const def = e.def || {};
      const rng = SL.rng;
      const cr = e.credits != null ? e.credits : def.credits;
      let total = 0;
      if (Array.isArray(cr)) total = rng.int(cr[0] | 0, cr[1] | 0);
      else if (typeof cr === 'number') total = cr | 0;
      let n = 0;
      while (total >= 10 && n < 8) { burst('credit_big', e, 10); total -= 10; n++; }
      while (total > 0 && n < 16) {
        const v = total > 16 - n ? Math.ceil(total / (16 - n)) : 1;
        burst('credit', e, v);
        total -= v;
        n++;
      }
      if (e.drop === false) return;
      if (typeof e.drop === 'string') { spawn(e.drop, e.x, e.y, { vy: -60 }); return; }
      const d = def.drops;
      if (!d) return;
      const list = Array.isArray(d) ? d : [d];
      for (const it of list) {
        const id = typeof it === 'string' ? it : it && it.id;
        const chance = typeof it === 'string' ? 1 : it && it.chance != null ? it.chance : 1;
        if (id && rng.chance(chance)) { spawn(id, e.x, e.y, { vy: -60 }); break; }
      }
    },
  };

  SL.onBoot(defineArt);

  SL.debug.sandbox('pickups', () => {
    const ids = ['credit', 'credit_big', 'weapon_spread', 'shield', 'bomb'];
    let t = 0.2;
    return (dt) => {
      t -= dt;
      if (t > 0) return;
      t = 3;
      ids.forEach((id, i) => spawn(id, 120 + i * 120, 120, { vy: 20, value: id === 'credit_big' ? 10 : 1 }));
    };
  }, { name: 'Pickups' });

})(window.SL = window.SL || {});

<script>
/* STUB: replaced by enemies
   11_enemies.js provides: enemies dummy_drone (diving popcorn) and dummy_gunship (hovering shooter, multi-circle
   hitbox, item drops), formations line / vee / column, SL.paths (empty helper namespace) and the
   'enemies' sandbox. Art is pre-rendered with SL.art.metal; engine plumes are live. */
(function (SL) {
  'use strict';

  const U = SL.util, A = SL.art;
  const W = SL.W, TAU = Math.PI * 2;
  const PAL = SL.pal.enemy;

  SL.paths = SL.paths || {};

  function defineArt() {
    A.define('en:drone', 46, 48, (ctx, w) => {
      const cx = w / 2;
      for (const s of [-1, 1]) {
        const wing = A.poly([cx + s * 4, 31, cx + s * 22, 9, cx + s * 21, 3, cx + s * 6, 13]);
        A.metal(ctx, wing, { base: PAL.hull2, spec: 0.45, edge: 1.4, bounds: { x: 0, y: 0, w, h: 48 } });
        A.emissive(ctx, A.poly([cx + s * 7, 25, cx + s * 20, 8], true), PAL.seam, 5, { stroke: 1.4 });
      }
      const body = A.symPath(cx, [[0, 46], [5, 36], [7, 21], [6, 9], [3, 2], [0, 3]]);
      A.metal(ctx, body, { base: '#454b63', spec: 0.6, bounds: { x: cx - 8, y: 0, w: 16, h: 48 } });
      A.panelLines(ctx, A.poly([cx - 5, 18, cx + 5, 18], true), '#000', 0.5);
      const eye = new Path2D();
      eye.ellipse(cx, 35, 2.6, 4.2, 0, 0, TAU);
      A.emissive(ctx, eye, PAL.glow, 7);
    }, { pad: 4, res: 2 });

    A.define('en:gunship', 104, 92, (ctx, w) => {
      const cx = w / 2, B = { x: 0, y: 0, w, h: 92 };
      for (const s of [-1, 1]) {
        const strut = A.poly([cx + s * 14, 30, cx + s * 36, 26, cx + s * 36, 44, cx + s * 16, 52]);
        A.metal(ctx, strut, { base: PAL.hull, spec: 0.35, edge: 1.2, bounds: B });
        const pod = new Path2D();
        pod.roundRect(cx + s * 38 - 9, 14, 18, 56, 7);
        A.metal(ctx, pod, { base: PAL.hull2, spec: 0.55, bounds: B });
        const gun = new Path2D();
        gun.rect(cx + s * 38 - 2.5, 66, 5, 18);
        A.metal(ctx, gun, { base: '#6a7088', spec: 0.5, edge: 0.8, rimWidth: 0.8, bounds: B });
        A.emissive(ctx, A.poly([cx + s * 38, 20, cx + s * 38, 60], true), PAL.seam, 6, { stroke: 1.6 });
      }
      const hull = A.symPath(cx, [[0, 88], [12, 80], [21, 62], [25, 38], [20, 15], [10, 4], [0, 6]]);
      A.metal(ctx, hull, { base: '#40465d', spec: 0.62, bounds: { x: cx - 26, y: 0, w: 52, h: 92 } });
      A.panelLines(ctx, A.poly([cx - 19, 34, cx + 19, 34], true), '#000', 0.5);
      A.panelLines(ctx, A.poly([cx - 21, 56, cx + 21, 56], true), '#000', 0.45);
      A.panelLines(ctx, A.poly([cx, 8, cx, 54], true), '#000', 0.3);
      const canopy = new Path2D();
      canopy.ellipse(cx, 70, 7, 9, 0, 0, TAU);
      A.emissive(ctx, canopy, PAL.engine, 8);
      A.emissive(ctx, A.poly([cx - 14, 40, cx - 4, 46, cx - 4, 50, cx - 15, 45]), PAL.seam, 5);
      A.emissive(ctx, A.poly([cx + 14, 40, cx + 4, 46, cx + 4, 50, cx + 15, 45]), PAL.seam, 5);
    }, { pad: 6, res: 2 });
  }

  /** Engine plume at sprite offset (ox, oy), pointing away from the nose (sprite +y is the nose). */
  function plume(ctx, e, ox, oy, w, len) {
    const b = SL.render.base, bs = b.s;
    const c = Math.cos(e.rot), s = Math.sin(e.rot);
    const x = e.x + ox * c - oy * s, y = e.y + ox * s + oy * c;
    const ca = Math.cos(e.rot + Math.PI) * bs, sa = Math.sin(e.rot + Math.PI) * bs;
    ctx.setTransform(ca, sa, -sa, ca, b.x + x * bs, b.y + y * bs);
    A.flame(ctx, 0, 0, w, len, '#ffffff', PAL.engine, SL.time.t + e.id * 0.37 + ox * 0.05);
    ctx.setTransform(bs, 0, 0, bs, b.x, b.y);
  }

  SL.enemies.define('dummy_drone', {
    name: 'Drone', hp: 26, r: 18, score: 100, credits: [1, 2], explosion: 's', sprite: 'en:drone',
    init(e, o) {
      e.vy = o.vy != null ? o.vy : 230;
      e.vx = o.vx || 0;
      e.data.diveAt = o.diveAt != null ? o.diveAt : 300 + SL.rng.next() * 260;
      e.data.shot = SL.rng.chance(0.3 * SL.game.diff.fireRate);
      e.rot = Math.atan2(e.vy, e.vx) - Math.PI / 2;
    },
    update(e, dt) {
      const d = e.data;
      if (!d.dived && e.y >= d.diveAt) {
        d.dived = true;
        const p = SL.world.nearestPlayer(e.x, e.y);
        e.vx = U.clamp(((p ? p.x : e.x) - e.x) * 0.9, -260, 260);
        if (d.shot && p && SL.patterns) SL.patterns.aimed(e, p, { speed: 240, type: 'orb' });
      }
      if (d.dived) e.vy = U.approach(e.vy, 430, 600 * dt);
      e.rot = U.lerpAngle(e.rot, Math.atan2(e.vy, e.vx) - Math.PI / 2, Math.min(1, dt * 8));
    },
    draw(e, ctx) {
      plume(ctx, e, 0, -20, 9, 26);
      SL.world.drawDefault(e, ctx);
    },
  });

  SL.enemies.define('dummy_gunship', {
    name: 'Gunship', hp: 320, r: 40, score: 600, credits: [6, 10], explosion: 'm', sprite: 'en:gunship',
    drops: [{ id: 'weapon_spread', chance: 0.3 }, { id: 'shield', chance: 0.2 }, { id: 'bomb', chance: 0.1 }],
    init(e, o) {
      e.vy = 180;
      e.data.hoverY = o.hoverY != null ? o.hoverY : 210 + SL.rng.next() * 140;
      e.data.fireT = 1.2;
      e.data.volley = 0;
      e.data.muzzle = 0;
      e.data.stay = o.stay || 9;
      e.circles = [{ x: 0, y: 4, r: 28 }, { x: -38, y: -2, r: 15 }, { x: 38, y: -2, r: 15 }];
    },
    update(e, dt) {
      const d = e.data;
      if (d.muzzle > 0) d.muzzle -= dt;
      if (d.leaving) {
        e.vy = U.approach(e.vy, 170, 220 * dt);
        e.vx *= 1 / (1 + dt);
        return;
      }
      e.vy = e.y < d.hoverY ? Math.max(30, (d.hoverY - e.y) * 2.2) : 0;
      e.vx = Math.sin(e.age * 0.8) * 70;
      if (e.y > d.hoverY - 40) {
        d.fireT -= dt;
        if (d.fireT <= 0 && SL.patterns) {
          d.fireT = 1.5 / (SL.game.diff.fireRate || 1);
          d.volley++;
          if (d.volley % 3 === 0) SL.patterns.ring(e, { count: 14, speed: 165, type: 'orb', offset: e.age });
          else {
            SL.patterns.aimed({ x: e.x - 38, y: e.y + 40 }, null, { count: 2, spread: 0.2, speed: 250, type: 'needle' });
            SL.patterns.aimed({ x: e.x + 38, y: e.y + 40 }, null, { count: 2, spread: 0.2, speed: 250, type: 'needle' });
          }
          d.muzzle = 0.12;
        }
      }
      if (e.age > d.stay + 2) d.leaving = true;
    },
    draw(e, ctx) {
      plume(ctx, e, -12, -40, 12, 30);
      plume(ctx, e, 12, -40, 12, 30);
      SL.world.drawDefault(e, ctx);
      if (e.data.muzzle > 0) {
        const k = e.data.muzzle / 0.12;
        A.drawGlow(ctx, e.x - 38, e.y + 44, 18 * k + 6, PAL.glow, k);
        A.drawGlow(ctx, e.x + 38, e.y + 44, 18 * k + 6, PAL.glow, k);
      }
    },
  });

  function spawnAt(o, x, y) {
    return SL.spawnEnemy(o.enemy || 'dummy_drone', Object.assign({ x, y }, o.enemyOpts || {}));
  }
  SL.formations.define('line', (o) => {
    const n = o.count || 5, gap = o.gap || 80, x0 = o.x != null ? o.x : W / 2, y0 = o.y != null ? o.y : -50;
    const out = [];
    for (let i = 0; i < n; i++) out.push(spawnAt(o, x0 + (i - (n - 1) / 2) * gap, y0 - i * (o.stagger || 0)));
    return out;
  });
  SL.formations.define('vee', (o) => {
    const n = o.count || 5, gap = o.gap || 64, x0 = o.x != null ? o.x : W / 2, y0 = o.y != null ? o.y : -50;
    const out = [];
    for (let i = 0; i < n; i++) {
      const k = i - (n - 1) / 2;
      out.push(spawnAt(o, x0 + k * gap, y0 - Math.abs(k) * 46));
    }
    return out;
  });
  SL.formations.define('column', (o) => {
    const n = o.count || 6, gap = o.gap || 70, x0 = o.x != null ? o.x : W / 2, y0 = o.y != null ? o.y : -50;
    const out = [];
    for (let i = 0; i < n; i++) out.push(spawnAt(o, x0 + Math.sin(i * 0.9) * (o.weave || 0), y0 - i * gap));
    return out;
  });

  SL.onBoot(defineArt);

  SL.debug.sandbox('enemies', () => {
    let t = 0.3, i = 0;
    return (dt) => {
      t -= dt;
      if (t > 0) return;
      t = 2.2;
      if (i++ % 2) SL.spawnEnemy('dummy_gunship', { x: 180 + SL.rng.next() * 360 });
      else SL.formations.get('vee')({ enemy: 'dummy_drone', count: 5, x: 360 });
    };
  }, { name: 'Enemies' });
})(window.SL = window.SL || {});

<script>
/* STUB: replaced by enemies
   12_patterns.js provides: SL.patterns = { aimed(src, target, {speed, type, count, spread, ox, oy, ...}),
   fan(src, angle, {speed, type, count, spread, ...}), ring(src, {count, speed, type, offset, ...}) } using the core
   bullet types (orb, orbBig, needle, shard, mine). src is any {x, y}; target null aims at the nearest player
   (straight down when nobody is alive). Every pattern returns the bullets it fired; extra options pass through
   to SL.fireEnemy (color, accel, wave, delay, ...). ring scales its count by SL.game.diff.fireRate. */
(function (SL) {
  'use strict';

  const TAU = Math.PI * 2;

  function aim(x, y, target) {
    let t = target;
    if (!t || t.dead || t.alive === false) t = SL.world.nearestPlayer(x, y);
    return t ? Math.atan2(t.y - y, t.x - x) : Math.PI / 2;
  }

  function spray(x, y, a0, n, spread, o) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = n === 1 ? a0 : a0 + (i / (n - 1) - 0.5) * spread;
      out.push(SL.fireEnemy(x, y, a, o.speed || 240, o.type || 'orb', o));
    }
    return out;
  }

  SL.patterns = {
    aimed(src, target, o) {
      o = o || {};
      const x = src.x + (o.ox || 0), y = src.y + (o.oy || 0);
      const n = Math.max(1, o.count || 1);
      return spray(x, y, aim(x, y, target), n, o.spread != null ? o.spread : 0.18 * (n - 1), o);
    },
    fan(src, angle, o) {
      o = o || {};
      const n = Math.max(1, o.count || 5);
      return spray(src.x + (o.ox || 0), src.y + (o.oy || 0), angle == null ? Math.PI / 2 : angle, n, o.spread != null ? o.spread : 0.9, o);
    },
    ring(src, o) {
      o = o || {};
      const n = Math.max(3, Math.round((o.count || 12) * ((SL.game.diff && SL.game.diff.fireRate) || 1)));
      const x = src.x + (o.ox || 0), y = src.y + (o.oy || 0), off = o.offset || 0;
      const out = [];
      for (let i = 0; i < n; i++) out.push(SL.fireEnemy(x, y, off + (i / n) * TAU, o.speed || 180, o.type || 'orb', o));
      return out;
    },
  };
})(window.SL = window.SL || {});

</script>
<script>
/* STUB: replaced by bossesA
   13a_bosses.js provides: boss test_boss ("CALIBRATOR"): a 2.8 s descent intro, phase 'Volley' (aimed fans from
   two turrets, needle rings) and phase 'Overdrive' at 50% (triple spiral plus a tracking beam), a multi-circle
   hitbox, live core glow and engines, and a ~2.6 s chained death sequence built on SL.every / SL.after that ends
   in SL.game.bossDefeated(b). Sandbox: 'boss:test_boss'. */
(function (SL) {
  'use strict';

  const U = SL.util, A = SL.art;
  const TAU = Math.PI * 2;
  const PAL = SL.pal.enemy;
  const fr = () => (SL.game.diff && SL.game.diff.fireRate) || 1;

  function defineArt() {
    A.define('boss:test', 280, 200, (ctx, w, h) => {
      const cx = w / 2, B = { x: 0, y: 0, w, h };
      const hull = A.symPath(cx, [[0, 196], [26, 182], [60, 150], [128, 98], [138, 72], [112, 42], [66, 22], [30, 6], [0, 12]]);
      A.metal(ctx, hull, { base: '#353a50', spec: 0.5, bounds: B });
      const plate = A.symPath(cx, [[0, 168], [22, 156], [46, 126], [62, 92], [52, 54], [28, 30], [0, 34]]);
      A.metal(ctx, plate, { base: '#4c5370', spec: 0.65, specPos: 0.32, bounds: { x: cx - 64, y: 28, w: 128, h: 142 } });
      for (const s of [-1, 1]) {
        A.panelLines(ctx, A.poly([cx + s * 62, 94, cx + s * 128, 92], true), '#000', 0.55);
        A.panelLines(ctx, A.poly([cx + s * 50, 132, cx + s * 96, 112], true), '#000', 0.45);
        A.emissive(ctx, A.poly([cx + s * 70, 82, cx + s * 126, 80], true), PAL.seam, 7, { stroke: 1.8 });
        A.emissive(ctx, A.poly([cx + s * 30, 158, cx + s * 54, 136], true), PAL.seam, 6, { stroke: 1.5 });
        const mount = new Path2D();
        mount.arc(cx + s * 92, 108, 15, 0, TAU);
        A.metal(ctx, mount, { base: '#5d6480', spec: 0.6, bounds: { x: cx + s * 92 - 16, y: 92, w: 32, h: 32 } });
        const barrel = new Path2D();
        barrel.rect(cx + s * 92 - 3, 112, 6, 22);
        A.metal(ctx, barrel, { base: '#6f7794', spec: 0.5, edge: 0.8, rimWidth: 0.8, bounds: B });
        const nacelle = new Path2D();
        nacelle.roundRect(cx + s * 46 - 10, 6, 20, 34, 6);
        A.metal(ctx, nacelle, { base: '#2a2e40', spec: 0.4, bounds: B });
      }
      A.panelLines(ctx, A.poly([cx, 40, cx, 80], true), '#000', 0.4);
      A.panelLines(ctx, A.poly([cx - 40, 150, cx + 40, 150], true), '#000', 0.4);
      const socket = new Path2D();
      socket.arc(cx, 104, 27, 0, TAU);
      ctx.fillStyle = '#0a0b12';
      ctx.fill(socket);
      const core = new Path2D();
      core.arc(cx, 104, 19, 0, TAU);
      A.emissive(ctx, core, PAL.glow, 16);
    }, { pad: 10, res: 2 });
  }

  function plume(ctx, x, y, w, len, t) {
    const b = SL.render.base, bs = b.s;
    ctx.setTransform(-bs, 0, 0, -bs, b.x + x * bs, b.y + y * bs);
    A.flame(ctx, 0, 0, w, len, '#ffffff', PAL.engine, t);
    ctx.setTransform(bs, 0, 0, bs, b.x, b.y);
  }

  SL.bosses.define('test_boss', {
    name: 'CALIBRATOR', title: 'Test Dreadnought', hp: 5200, r: 96, score: 20000, parTime: 70, explosion: 'xl',
    sprite: 'boss:test',
    init(b) {
      b.circles = [{ x: 0, y: 18, r: 62 }, { x: -92, y: -4, r: 34 }, { x: 92, y: -4, r: 34 }, { x: 0, y: -52, r: 40 }];
      b.data.muzzle = 0;
    },
    intro(b, dt) {
      const d = b.data;
      d.it = (d.it || 0) + dt;
      const k = Math.min(1, d.it / 2.8);
      b.x = 360;
      b.y = U.lerp(-170, 280, SL.ease.outCubic(k));
      return k >= 1;
    },
    update(b, dt) {
      b.x = 360 + Math.sin(b.fightT * 0.55) * 130;
      b.y = 280 + Math.sin(b.fightT * 1.1) * 18;
      if (b.data.muzzle > 0) b.data.muzzle -= dt;
    },
    phases: [
      {
        at: 1, name: 'Volley',
        enter(b) { b.data.fireT = 1; b.data.v = 0; },
        update(b, dt) {
          const d = b.data;
          d.fireT -= dt;
          if (d.fireT > 0) return;
          d.fireT = 1.15 / fr();
          d.v++;
          if (d.v % 2) {
            SL.patterns.aimed({ x: b.x - 92, y: b.y + 34 }, null, { count: 5, spread: 0.5, speed: 230, type: 'orb' });
            SL.patterns.aimed({ x: b.x + 92, y: b.y + 34 }, null, { count: 5, spread: 0.5, speed: 230, type: 'orb' });
            d.muzzle = 0.14;
          } else SL.patterns.ring({ x: b.x, y: b.y + 6 }, { count: 20, speed: 150, type: 'needle', offset: d.v * 0.13 });
        },
      },
      {
        at: 0.5, name: 'Overdrive',
        enter(b) {
          const d = b.data;
          d.spin = 0;
          d.sprT = 0.6;
          d.beamT = 2.5;
          SL.fx.shockwave(b.x, b.y, { radius: 420, duration: 0.8, strength: 1.4, color: '#ff9ab8' });
          SL.fx.flash('#ff5c8a', 0.22, 0.3);
          if (SL.hud && SL.hud.banner) SL.hud.banner('OVERDRIVE', { sub: 'Core output rising', color: '#ff5c8a', duration: 1.6 });
        },
        update(b, dt) {
          const d = b.data;
          d.spin += dt * 2.1;
          d.sprT -= dt;
          if (d.sprT <= 0) {
            d.sprT = 0.12 / fr();
            for (let k = 0; k < 3; k++) SL.fireEnemy(b.x, b.y + 6, d.spin + (k * TAU) / 3, 165, 'orb', { color: SL.pal.ebullet.orange });
          }
          d.beamT -= dt;
          if (d.beamT <= 0) {
            d.beamT = 5.5;
            SL.fireEnemyBeam(b, { angle: 'aim', width: 30, telegraph: 0.9, duration: 1.1, oy: 40, track: 0.6 });
          }
        },
      },
    ],
    draw(b, ctx) {
      const t = SL.time.t;
      const jx = b.dying ? (Math.random() - 0.5) * 8 : 0, jy = b.dying ? (Math.random() - 0.5) * 6 : 0;
      for (const s of [-1, 1]) plume(ctx, b.x + s * 46 + jx, b.y - 88 + jy, 16, 46, t + s * 0.3);
      const x = b.x, y = b.y;
      b.x += jx;
      b.y += jy;
      SL.world.drawDefault(b, ctx);
      b.x = x;
      b.y = y;
      const over = b.phase >= 1;
      const pulse = 0.5 + 0.5 * Math.sin(t * (over ? 9 : 4));
      A.drawGlow(ctx, x + jx, y + 4 + jy, 34 + 14 * pulse, over ? '#ff8a3d' : PAL.glow, 0.55 + 0.35 * pulse);
      if (b.data.muzzle > 0) {
        const k = b.data.muzzle / 0.14;
        A.drawGlow(ctx, x - 92, y + 38, 22 * k + 8, PAL.glow, k);
        A.drawGlow(ctx, x + 92, y + 38, 22 * k + 8, PAL.glow, k);
      }
    },
    onDeath(b) {
      SL.every(0.13, (i) => {
        SL.fx.explode(b.x + (Math.random() - 0.5) * 230, b.y + (Math.random() - 0.5) * 130, { size: i % 4 === 3 ? 'l' : 'm', sound: i % 2 === 0 });
      }, 19);
      SL.after(2.6, () => {
        SL.fx.explode(b.x, b.y, { size: 'boss' });
        SL.fx.shockwave(b.x, b.y, { radius: 760, duration: 1.2, strength: 2 });
        SL.game.bossDefeated(b);
      });
    },
  });

  SL.onBoot(defineArt);

  SL.debug.sandbox('boss:test_boss', () => {
    let wait = 0.5;
    return (dt) => {
      if (SL.game.boss) return;
      wait -= dt;
      if (wait <= 0) { SL.spawnBoss('test_boss'); wait = 3; }
    };
  }, { name: 'Boss test_boss', god: true });
})(window.SL = window.SL || {});

<script>
/* STUB: replaced by bossesB
   13b_bosses.js provides: nothing yet. bossesB defines the m4 and m5 bosses here with SL.bosses.define (see
   13a_bosses.js test_boss for a working example of intro, phases, draw and the death sequence). */

<script>
/* STUB: replaced by hazards
   14_hazards.js provides: hazard test_blackhole. It announces itself (bus 'hazardWarning'), grows in, drifts,
   pulls players, enemy bullets, pickups and pods through SL.world.applyGravity (swallowing bullets at the
   horizon), hurts on horizon contact, renders through SL.render.addLens (WebGL) with a spinning accretion disk
   under it, falls back to a drawn 2D horizon when SL.render.distortion is false, and hums via SL.audio.loop.
   Options: r (horizon, 46), range (430), pull (px/s^2 at the center, 950), strength (lens, 1), vx, vy, life.
   Sandbox: 'hazard:test_blackhole'. */
(function (SL) {
  'use strict';

  const U = SL.util, A = SL.art;
  const TAU = Math.PI * 2;
  const HOLE_CORE = 0.38;

  function defineArt() {
    A.define('hz:disk', 256, 256, (ctx, w, h) => {
      const cx = w / 2, cy = h / 2;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 128);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.3, 'rgba(255,240,210,0)');
      g.addColorStop(0.37, 'rgba(255,240,205,0.95)');
      g.addColorStop(0.47, 'rgba(255,172,84,0.75)');
      g.addColorStop(0.66, 'rgba(214,78,44,0.32)');
      g.addColorStop(0.86, 'rgba(120,28,64,0.1)');
      g.addColorStop(1, 'rgba(60,10,40,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      const rng = SL.makeRng(41);
      for (let i = 0; i < 60; i++) {
        const r = 44 + rng.next() * 68, a0 = rng.next() * TAU, len = 0.3 + rng.next() * 1.3;
        ctx.strokeStyle = 'rgba(255,' + (150 + rng.int(0, 90)) + ',' + (80 + rng.int(0, 80)) + ',' + (0.06 + rng.next() * 0.2).toFixed(3) + ')';
        ctx.lineWidth = 1 + rng.next() * 2.6;
        ctx.beginPath();
        ctx.arc(cx, cy, r, a0, a0 + len);
        ctx.stroke();
      }
    }, { pad: 0 });

    // 2D fallback: black horizon, photon ring, dark halo
    A.define('hz:hole', 128, 128, (ctx, w, h) => {
      const cx = w / 2, cy = h / 2, R = 64;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(HOLE_CORE - 0.01, 'rgba(0,0,0,1)');
      g.addColorStop(HOLE_CORE + 0.015, 'rgba(255,214,160,0.95)');
      g.addColorStop(HOLE_CORE + 0.05, 'rgba(255,140,70,0.5)');
      g.addColorStop(HOLE_CORE + 0.09, 'rgba(10,6,14,0.75)');
      g.addColorStop(0.7, 'rgba(4,3,8,0.35)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }, { pad: 0 });
  }

  function grown(h) { return SL.ease.inOutQuad(U.clamp(h.grow, 0, 1)); }

  SL.hazards.define('test_blackhole', {
    r: 46,
    init(h, o) {
      h.r = o.r || 46;
      h.range = o.range || 430;
      h.pull = o.pull || 950;
      h.strength = o.strength != null ? o.strength : 1;
      h.vx = o.vx || 0;
      h.vy = o.vy != null ? o.vy : 40;
      h.life = o.life || 16;
      h.grow = 0;
      h.data.spin = 0;
      SL.bus.emit('hazardWarning', { id: 'test_blackhole', text: 'GRAVITY WELL', h });
      h.data.hum = SL.audio && SL.audio.loop ? SL.audio.loop('blackhole', { vol: 0, x: h.x }) : null;
    },
    update(h, dt) {
      const ending = h.age > h.life || h.y > SL.H + 140;
      h.grow = U.approach(h.grow, ending ? 0 : 1, dt * (ending ? 0.9 : 0.6));
      if (ending && h.grow <= 0) { h.dead = true; return; }
      const k = grown(h);
      h.data.spin += dt * 1.6;
      SL.world.applyGravity(h.x, h.y, h.pull * k, h.range, { consume: h.r * 0.85 * k });
      SL.render.addLens(h.x, h.y, h.r * k, h.strength * k);
      const hr = h.r * k + 8;
      for (const p of SL.world.players) {
        if (p.alive && !p.display && U.dist2(p.x, p.y, h.x, h.y) < hr * hr) SL.damagePlayer(p, 25, { source: 'hazard' });
      }
      if (h.data.hum && h.data.hum.set) h.data.hum.set({ vol: 0.6 * k, x: h.x });
    },
    drawUnder(h, ctx) {
      const k = grown(h);
      if (k <= 0.01) return;
      const b = SL.render.base, bs = b.s;
      const spr = A.get('hz:disk');
      const R = h.r * 3.4 * k;
      const tilt = -0.32, squash = 0.3;
      const ct = Math.cos(tilt), st = Math.sin(tilt), cs = Math.cos(h.data.spin), ss = Math.sin(h.data.spin);
      // rotate(tilt) * scale(1, squash) * rotate(spin): the disk spins in its own tilted plane
      const m00 = ct * cs - st * squash * ss, m01 = -ct * ss - st * squash * cs;
      const m10 = st * cs + ct * squash * ss, m11 = -st * ss + ct * squash * cs;
      ctx.setTransform(m00 * bs, m10 * bs, m01 * bs, m11 * bs, b.x + h.x * bs, b.y + h.y * bs);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.95 * k;
      ctx.drawImage(spr.canvas, -R, -R, R * 2, R * 2);
      ctx.setTransform(bs, 0, 0, bs, b.x, b.y);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      A.drawGlow(ctx, h.x, h.y, h.r * 4.2 * k, '#ff7a3d', 0.22 * k);
    },
    drawOver(h, ctx) {
      if (SL.render.distortion) return;
      const k = grown(h);
      if (k <= 0.01) return;
      A.drawSprite(ctx, 'hz:hole', h.x, h.y, 0, (h.r * k) / (64 * HOLE_CORE), 1);
    },
    onEnd(h) {
      if (h.data.hum && h.data.hum.stop) h.data.hum.stop(0.6);
    },
  });

  SL.onBoot(defineArt);

  SL.debug.sandbox('hazard:test_blackhole', () => {
    let wait = 0.3;
    return (dt) => {
      if (SL.world.hazards.some((h) => !h.dead)) return;
      wait -= dt;
      if (wait <= 0) { SL.spawnHazard('test_blackhole', { x: 360, y: 430, vy: 0, life: 30 }); wait = 2; }
    };
  }, { name: 'Black hole', god: true });
})(window.SL = window.SL || {});

<script>
/* STUB: replaced by story
   16_story.js provides: SL.story = { characters, briefings, lines, choices, radio(idOrObj, opts), say(who, text,
   opts), choice(id) -> Promise<optionId>, autoChoose(), clear(), update(realDt) }.
   Radio lines queue (max 4, per-line cooldown 12 s, opts.priority jumps the queue, opts.force skips the
   cooldown) and play in a DOM box in #ui with a typewriter, an animated portrait canvas and music ducking.
   choice(id) pauses with SL.game.pause('choice'), shows two buttons, writes session.flags[id] and save.choices,
   resumes with SL.game.resume('choice') and resolves; autoChoose() picks the first option (autopilot).
   {callsign} in text becomes the player's callsign. 21_game.js calls update(realDt) every unpaused frame. */
(function (SL) {
  'use strict';

  const U = SL.util;
  const TAU = Math.PI * 2;

  function portrait(color, visor) {
    return function (ctx, w, h, t, talking) {
      const cx = w / 2;
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, SL.color.mix(color, '#05070f', 0.72));
      bg.addColorStop(1, '#04050b');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = SL.color.rgba(color, 0.18);
      ctx.lineWidth = 1;
      for (let y = (t * 18) % 6; y < h; y += 6) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
      const helm = new Path2D();
      helm.ellipse(cx, h * 0.56, w * 0.3, h * 0.36, 0, 0, TAU);
      const g = ctx.createLinearGradient(cx - w * 0.3, h * 0.2, cx + w * 0.3, h * 0.9);
      g.addColorStop(0, '#e9eef7');
      g.addColorStop(0.45, '#8994ab');
      g.addColorStop(1, '#2a3040');
      ctx.fillStyle = g;
      ctx.fill(helm);
      const vis = new Path2D();
      vis.ellipse(cx, h * 0.55, w * 0.22, h * 0.14, 0, 0, TAU);
      const vg = ctx.createLinearGradient(0, h * 0.42, 0, h * 0.7);
      vg.addColorStop(0, visor);
      vg.addColorStop(1, '#060a14');
      ctx.fillStyle = vg;
      ctx.fill(vis);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.ellipse(cx - w * 0.09, h * 0.5, w * 0.07, h * 0.025, -0.3, 0, TAU);
      ctx.fill();
      const open = talking ? 0.4 + 0.6 * Math.abs(Math.sin(t * 17)) : 0.15;
      ctx.fillStyle = SL.color.rgba(color, 0.9);
      ctx.fillRect(cx - w * 0.1, h * 0.79, w * 0.2, Math.max(1, h * 0.03 * open * 2));
    };
  }

  const S = SL.story = {
    characters: {
      anvil: { name: 'ANVIL', role: 'Command', color: '#ffb53f', portrait: portrait('#ffb53f', '#ffd27a') },
      sparrow: { name: 'SPARROW', role: 'Wing', color: '#3fc8ff', portrait: portrait('#3fc8ff', '#9fe8ff') },
    },
    briefings: {
      test: { title: 'Test Range', text: 'Core systems check: waves, a gravity well, rescues and the Calibrator.' },
    },
    lines: {
      test_hello: { who: 'anvil', text: 'Starlance, {callsign}: weapons free. Clear the range.' },
      test_blackhole: { who: 'sparrow', text: 'Gravity well ahead! Keep your thrust up and stay off the rim.' },
      test_boss: { who: 'anvil', text: 'Big contact inbound. Hit the core between its volleys.' },
      test_victory: { who: 'anvil', text: 'Target down. Good flying, {callsign}. Bring it home.' },
      rescue_thanks: { who: 'sparrow', text: 'Pod secured. They say thanks, {callsign}!' },
    },
    choices: {
      test_choice: {
        prompt: 'A distress beacon is pinging off the flight path. Divert to cover the pod?',
        options: [{ id: 'a', text: 'Divert and cover' }, { id: 'b', text: 'Hold formation' }],
      },
    },
  };

  // ------------------------------------------------------------------ radio box
  const queue = [];
  const lastPlayed = Object.create(null);
  let cur = null, gap = 0;
  let box = null, face = null, faceCtx = null, whoEl = null, textEl = null;

  function format(text) {
    const save = SL.save && SL.save.data;
    return String(text || '').replace(/\{callsign\}/g, (save && save.callsign) || 'LANCE');
  }

  function ensureBox() {
    if (box) return true;
    const ui = document.getElementById('ui');
    if (!ui) return false;
    box = document.createElement('div');
    box.className = 'sl-radio';
    box.setAttribute('role', 'status');
    box.setAttribute('aria-live', 'polite');
    face = document.createElement('canvas');
    face.className = 'sl-radio__face';
    face.width = 96;
    face.height = 96;
    faceCtx = face.getContext('2d');
    const body = document.createElement('div');
    body.className = 'sl-radio__body';
    whoEl = document.createElement('div');
    whoEl.className = 'sl-radio__who';
    textEl = document.createElement('div');
    textEl.className = 'sl-radio__text';
    body.append(whoEl, textEl);
    box.append(face, body);
    ui.appendChild(box);
    return true;
  }

  function startLine(item) {
    if (!ensureBox()) return;
    const ch = S.characters[item.who] || { name: String(item.who || 'RADIO').toUpperCase(), role: '', color: '#93a0ba', portrait: null };
    cur = { item, ch, t: 0, shown: -1, typeDur: item.text.length / 42, hold: 1.6 + item.text.length * 0.03, faceT: 0 };
    whoEl.textContent = ch.name + (ch.role ? ' \u00b7 ' + ch.role : '');
    whoEl.style.color = ch.color;
    box.style.setProperty('--radio-color', ch.color);
    textEl.textContent = '';
    box.classList.add('is-on');
    if (SL.audio) {
      if (SL.audio.duck) SL.audio.duck(0.4, cur.typeDur + cur.hold);
      if (SL.audio.sfx) SL.audio.sfx('radio_in');
    }
  }

  function endLine() {
    cur = null;
    gap = 0.35;
    if (box) box.classList.remove('is-on');
  }

  S.radio = function (idOrObj, opts) {
    opts = opts || {};
    let line = null, id = null;
    if (typeof idOrObj === 'string') {
      id = idOrObj;
      line = S.lines[id];
      if (!line) { U.warnOnce('radio:' + id, 'unknown radio line "' + id + '"'); return false; }
    } else if (idOrObj && typeof idOrObj === 'object') {
      line = idOrObj;
      id = line.id || null;
    } else return false;
    const now = SL.time.real;
    if (id && !opts.force && lastPlayed[id] != null && now - lastPlayed[id] < (opts.cooldown || 12)) return false;
    if (queue.length >= 4 && !opts.priority) return false;
    const item = { id, who: line.who, text: format(line.text) };
    if (opts.priority) queue.unshift(item); else queue.push(item);
    if (id) lastPlayed[id] = now;
    return true;
  };

  S.say = function (who, text, opts) { return S.radio({ who, text }, opts); };

  S.clear = function () {
    queue.length = 0;
    endLine();
    gap = 0;
  };

  S.update = function (dt) {
    if (!cur) {
      if (gap > 0) { gap -= dt; return; }
      if (queue.length) startLine(queue.shift());
      return;
    }
    const speed = (SL.save && SL.save.settings && SL.save.settings.radioSpeed) || 1;
    cur.t += dt * speed;
    const text = cur.item.text;
    const n = Math.min(text.length, Math.floor((cur.t / Math.max(0.01, cur.typeDur)) * text.length));
    if (n !== cur.shown) { cur.shown = n; textEl.textContent = text.slice(0, n); }
    cur.faceT -= dt;
    if (cur.faceT <= 0 && cur.ch.portrait) {
      cur.faceT = 0.05;
      try { cur.ch.portrait(faceCtx, 96, 96, SL.time.real, n < text.length); } catch (err) { cur.ch.portrait = null; console.error('[SL.story] portrait threw:', err); }
    }
    if (cur.t > cur.typeDur + cur.hold) endLine();
  };

  // ------------------------------------------------------------------ choices
  let pending = null;

  S.choice = function (id) {
    const def = S.choices[id] || { prompt: id, options: [{ id: 'a', text: 'Option A' }, { id: 'b', text: 'Option B' }] };
    if (!S.choices[id]) U.warnOnce('choice:' + id, 'unknown choice "' + id + '"; showing placeholder options');
    if (pending) pending.finish(pending.def.options[0].id);
    return new Promise((resolve) => {
      const ui = document.getElementById('ui');
      const wrap = document.createElement('div');
      wrap.className = 'sl-choice';
      const panel = document.createElement('div');
      panel.className = 'sl-panel sl-choice__panel';
      const label = document.createElement('div');
      label.className = 'sl-label';
      label.textContent = 'Decision';
      const q = document.createElement('p');
      q.className = 'sl-choice__prompt';
      q.textContent = format(def.prompt);
      const row = document.createElement('div');
      row.className = 'sl-stack';
      panel.append(label, q, row);
      wrap.appendChild(panel);
      const p = { id, def, wrap, finish: null };
      p.finish = (opt) => {
        if (pending !== p) return;
        pending = null;
        wrap.remove();
        const s = SL.game.session;
        if (s) s.flags[id] = opt;
        const save = SL.save.data;
        const key = s ? s.missionId : id;
        const list = save.choices[key] || (save.choices[key] = []);
        if (list.indexOf(opt) < 0) list.push(opt);
        SL.save.commit();
        SL.bus.emit('choiceMade', { id, option: opt });
        SL.game.resume('choice');
        resolve(opt);
      };
      def.options.forEach((o, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sl-btn' + (i === 0 ? ' sl-btn--primary' : '');
        btn.textContent = format(o.text);
        btn.addEventListener('click', () => p.finish(o.id));
        row.appendChild(btn);
      });
      pending = p;
      SL.game.pause('choice');
      if (ui) ui.appendChild(wrap);
      const first = row.querySelector('button');
      if (first) first.focus({ preventScroll: true });
    });
  };

  S.autoChoose = function () {
    if (pending) pending.finish(pending.def.options[0].id);
  };

  SL.onBoot(() => {
    SL.bus.on('missionStart', S.clear);
    SL.bus.on('missionEnd', () => {
      S.clear();
      if (pending) { const p = pending; pending = null; p.wrap.remove(); }
    });
    SL.bus.on('bossWarning', () => { if (S.lines.test_boss) S.radio('test_boss'); });
  });

  SL.debug.sandbox('portraits', () => {
    const ids = Object.keys(S.characters);
    let i = 0, t = 0;
    return (dt) => {
      t -= dt;
      if (t > 0) return;
      t = 3.5;
      const id = ids[i++ % ids.length];
      S.say(id, 'Comms check from ' + S.characters[id].name + '. Reading you loud and clear.', { force: true });
    };
  }, { name: 'Portraits' });
})(window.SL = window.SL || {});

<script>
/* STUB: replaced by story
   17_rescue.js provides: SL.rescue = { spawnPod(x, y, {people, vip, kind, vx, vy, drift}), spawnPilotPod(p) }.
   Escape pods drift and bob with a blinking beacon and an SOS ring. Touch rescues them (25 credits x people,
   500 x multiplier score, session.rescued / podsRescued, save.rescuedTotal, bus 'podRescued', sometimes a
   radio thank-you); VIP pods set save.flags['unlock_' + vip]. Three enemy-bullet hits destroy a pod and leaving
   the bottom loses it (bus 'podLost'). Pilot pods (co-op) revive their owner when the partner flies over them,
   ignore bullets, and show the revive timer as a ring. Sandbox: 'rescue'. */
(function (SL) {
  'use strict';

  const U = SL.util, C = SL.color, A = SL.art;
  const TAU = Math.PI * 2;

  function defineArt() {
    const pod = (trim) => (ctx, w, h) => {
      const cx = w / 2;
      for (const s of [-1, 1]) {
        const fin = A.poly([cx + s * 8, h * 0.62, cx + s * 15, h * 0.86, cx + s * 13, h * 0.95, cx + s * 6, h * 0.84]);
        A.metal(ctx, fin, { base: '#aeb8c8', spec: 0.5, edge: 1, bounds: { x: 0, y: 0, w, h } });
      }
      const body = new Path2D();
      body.ellipse(cx, h * 0.48, w * 0.36, h * 0.44, 0, 0, TAU);
      A.metal(ctx, body, { base: '#e4ebf3', spec: 0.7 });
      const band = new Path2D();
      band.rect(cx - w * 0.34, h * 0.56, w * 0.68, h * 0.07);
      ctx.save();
      ctx.clip(body);
      A.emissive(ctx, band, trim, 4);
      ctx.restore();
      const win = new Path2D();
      win.ellipse(cx, h * 0.34, w * 0.18, h * 0.12, 0, 0, TAU);
      ctx.fillStyle = '#0b2a26';
      ctx.fill(win);
      A.emissive(ctx, win, C.mix(trim, '#ffffff', 0.25), 5);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.ellipse(cx - w * 0.06, h * 0.3, w * 0.06, h * 0.03, -0.4, 0, TAU);
      ctx.fill();
    };
    A.define('rs:pod', 34, 44, pod(SL.pal.rescue), { pad: 4, res: 2 });
    A.define('rs:pilot0', 34, 44, pod(SL.pal.player.trim), { pad: 4, res: 2 });
    A.define('rs:pilot1', 34, 44, pod(SL.pal.player2.trim), { pad: 4, res: 2 });
  }

  function drawPod(pod, ctx, key, color) {
    const d = pod.data;
    const y = pod.y + Math.sin(d.bob * 2.2) * 3;
    const ringK = (d.bob % 1.4) / 1.4;
    const ring = A.ring(color, 64, 5);
    const po = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.55 * (1 - ringK);
    const rr = 20 + 46 * ringK;
    ctx.drawImage(ring, pod.x - rr, y - rr, rr * 2, rr * 2);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = po;
    A.drawSprite(ctx, key, pod.x, y, pod.rot, 1, 1);
    if (pod.flash > 0) A.drawFlash(ctx, key, pod.x, y, pod.rot, 1, pod.flash / 0.1);
    const on = Math.floor(d.bob * 2.5) % 2 === 0;
    A.drawGlow(ctx, pod.x, y - 24, on ? 16 : 7, on ? '#ffffff' : color, on ? 1 : 0.5);
  }

  function session() { return SL.game && SL.game.session; }
  function sfx(id, x) { if (SL.audio && SL.audio.sfx) SL.audio.sfx(id, { x }); }

  function lose(pod, reason) {
    if (pod.dead) return;
    pod.dead = true;
    const s = session();
    if (s) s.podsLost++;
    if (reason === 'destroyed') SL.fx.explode(pod.x, pod.y, { size: 's', palette: 'green', debris: false, sound: false });
    sfx('pod_lost', pod.x);
    SL.bus.emit('podLost', { pod, reason });
  }

  function rescue(pod, p) {
    if (pod.dead) return;
    pod.dead = true;
    pod.rescued = true;
    const s = session(), people = pod.data.people;
    if (s) { s.rescued += people; s.podsRescued++; }
    const save = SL.save.data;
    save.rescuedTotal = (save.rescuedTotal || 0) + people;
    SL.game.addCredits(25 * people, pod.x, pod.y - 26, p);
    SL.game.addScore(500 * (s ? s.mult : 1), pod.x, pod.y + 6);
    if (pod.data.vip) {
      save.flags['unlock_' + pod.data.vip] = true;
      if (SL.story && SL.story.radio) SL.story.radio({ who: 'anvil', text: 'VIP aboard! That changes things, {callsign}.' }, { priority: true });
    } else if (SL.rng.chance(0.4) && SL.story && SL.story.radio) SL.story.radio('rescue_thanks');
    SL.fx.sparks(pod.x, pod.y, { count: 18, color: SL.pal.rescue, speed: 380 });
    SL.fx.shockwave(pod.x, pod.y, { radius: 120, duration: 0.4, strength: 0.4, color: SL.pal.rescue });
    sfx('rescue', pod.x);
    SL.bus.emit('podRescued', { pod, p, people, vip: pod.data.vip || null });
  }

  const POD = {
    r: 18,
    update(pod, dt) {
      const d = pod.data;
      d.bob += dt;
      pod.vy = U.approach(pod.vy, d.drift, 120 * dt);
      pod.vx *= 1 / (1 + 1.5 * dt);
      pod.x = U.clamp(pod.x, 24, SL.W - 24);
      pod.rot = Math.sin(d.bob * 1.3) * 0.25;
      if (pod.flash > 0) pod.flash -= dt;
    },
    draw(pod, ctx) { drawPod(pod, ctx, 'rs:pod', SL.pal.rescue); },
    onTouch(pod, p) { rescue(pod, p); },
    onBullet(pod) {
      pod.data.hits++;
      pod.flash = 0.1;
      SL.fx.hit(pod.x, pod.y, '#ffffff');
      if (pod.data.hits >= 3) lose(pod, 'destroyed');
      return true;
    },
    onExit(pod) { lose(pod, 'escaped'); },
  };

  const PILOT = {
    r: 18,
    update(pod, dt) {
      const d = pod.data;
      d.bob += dt;
      pod.vy = U.approach(pod.vy, 30, 140 * dt);
      pod.vx *= 1 / (1 + 2 * dt);
      pod.x = U.clamp(pod.x, 24, SL.W - 24);
      pod.rot = Math.sin(d.bob * 1.6) * 0.3;
    },
    draw(pod, ctx) {
      const owner = pod.data.owner;
      const color = owner ? owner.palette.trim : SL.pal.player.trim;
      drawPod(pod, ctx, 'rs:pilot' + (owner && owner.index ? 1 : 0), color);
      if (owner && owner.reviveT > 0) {
        const k = U.clamp(owner.reviveT / ((owner.stats && owner.stats.reviveTime) || 8), 0, 1);
        ctx.strokeStyle = C.rgba(color, 0.9);
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(pod.x, pod.y, 30, -Math.PI / 2, -Math.PI / 2 + TAU * k);
        ctx.stroke();
      }
    },
    onTouch(pod, q) {
      const owner = pod.data.owner;
      if (!owner || q === owner || pod.dead || owner.alive) return;
      pod.revived = true;
      pod.dead = true;
      SL.player.revive(owner, pod.x, pod.y, q);
    },
  };

  SL.rescue = {
    spawnPod(x, y, o) {
      o = o || {};
      const pod = SL.world.spawnEntity('pods', POD, { x, y, vx: o.vx || 0, vy: o.vy != null ? o.vy : 50 });
      if (pod.dead) return pod;
      pod.data.people = Math.max(1, o.people || 3);
      pod.data.vip = o.vip || null;
      pod.data.kind = o.kind || 'civilian';
      pod.data.hits = 0;
      pod.data.drift = o.drift || 55;
      pod.data.bob = SL.rng.next() * TAU;
      const s = session();
      if (s) s.podsSpawned++;
      SL.bus.emit('podSpawn', { pod });
      return pod;
    },
    spawnPilotPod(p) {
      const pod = SL.world.spawnEntity('pods', PILOT, { x: p.x, y: p.y, vx: (SL.rng.next() - 0.5) * 80, vy: -70 });
      if (pod.dead) return pod;
      pod.data.owner = p;
      pod.data.pilot = true;
      pod.data.bob = 0;
      return pod;
    },
  };

  SL.onBoot(defineArt);

  SL.debug.sandbox('rescue', () => {
    let t = 0.3, i = 0;
    return (dt) => {
      t -= dt;
      if (t > 0) return;
      t = 2.5;
      SL.rescue.spawnPod(140 + (i++ % 4) * 150, -30, { people: 2 + (i % 3) });
    };
  }, { name: 'Rescue pods' });
})(window.SL = window.SL || {});

<script>
/* STUB: replaced by progress
   19_progress.js provides: SL.upgrades = [], SL.skillTree = {branches: []}, SL.progress = { playerStats(save, index),
   applyMissionResult(result) -> summary, missionUnlocked(id), sideUnlocked(id), buyUpgrade(id), buySkill(id),
   equipSkill(i, id) } and SL.skills = { activate(p), update(p, dt), get(id) } as no-ops.
   playerStats returns the core defaults; applyMissionResult banks result.creditsKept (21_game.js already
   recorded the mission's done / best / rank / plays and the lifetime stats in the save). */
(function (SL) {
  'use strict';

  SL.upgrades = SL.upgrades || [];
  SL.skillTree = SL.skillTree || { branches: [] };

  SL.progress = {
    playerStats() { return SL.player.defaultStats(); },
    applyMissionResult(result) {
      const save = SL.save.data;
      const credits = Math.max(0, Math.round(result.creditsKept || 0));
      save.credits += credits;
      return { credits, bonus: 0, total: save.credits, sp: 0, unlocked: [], skill: null };
    },
    missionUnlocked(id) { return !!SL.missions.has(id); },
    sideUnlocked(id) { return !!(SL.save.data.flags && SL.save.data.flags['unlock_' + id]); },
    buyUpgrade() { return false; },
    buySkill() { return false; },
    equipSkill(i, id) {
      const eq = SL.save.data.skills.equipped;
      if (i !== 0 && i !== 1) return false;
      eq[i] = id || null;
      SL.save.commit();
      return true;
    },
  };

  SL.skills = {
    activate() { return false; },
    update() {},
    get() { return null; },
  };
})(window.SL = window.SL || {});
