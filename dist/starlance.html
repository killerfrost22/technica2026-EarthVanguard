/* ==== 01_base.css ==== */
/* 01_base.css (core)
   Provides: the single dark visual world (tokens on :root), page layout (#app, #ambient, #game 9:16 box,
   #screen, #hud, #ui), and UI primitives for the ui and story modules:
     .sl-screen  full-box overlay layout for a screen      .sl-panel  glossy glass panel
     .sl-btn     glossy button (+ --primary --amber --danger --ghost --small)
     .sl-title   display headline        .sl-label  small caps label      .sl-num  tabular digits
     .sl-row / .sl-stack  flex helpers   .sl-kbd  key cap                  .sl-dim  dim text
   Everything inside #game is sized in cqw (1cqw = 1% of the game box width), so the UI scales with it.
   Layout concept: one portrait 9:16 cockpit glass centered on a blurred echo of itself. */

:root {
  color-scheme: dark;
  /* grounds */
  --sl-bg: #04050b;
  --sl-bg-deep: #020309;
  --sl-bg-raised: #0b1022;
  /* glass */
  --sl-glass: rgba(12, 20, 40, 0.66);
  --sl-glass-strong: rgba(8, 13, 28, 0.88);
  --sl-glass-edge: rgba(127, 227, 255, 0.30);
  --sl-glass-sheen: rgba(190, 235, 255, 0.11);
  --sl-shade: rgba(0, 0, 0, 0.55);
  /* accents: cyan = player one, amber = player two and caution, magenta = enemy and danger */
  --sl-cyan: #3fc8ff;
  --sl-cyan-hi: #9fe8ff;
  --sl-cyan-glow: rgba(63, 200, 255, 0.38);
  --sl-amber: #ffb53f;
  --sl-amber-hi: #ffd27a;
  --sl-amber-glow: rgba(255, 181, 63, 0.38);
  --sl-magenta: #ff2f6d;
  --sl-magenta-hi: #ff5c8a;
  --sl-magenta-glow: rgba(255, 47, 109, 0.4);
  --sl-green: #5dffb0;
  --sl-gold: #ffd34d;
  /* text */
  --sl-text: #e8eef7;
  --sl-text-dim: #93a0ba;
  --sl-text-faint: #5d6984;
  --sl-ink: #03121c;
  /* lines */
  --sl-line: rgba(140, 200, 255, 0.22);
  --sl-line-strong: rgba(127, 227, 255, 0.52);
  /* type */
  --sl-display: 'Oxanium', 'Segoe UI', system-ui, sans-serif;
  --sl-body: 'Barlow Semi Condensed', 'Segoe UI', system-ui, sans-serif;
  /* motion */
  --sl-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --sl-fast: 120ms;
  --sl-med: 260ms;
}

[hidden] { display: none !important; }

html {
  height: 100%;
  box-sizing: border-box;
  background: var(--sl-bg);
}

*, *::before, *::after { box-sizing: inherit; }

body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--sl-bg);
  color: var(--sl-text);
  font-family: var(--sl-body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  container-type: size;
  isolation: isolate;
}

/* Blurred, darkened, low-res copy of the scene that fills the viewport behind the game box. */
#ambient {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: block;
  object-fit: cover;
  filter: blur(44px) brightness(0.46) saturate(1.35);
  transform: scale(1.15);
  pointer-events: none;
}

/* Largest 9:16 box inside the gutters (render re-measures it; JS sizes it if cq units are missing). */
#game {
  position: relative;
  z-index: 1;
  width: min(100cqw, 100cqh * 9 / 16);
  height: min(100cqh, 100cqw * 16 / 9);
  max-width: 100%;
  max-height: 100%;
  container-type: size;
  overflow: hidden;
  background: var(--sl-bg-deep);
  box-shadow: 0 0 0 1px rgba(127, 227, 255, 0.07), 0 2vmin 10vmin rgba(0, 0, 0, 0.7);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  cursor: default;
}

#game > canvas,
#game > .sl-screen-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
}

#hud { z-index: 2; }

#ui {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  font-family: var(--sl-body);
  font-size: 3.6cqw;
  line-height: 1.3;
  color: var(--sl-text);
}

#ui :is(button, a, input, select, textarea, label, [tabindex], .sl-interactive) {
  pointer-events: auto;
}

/* ---------- UI primitives ---------- */

.sl-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3cqw;
  padding: 6cqw;
  text-align: center;
}

.sl-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2.4cqw; }
.sl-stack { display: flex; flex-direction: column; align-items: stretch; gap: 2.2cqw; }

.sl-panel {
  position: relative;
  min-width: 0;
  padding: 4.4cqw 5cqw;
  border-radius: 2.2cqw;
  border: 0.22cqw solid var(--sl-glass-edge);
  background:
    linear-gradient(180deg, var(--sl-glass-sheen) 0%, rgba(255, 255, 255, 0.02) 34%, transparent 35%),
    linear-gradient(180deg, transparent 60%, rgba(63, 200, 255, 0.05)),
    var(--sl-glass);
  box-shadow:
    inset 0 0.2cqw 0 rgba(255, 255, 255, 0.10),
    inset 0 -1cqw 3cqw rgba(0, 0, 0, 0.35),
    0 2.4cqw 7cqw var(--sl-shade),
    0 0 5cqw rgba(63, 200, 255, 0.07);
  -webkit-backdrop-filter: blur(1.4cqw) saturate(1.35);
  backdrop-filter: blur(1.4cqw) saturate(1.35);
}

.sl-panel--danger { border-color: rgba(255, 92, 138, 0.42); box-shadow: inset 0 0.2cqw 0 rgba(255, 255, 255, 0.08), 0 2.4cqw 7cqw var(--sl-shade), 0 0 5cqw rgba(255, 47, 109, 0.12); }
.sl-panel--amber { border-color: rgba(255, 210, 122, 0.42); }

.sl-title {
  margin: 0;
  font-family: var(--sl-display);
  font-weight: 800;
  font-size: 12cqw;
  line-height: 0.95;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-wrap: balance;
  color: var(--sl-text);
  background: linear-gradient(180deg, #ffffff 0%, #dff6ff 42%, var(--sl-cyan-hi) 58%, #5fb4e6 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 2.2cqw var(--sl-cyan-glow));
}

.sl-title--md { font-size: 7.6cqw; }
.sl-title--sm { font-size: 5.4cqw; letter-spacing: 0.08em; }
.sl-title--danger { background: linear-gradient(180deg, #ffffff 0%, #ffd0dc 40%, var(--sl-magenta-hi) 60%, #c51f55 100%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 2.2cqw var(--sl-magenta-glow)); }
.sl-title--amber { background: linear-gradient(180deg, #ffffff 0%, #fff0cf 40%, var(--sl-amber-hi) 60%, #d9861c 100%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 2.2cqw var(--sl-amber-glow)); }

.sl-label {
  font-family: var(--sl-display);
  font-weight: 600;
  font-size: 2.7cqw;
  line-height: 1.2;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--sl-text-dim);
}

.sl-dim { color: var(--sl-text-dim); }
.sl-num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }

.sl-kbd {
  display: inline-block;
  min-width: 4.6cqw;
  padding: 0.5cqw 1.2cqw;
  border-radius: 0.9cqw;
  border: 0.2cqw solid var(--sl-line-strong);

.sl-btn {

  position: relative;

  align-items: center;
  justify-content: center;

  border: 0.22cqw solid var(--sl-line-strong);

    linear-gradient(180deg, rgba(190, 236, 255, 0.24) 0%, rgba(127, 227, 255, 0.07) 46%, rgba(0, 10, 25, 0.28) 54%, rgba(63, 200, 255, 0.14) 100%),
    var(--sl-glass-strong);
  box-shadow:
    inset 0 0.22cqw 0 rgba(255, 255, 255, 0.28),
    inset 0 -0.5cqw 1.2cqw rgba(0, 0, 0, 0.42),
    0 0.9cqw 2.6cqw rgba(0, 0, 0, 0.5);
  color: var(--sl-text);
  font-family: var(--sl-display);
  font-weight: 700;
  font-size: 4.1cqw;
  line-height: 1;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-shadow: 0 0 1.8cqw var(--sl-cyan-glow);
  cursor: pointer;
  transition: transform var(--sl-fast) var(--sl-ease), box-shadow var(--sl-med) var(--sl-ease),
    border-color var(--sl-med) var(--sl-ease), filter var(--sl-med) var(--sl-ease);
  touch-action: manipulation;
}

.sl-btn:hover {
  border-color: var(--sl-cyan-hi);
  filter: brightness(1.14);
  box-shadow:
    inset 0 0.22cqw 0 rgba(255, 255, 255, 0.34),
    inset 0 -0.5cqw 1.2cqw rgba(0, 0, 0, 0.36),
    0 0.9cqw 2.6cqw rgba(0, 0, 0, 0.5),
    0 0 3.6cqw var(--sl-cyan-glow);
}

.sl-btn:active { transform: translateY(0.35cqw) scale(0.985); filter: brightness(0.94); }

.sl-btn:focus { outline: none; }
.sl-btn:focus-visible {
  outline: 0.55cqw solid var(--sl-amber-hi);
  outline-offset: 0.7cqw;
  border-color: var(--sl-amber-hi);
}

.sl-btn:disabled, .sl-btn[aria-disabled="true"] { opacity: 0.45; filter: saturate(0.4); cursor: not-allowed; transform: none; }

.sl-btn--primary {
  color: var(--sl-ink);
  text-shadow: 0 0.15cqw 0 rgba(255, 255, 255, 0.45);
  border-color: rgba(220, 248, 255, 0.85);
  background:

  box-shadow:
    inset 0 0.25cqw 0 rgba(255, 255, 255, 0.85),
    inset 0 -0.6cqw 1.2cqw rgba(0, 60, 110, 0.35),
    0 0.9cqw 2.6cqw rgba(0, 0, 0, 0.5),

}

}

  border-color: rgba(255, 140, 170, 0.7);
  text-shadow: 0 0 1.8cqw var(--sl-magenta-glow);
  background:
    linear-gradient(180deg, rgba(255, 190, 210, 0.24) 0%, rgba(255, 92, 138, 0.10) 46%, rgba(25, 0, 10, 0.3) 54%, rgba(255, 47, 109, 0.16) 100%),

}
.sl-btn--ghost {
  background: transparent;
  border-color: var(--sl-line);
  box-shadow: none;
  text-shadow: none;
  color: var(--sl-text-dim);
}
.sl-btn--ghost:hover { color: var(--sl-text); box-shadow: none; }
.sl-btn--small { min-height: 8cqw; min-width: 0; padding: 1.6cqw 3.6cqw; font-size: 3cqw; border-radius: 1.4cqw; }

.sl-noscript {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

@media (prefers-reduced-motion: reduce) {
  #ui *, #ui *::before, #ui *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  #ambient { transform: none; }
}

.sl-ui-screen { animation: sl-ui-in var(--sl-med) var(--sl-ease) both; }

<noscript><div class="sl-noscript">Starlance needs JavaScript to run. Turn it on and reload the page to fly.</div></noscript>
<script>
/* 00_core.js (core)
   Provides: SL.W, SL.H, SL.VERSION, SL.util, SL.ease, SL.color, SL.makeRng, SL.rng, SL.bus,
   SL.registry and the shared registries (enemies, bosses, hazards, backgrounds, missions, formations,
   pickupTypes, ebulletTypes, pbulletTypes, screens, sandboxes), SL.time, SL.onBoot, SL.after, SL.every,
   and the load-time debug hooks SL.debug.params (URL query) and SL.debug.sandbox(id, fn, opts).
   Internal (driven by 21_game.js): SL._updateTimers(dt), SL._clearTimers().
   Boot: runs every SL.onBoot hook once after the DOM is ready (through window.claude.hot.ready when the
   artifact host provides it), then emits 'boot'. */
(function (SL) {
  'use strict';

  SL.W = 720;
  SL.H = 1280;
  SL.VERSION = '0.9.0';

  const TAU = Math.PI * 2;

  // ---------------------------------------------------------------- util
  const warned = new Set();
  let uidSeq = 1;

  function isPlain(o) {
    if (o === null || typeof o !== 'object' || Array.isArray(o)) return false;
    const p = Object.getPrototypeOf(o);
    return p === Object.prototype || p === null;
  }
  function cloneValue(v) {
    if (Array.isArray(v)) return v.map(cloneValue);
    if (isPlain(v)) return U.deepMerge(v, null);
    return v;
  }

  const U = SL.util = {
    TAU,
    clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
    lerp(a, b, t) { return a + (b - a) * t; },
    invLerp(a, b, v) { return a === b ? 0 : (v - a) / (b - a); },
    /** Unclamped: maps v from [a0, a1] to [b0, b1]. */
    remap(v, a0, a1, b0, b1) { return b0 + (b1 - b0) * U.invLerp(a0, a1, v); },
    smoothstep(e0, e1, x) {
      const t = U.clamp(U.invLerp(e0, e1, x), 0, 1);
      return t * t * (3 - 2 * t);
    },
    approach(cur, target, maxDelta) {
      return cur < target ? Math.min(cur + maxDelta, target) : Math.max(cur - maxDelta, target);
    },
    dist(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); },
    dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; },
    angleTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); },
    /** Wraps to [-PI, PI). */
    wrapAngle(a) {
      a = (a + Math.PI) % TAU;
      if (a < 0) a += TAU;
      return a - Math.PI;
    },
    /** Signed shortest turn from angle a to angle b, in [-PI, PI). */
    angleDiff(a, b) { return U.wrapAngle(b - a); },
    lerpAngle(a, b, t) { return a + U.angleDiff(a, b) * t; },
    rotate(x, y, a) {
      const c = Math.cos(a), s = Math.sin(a);
      return { x: x * c - y * s, y: x * s + y * c };
    },
    sign(v) { return v < 0 ? -1 : v > 0 ? 1 : 0; },
    fmtInt(n) {
      n = Math.round(+n || 0);
      const s = String(Math.abs(n));
      let out = '';
      for (let i = 0; i < s.length; i++) {
        if (i && (s.length - i) % 3 === 0) out += ',';
        out += s[i];
      }
      return (n < 0 ? '-' : '') + out;
    },
    fmtTime(sec) {
      const s = Math.max(0, Math.floor(+sec || 0));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
      const ss = (r < 10 ? '0' : '') + r;
      if (h) return h + ':' + (m < 10 ? '0' : '') + m + ':' + ss;
      return m + ':' + ss;
    },
    warnOnce(key, ...msg) {
      if (warned.has(key)) return;
      warned.add(key);
      console.warn('[SL]', ...(msg.length ? msg : [key]));
    },
    /** Returns a new object: plain objects merge recursively, everything else in b replaces a. */
    deepMerge(a, b) {
      const out = {};
      if (isPlain(a)) for (const k of Object.keys(a)) out[k] = cloneValue(a[k]);
      if (isPlain(b)) {
        for (const k of Object.keys(b)) {
          const v = b[k];
          if (v === undefined) continue;
          out[k] = isPlain(v) && isPlain(out[k]) ? U.deepMerge(out[k], v) : cloneValue(v);
        }
      }
      return out;
    },
    clone(v) { return cloneValue(v); },
    isPlain,
    hash(str) {
      let h = 2166136261 >>> 0;
      str = String(str);
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    },
    uid() { return uidSeq++; },
    noop() {},
    /** Calls SL.audio[method](...args) when it exists; a throwing audio module is reported once, never fatal. */
    audio(method, ...args) {
      const A = SL.audio, fn = A && A[method];
      if (typeof fn !== 'function') return undefined;
      try { return fn.apply(A, args); } catch (err) {
        if (!warned.has('audio-threw:' + method)) {
          warned.add('audio-threw:' + method);
          console.error('[SL] SL.audio.' + method + ' threw (further errors from it are ignored):', err);
        }
        return undefined;
      }
    },
    sfx(id, opts) { return U.audio('sfx', id, opts); },
  };

  // ---------------------------------------------------------------- easing
  SL.ease = {
    linear: (t) => t,
    inQuad: (t) => t * t,
    outQuad: (t) => t * (2 - t),
    inOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
    inCubic: (t) => t * t * t,
    outCubic: (t) => { const u = t - 1; return u * u * u + 1; },
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
    outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1, u = t - 1; return 1 + c3 * u * u * u + c1 * u * u; },
    outElastic: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
    outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    inExpo: (t) => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
    outSine: (t) => Math.sin((t * Math.PI) / 2),
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  };

  // ---------------------------------------------------------------- color
  const parsed = new Map();
  const strCache = new Map();
  const MAGENTA = [255, 0, 255, 1];

  function parseBasic(s) {
    if (s[0] === '#') {
      let h = s.slice(1);
      if (h.length === 3 || h.length === 4) h = h.split('').map((x) => x + x).join('');
      if (/^[0-9a-f]{6}([0-9a-f]{2})?$/i.test(h)) {
        return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16),
          h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
      }
      return null;
    }
    const m = /^rgba?\(([^)]+)\)$/i.exec(s);
    if (m) {
      const p = m[1].split(/[\s,/]+/).filter(Boolean).map(Number);
      if (p.length >= 3 && p.every((x) => !isNaN(x))) return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
    }
    return null;
  }
  // Any other CSS color (hsl(), named colors, ...) is normalized by a 1x1 canvas, once per distinct string.
  let normCtx = null;
  function parseCss(s) {
    try {
      if (!normCtx) normCtx = document.createElement('canvas').getContext('2d');
      const SENTINEL = '#010203';
      normCtx.fillStyle = SENTINEL;
      normCtx.fillStyle = s;
      const out = String(normCtx.fillStyle);
      if (out === SENTINEL && s.replace(/\s/g, '').toLowerCase() !== SENTINEL) return null;
      return parseBasic(out);
    } catch (e) { return null; }
  }

  function parse(c) {
    if (Array.isArray(c)) return c;
    let v = parsed.get(c);
    if (v) return v;
    const s = String(c).trim();
    v = parseBasic(s) || parseCss(s);
    if (!v) {
      U.warnOnce('color:' + s, 'cannot parse color "' + s + '"; using magenta');
      v = MAGENTA;
    }
    if (parsed.size > 2048) parsed.clear();
    parsed.set(c, v);
    return v;
  }
  function hex2(n) {
    n = Math.max(0, Math.min(255, Math.round(n)));
    return (n < 16 ? '0' : '') + n.toString(16);
  }
  function toHex(r, g, b) { return '#' + hex2(r) + hex2(g) + hex2(b); }

  SL.color = {
    parse,
    toHex,
    rgba(hex, a = 1) {
      // alpha is quantized to 1/1000 (the output precision) so animated alphas hit the cache
      const qa = Math.round(U.clamp(+a || 0, 0, 1) * 1000);
      const key = hex + '|' + qa;
      let s = strCache.get(key);
      if (s) return s;
      const p = parse(hex);
      s = 'rgba(' + p[0] + ',' + p[1] + ',' + p[2] + ',' + (qa / 1000).toFixed(3) + ')';
      if (strCache.size > 4096) strCache.clear();
      strCache.set(key, s);
      return s;
    },
    mix(a, b, t) {
      const p = parse(a), q = parse(b);
      return toHex(p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, p[2] + (q[2] - p[2]) * t);
    },
    /** h in degrees, s and l in percent (0..100), a in 0..1. */
    hsl(h, s, l, a = 1) {
      return 'hsla(' + (+h).toFixed(1) + ',' + (+s).toFixed(1) + '%,' + (+l).toFixed(1) + '%,' + (+a).toFixed(3) + ')';
    },
    lighten(hex, amt) { return SL.color.mix(hex, '#ffffff', U.clamp(amt, 0, 1)); },
    darken(hex, amt) { return SL.color.mix(hex, '#000000', U.clamp(amt, 0, 1)); },
    luma(hex) { const p = parse(hex); return (0.299 * p[0] + 0.587 * p[1] + 0.114 * p[2]) / 255; },
  };

  // ---------------------------------------------------------------- rng (mulberry32)
  SL.makeRng = function (seed) {
    let s = 0;
    const r = {
      next() {
        s = (s + 0x6d2b79f5) >>> 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },
      range(a, b) { return a + (b - a) * r.next(); },
      int(a, b) { return a + Math.floor(r.next() * (b - a + 1)); },
      pick(arr) { return arr && arr.length ? arr[Math.floor(r.next() * arr.length)] : undefined; },
      chance(p) { return r.next() < p; },
      sign() { return r.next() < 0.5 ? -1 : 1; },
      gauss() {
        let u = 0;
        while (u === 0) u = r.next();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * r.next());
      },
      seed(n) {
        s = (typeof n === 'string' ? U.hash(n) : Math.floor(+n || 0)) >>> 0;
        r.initial = s;
        return r;
      },
      initial: 0,
    };
    r.seed(seed == null ? (Date.now() ^ 0x5bd1e995) : seed);
    return r;
  };
  SL.rng = SL.makeRng();

  // ---------------------------------------------------------------- event bus
  const listeners = new Map();
  const dirty = new Set();
  let emitting = 0;

  function compact() {
    for (const evt of dirty) {
      const a = listeners.get(evt);
      if (a) listeners.set(evt, a.filter(Boolean));
    }
    dirty.clear();
  }
  function call(fn, data, evt) {
    try { fn(data, evt); } catch (err) { console.error('[SL.bus] listener for "' + evt + '" threw:', err); }
  }

  SL.bus = {
    on(evt, fn) {
      if (typeof fn !== 'function') return U.noop;
      let a = listeners.get(evt);
      if (!a) listeners.set(evt, (a = []));
      a.push(fn);
      return () => SL.bus.off(evt, fn);
    },
    once(evt, fn) {
      const off = SL.bus.on(evt, function onceWrapper(data, e) { off(); fn(data, e); });
      return off;
    },
    off(evt, fn) {
      const a = listeners.get(evt);
      if (!a) return;
      const i = a.indexOf(fn);
      if (i < 0) return;
      if (emitting) { a[i] = null; dirty.add(evt); } else a.splice(i, 1);
    },
    emit(evt, data) {
      const a = listeners.get(evt), w = listeners.get('*');
      if ((!a || !a.length) && (!w || !w.length)) return;
      emitting++;
      if (a) for (let i = 0, n = a.length; i < n; i++) if (a[i]) call(a[i], data, evt);
      if (w) for (let i = 0, n = w.length; i < n; i++) if (w[i]) call(w[i], data, evt);
      emitting--;
      if (!emitting && dirty.size) compact();
    },
    count(evt) { const a = listeners.get(evt); return a ? a.filter(Boolean).length : 0; },
    /** Like on(), but the listener is removed automatically at the next 'missionEnd' (mission complete, fail, quit or
        restart), so per-mission listeners added in onStart / init cannot pile up across runs. Returns off(). */
    onMission(evt, fn) {
      const off = SL.bus.on(evt, fn);
      if (off !== U.noop) missionOffs.push(off);
      return off;
    },
  };
  const missionOffs = [];
  SL.bus.on('missionEnd', () => {
    const list = missionOffs.splice(0, missionOffs.length);
    for (let i = 0; i < list.length; i++) list[i]();
  });

  // ---------------------------------------------------------------- registries
  SL.registry = function (kind) {
    const defs = Object.create(null);
    const reg = {
      kind,
      defs,
      define(id, def) {
        if (typeof id !== 'string' || !id) {
          console.warn('[SL] ' + kind + '.define needs a string id; got', id);
          return def;
        }
        if (def && (typeof def === 'object' || typeof def === 'function')) {
          try { def.id = id; } catch (e) { /* frozen def: keep as is */ }
        }
        defs[id] = def;
        return def;
      },
      get(id) {
        const d = defs[id];
        if (d !== undefined) return d;
        U.warnOnce(kind + ':' + id, 'unknown ' + kind + ' id "' + id + '"');
        return null;
      },
      has(id) { return defs[id] !== undefined; },
      ids() { return Object.keys(defs); },
      all() { return Object.keys(defs).map((k) => defs[k]); },
    };
    return reg;
  };
  ['enemies', 'bosses', 'hazards', 'backgrounds', 'missions', 'formations', 'pickupTypes',
    'ebulletTypes', 'pbulletTypes', 'screens', 'sandboxes'].forEach((k) => { SL[k] = SL.registry(k); });
  // Path helpers (owned by 11_enemies.js): a registry too, so SL.paths.define(id, fn) / get(id) work from load time;
  // plain properties (SL.paths.swoop = fn) also work.
  SL.paths = SL.registry('paths');

  // ---------------------------------------------------------------- time + game-time timers
  SL.time = { t: 0, real: 0, scale: 1, paused: false };

  const timers = [];
  let timerGen = 0;
  function addTimer(sec, fn, every, count) {
    const tm = {
      t: Math.max(0, +sec || 0), every, count, n: 0, fn, dead: false,
      cancel() { tm.dead = true; },
    };
    if (typeof fn === 'function' && count > 0) timers.push(tm); else tm.dead = true;
    return tm;
  }
  /** Calls fn once after `seconds` of game time. Returns {cancel()}. Cleared at mission start/end. */
  SL.after = function (seconds, fn) { return addTimer(seconds, fn, 0, 1); };
  /** Calls fn(i) every `seconds` of game time, `count` times (default forever). Returns {cancel()}. */
  SL.every = function (seconds, fn, count) {
    const every = Math.max(1 / 240, +seconds || 0);
    return addTimer(every, fn, every, count == null ? Infinity : count);
  };
  SL._updateTimers = function (dt) {
    let anyDead = false;
    const gen = timerGen;
    for (let i = 0, n = timers.length; i < n; i++) {
      // a callback that ended the run (completeMission, retry, quitMission ...) cleared the list: stop here
      if (gen !== timerGen) return;
      const tm = timers[i];
      if (!tm) break;
      if (tm.dead) { anyDead = true; continue; }
      tm.t -= dt;
      let guard = 8;
      while (tm.t <= 0 && !tm.dead && guard-- > 0) {
        try { tm.fn(tm.n); } catch (err) { console.error('[SL] timer callback threw:', err); }
        tm.n++;
        if (!tm.every || tm.n >= tm.count) { tm.dead = true; break; }
        tm.t += tm.every;
      }
      if (tm.dead) anyDead = true;
    }
    if (anyDead) {
      let j = 0;
      for (let i = 0; i < timers.length; i++) if (!timers[i].dead) timers[j++] = timers[i];
      timers.length = j;
    }
  };
  SL._clearTimers = function () {
    for (const tm of timers) tm.dead = true;
    timers.length = 0;
    timerGen++;
  };
  SL._timerCount = function () { return timers.length; };

  // ---------------------------------------------------------------- debug hooks usable at load time
  // 22_debug.js loads last and fills in the rest of SL.debug. URL params and sandbox registration live
  // here so every file can read params and register sandboxes while it loads.
  function parseParams() {
    const out = {};
    try { new URLSearchParams(window.location.search).forEach((v, k) => { out[k] = v; }); } catch (e) { /* no location */ }
    return out;
  }
  SL.debug = SL.debug || {};
  SL.debug.params = parseParams();
  /** Registers a sandbox: fn(session) runs inside an empty endless mission; it may return update(dt). */
  SL.debug.sandbox = function (id, fn, opts) {
    if (typeof fn !== 'function') { console.warn('[SL] debug.sandbox("' + id + '") needs a function'); return; }
    SL.sandboxes.define(id, Object.assign({ run: fn }, opts || {}));
  };

  // ---------------------------------------------------------------- boot
  const bootFns = [];
  let booted = false;
  SL.booted = false;
  SL.hotData = {};

  /** Runs fn once after every script has loaded and the DOM is ready (in registration order). */
  SL.onBoot = function (fn) {
    if (typeof fn !== 'function') return;
    if (booted) {
      try { fn(); } catch (err) { console.error('[SL] onBoot hook threw:', err); }
    } else bootFns.push(fn);
  };

  function runBoot(hotData) {
    if (booted) return;
    booted = true;
    SL.hotData = hotData && typeof hotData === 'object' ? hotData : {};
    for (let i = 0; i < bootFns.length; i++) {
      try { bootFns[i](); } catch (err) { console.error('[SL] onBoot hook threw:', err); }
    }
    bootFns.length = 0;
    SL.booted = true;
    SL.bus.emit('boot', {});
  }

  function kick() {
    let hot = null;
    try { hot = window.claude && window.claude.hot; } catch (e) { hot = null; }
    if (hot && typeof hot.ready === 'function') {
      let done = false;
      const go = (data) => {
        if (done) return;
        done = true;
        let d = data;
        if (!d || typeof d !== 'object') { try { d = hot.data; } catch (e) { d = null; } }
        runBoot(d || {});
      };
      try { hot.ready(go); } catch (e) { go(null); }
      setTimeout(() => go(null), 2500);
    } else {
      let d = null;
      try { d = hot && hot.data; } catch (e) { d = null; }
      runBoot(d || {});
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', kick, { once: true });
  else setTimeout(kick, 0);
})(window.SL = window.SL || {});

<script>
/* 01_save.js (core)
   Provides: SL.save = { data, settings, load(), commit(), flush(), reset({settings}), defaults(),
   defaultSettings(), exportCode(), importCode(str), sample(name), useSample(name), setSetting(key, value),
   mission(id), samples, memoryOnly, storageAvailable }.
   Every storage access is wrapped in try/catch with an in-memory fallback, so the game works with no
   storage at all. Keys: starlance.save.v1 and starlance.settings.v1. Emits 'settingsChanged', 'saveLoaded',
   'saveImported', 'saveReset'. */
(function (SL) {
  'use strict';

  const U = SL.util;
  const KEY = 'starlance.save.v1';
  const SKEY = 'starlance.settings.v1';
  const DIFFS = ['cadet', 'pilot', 'ace'];
  const QUALITIES = ['auto', 'high', 'medium', 'low'];
  const memory = Object.create(null);

  function storage() {
    try { return window.localStorage || null; } catch (e) { return null; }
  }
  function read(key) {
    try {
      const s = storage();
      if (s) {
        const v = s.getItem(key);
        if (v != null) return v;
      }
    } catch (e) { /* blocked storage: fall through to memory */ }
    return memory[key] != null ? memory[key] : null;
  }
  function write(key, value) {
    memory[key] = value;
    try {
      const s = storage();
      if (!s) return false;
      s.setItem(key, value);
      return true;
    } catch (e) { return false; }
  }
  function probe() {
    try {
      const s = storage();
      if (!s) return false;
      s.setItem('starlance.probe', '1');
      s.removeItem('starlance.probe');
      return true;
    } catch (e) { return false; }
  }

  function defaults() {
    return {
      v: 1, callsign: 'LANCE', p2callsign: '', credits: 0, sp: 0, difficulty: 'pilot',
      missions: {}, choices: {}, flags: {}, upgrades: {},
      skills: { owned: [], equipped: [null, null] },
      rescuedTotal: 0, stats: { kills: 0, deaths: 0, playSeconds: 0, bombs: 0 }, updatedAt: 0,
    };
  }
  function defaultSettings() {
    return {
      master: 0.9, music: 0.7, sfx: 0.85, autoFire: true, quality: 'auto', shake: 1.0, flashes: true,
      showHitbox: 'focus', touchSensitivity: 1.0, radioSpeed: 1.0,
    };
  }

  function num(v, def, lo, hi) {
    v = +v;
    if (!isFinite(v)) return def;
    return U.clamp(v, lo, hi);
  }
  function obj(v) { return U.isPlain(v) ? v : {}; }

  function normalizeData(d) {
    d = U.deepMerge(defaults(), obj(d));
    d.v = 1;
    d.callsign = String(d.callsign || 'LANCE').slice(0, 16);
    d.p2callsign = String(d.p2callsign || '').slice(0, 16);
    d.credits = Math.floor(num(d.credits, 0, 0, 1e9));
    d.sp = Math.floor(num(d.sp, 0, 0, 1e6));
    if (DIFFS.indexOf(d.difficulty) < 0) d.difficulty = 'pilot';
    d.missions = obj(d.missions);
    d.choices = obj(d.choices);
    d.flags = obj(d.flags);
    d.upgrades = obj(d.upgrades);
    d.skills = obj(d.skills);
    if (!Array.isArray(d.skills.owned)) d.skills.owned = [];
    if (!Array.isArray(d.skills.equipped)) d.skills.equipped = [null, null];
    while (d.skills.equipped.length < 2) d.skills.equipped.push(null);
    d.rescuedTotal = Math.floor(num(d.rescuedTotal, 0, 0, 1e9));
    d.stats = U.deepMerge({ kills: 0, deaths: 0, playSeconds: 0, bombs: 0 }, obj(d.stats));
    return d;
  }
  function normalizeSettings(s) {
    s = U.deepMerge(defaultSettings(), obj(s));
    s.master = num(s.master, 0.9, 0, 1);
    s.music = num(s.music, 0.7, 0, 1);
    s.sfx = num(s.sfx, 0.85, 0, 1);
    s.autoFire = s.autoFire !== false;
    if (QUALITIES.indexOf(s.quality) < 0) s.quality = 'auto';
    s.shake = num(s.shake, 1, 0, 2);
    s.flashes = s.flashes !== false;
    if (s.showHitbox !== 'always') s.showHitbox = 'focus';
    s.touchSensitivity = num(s.touchSensitivity, 1, 0.25, 3);
    s.radioSpeed = num(s.radioSpeed, 1, 0.25, 4);
    return s;
  }
  function parseJSON(text) {
    if (!text) return null;
    try { return JSON.parse(text); } catch (e) { return null; }
  }

  // Sample saves for tests and the ?save= param. Progress may override any of these through
  // SL.save.samples[name] (an object merged over defaults, or a function returning one).
  const MAIN = ['m1', 'm2', 'm3', 'm4', 'm5'];
  const SIDE = ['s1', 's2', 's3', 's4'];
  function rec(rank, best) { return { done: true, best, rank, rescued: 6, plays: 2 }; }
  const CORE_SAMPLES = {
    fresh: () => ({}),
    mid: () => ({
      credits: 2400, sp: 2, rescuedTotal: 14,
      missions: { m1: rec('A', 184200), m2: rec('B', 152900) },
      flags: { unlock_s1: true },
      stats: { kills: 640, deaths: 3, playSeconds: 1500, bombs: 6 },
    }),
    late: () => ({
      credits: 6800, sp: 5, rescuedTotal: 41,
      missions: { m1: rec('S', 240100), m2: rec('A', 210400), m3: rec('A', 233000), m4: rec('B', 198300),
        s1: rec('A', 90100), s2: rec('B', 75600) },
      choices: { s1: ['a'], s2: ['b'] },
      flags: { unlock_s1: true, unlock_s2: true, unlock_s3: true },
      stats: { kills: 2310, deaths: 9, playSeconds: 5200, bombs: 21 },
    }),
    full: () => {
      const missions = {};
      MAIN.concat(SIDE).forEach((id, i) => { missions[id] = rec('S', 250000 + i * 9000); });
      const flags = {};
      SIDE.forEach((id) => { flags['unlock_' + id] = true; });
      return {
        credits: 50000, sp: 20, rescuedTotal: 120, missions, flags,
        choices: { s1: ['a', 'b'], s2: ['a', 'b'], s3: ['a', 'b'], s4: ['a', 'b'] },
        stats: { kills: 6400, deaths: 20, playSeconds: 14400, bombs: 60 },
      };
    },
  };

  let timer = 0;
  let pending = false;
  let firstPending = 0;

  const S = SL.save = {
    KEY, SKEY,
    data: defaults(),
    settings: defaultSettings(),
    samples: {},
    /** true after useSample(): nothing is written to storage for the rest of the session. */
    memoryOnly: false,
    storageAvailable: false,
    defaults,
    defaultSettings,

    load() {
      S.storageAvailable = probe();
      const hot = SL.hotData || {};
      const d = U.isPlain(hot.save) ? hot.save : parseJSON(read(KEY));
      const s = U.isPlain(hot.settings) ? hot.settings : parseJSON(read(SKEY));
      S.data = normalizeData(d);
      S.settings = normalizeSettings(s);
      SL.bus.emit('saveLoaded', { data: S.data, settings: S.settings });
      return S.data;
    },

    /** Debounced (300 ms) write of progress and settings. A steady stream of commits still writes at least every 2 s. */
    commit() {
      const now = Date.now();
      if (!pending) firstPending = now;
      pending = true;
      clearTimeout(timer);
      timer = setTimeout(S.flush, Math.max(0, Math.min(300, firstPending + 2000 - now)));
    },

    flush() {
      clearTimeout(timer);
      if (!pending) return;
      pending = false;
      S.data.updatedAt = Date.now();
      if (S.memoryOnly) return;
      let text, stext;
      try { text = JSON.stringify(S.data); stext = JSON.stringify(S.settings); } catch (e) { console.warn('[SL.save] save data is not serializable', e); return; }
      write(KEY, text);
      write(SKEY, stext);
    },

    /** Resets progress (and settings too with {settings:true}). */
    reset(opts) {
      S.data = defaults();
      if (opts && opts.settings) S.settings = defaultSettings();
      S.commit();
      SL.bus.emit('saveReset', { data: S.data });
      return S.data;
    },

    exportCode() {
      let json;
      try { json = JSON.stringify(S.data); } catch (e) { console.warn('[SL.save] save data is not serializable', e); return ''; }
      const bytes = new TextEncoder().encode(json);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      const body = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      return 'SL1.' + body + '.' + (U.hash(body) % 46656).toString(36).padStart(3, '0');
    },

    importCode(str) {
      try {
        const clean = String(str || '').replace(/\s+/g, '');
        const m = /^SL1\.([A-Za-z0-9_-]+)\.([0-9a-z]{3})$/.exec(clean);
        if (!m) return false;
        if ((U.hash(m[1]) % 46656).toString(36).padStart(3, '0') !== m[2]) return false;
        let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const d = JSON.parse(new TextDecoder().decode(bytes));
        if (!U.isPlain(d) || d.v !== 1) return false;
        S.data = normalizeData(d);
        S.commit();
        SL.bus.emit('saveImported', { data: S.data });
        return true;
      } catch (e) {
        return false;
      }
    },

    /** Returns a fresh save object for 'fresh' | 'mid' | 'late' | 'full' (does not apply it). */
    sample(name) {
      const over = S.samples[name];
      let extra;
      if (typeof over === 'function') extra = over();
      else if (U.isPlain(over)) extra = over;
      else if (CORE_SAMPLES[name]) extra = CORE_SAMPLES[name]();
      else {
        U.warnOnce('save-sample:' + name, 'unknown sample save "' + name + '"; using fresh');
        extra = {};
      }
      return normalizeData(U.deepMerge(defaults(), extra));
    },

    /** Applies a sample in memory only (storage is left untouched for the rest of the session). */
    useSample(name) {
      S.data = S.sample(name);
      S.memoryOnly = true;
      SL.bus.emit('saveLoaded', { data: S.data, settings: S.settings, sample: name });
      return S.data;
    },

    setSetting(key, value) {
      const next = normalizeSettings(Object.assign({}, S.settings, { [key]: value }));
      S.settings[key] = next[key];
      S.commit();
      SL.bus.emit('settingsChanged', { key, value: S.settings[key], settings: S.settings });
      return S.settings[key];
    },

    /** The record for a mission id, with defaults (does not create it). */
    mission(id) {
      return Object.assign({ done: false, best: 0, rank: '', rescued: 0, plays: 0 }, S.data.missions[id] || {});
    },
  };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') S.flush();
  });
  window.addEventListener('pagehide', () => S.flush());

  SL.onBoot(() => { S.load(); });
})(window.SL = window.SL || {});

//# sourceURL=src/01_save.js
</script>
<script>
/* 02_input.js (core)
   Provides: SL.input = { players[0|1] {mx, my, dragX, dragY, fire, focus, bomb, skill, pause, any},
   menu {up, down, left, right, confirm, back, pause, any}, update(), inject(i, partial), press(i, action),
   setCoop(bool), reset(), isHeld(code), coop, lastDevice, padFor, autoPads, forceAutoFire, gamepads }.
   Keyboard (KeyboardEvent.code), standard-mapping gamepads, touch drag and mouse drag on #game feed
   per-player state once per frame. Calls SL.audio.unlock() on the first gestures and pauses missions on
   window blur or a hidden tab. */
(function (SL) {
  'use strict';

  const U = SL.util;

  const SOLO = {
    left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'],
    bomb: ['KeyX', 'KeyQ', 'KeyK'], skill: ['KeyC', 'KeyE', 'KeyL'], focus: ['ShiftLeft', 'ShiftRight'],
    fire: ['Space', 'KeyZ', 'KeyJ'], pause: ['Escape', 'KeyP'],
  };
  const COOP1 = {
    left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'],
    bomb: ['KeyQ'], skill: ['KeyE'], focus: ['ShiftLeft'], fire: ['Space'], pause: ['Escape', 'KeyP'],
  };
  const COOP2 = {
    left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],
    bomb: ['Enter', 'Numpad0'], skill: ['ShiftRight', 'Numpad1'], focus: ['ControlRight', 'Numpad2'],
    fire: ['Slash', 'NumpadEnter'], pause: ['Escape', 'KeyP'],
  };
  const MENU_KEYS = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right', Enter: 'confirm', NumpadEnter: 'confirm', Space: 'confirm',
    Escape: 'back', Backspace: 'back',
  };
  // Keys whose browser default (scrolling, quick find, history) must never fire while playing.
  const PREVENT = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Slash', 'Quote', 'Backspace']);
  const PAD = { A: 0, B: 1, X: 2, Y: 3, LB: 4, RB: 5, LT: 6, RT: 7, BACK: 8, START: 9, UP: 12, DOWN: 13, LEFT: 14, RIGHT: 15 };
  const DEADZONE = 0.2;

  function blankPlayer() {
    return { mx: 0, my: 0, dragX: 0, dragY: 0, fire: false, focus: false, bomb: false, skill: false, pause: false, any: false };
  }
  function clearPlayer(p) {
    p.mx = 0; p.my = 0; p.dragX = 0; p.dragY = 0;
    p.fire = false; p.focus = false; p.bomb = false; p.skill = false; p.pause = false; p.any = false;
  }

  const held = new Set();
  const downs = [];
  const menuDowns = [];
  const queued = [[], []];
  const padPrev = {};
  const padRepeat = {};
  let dragX = 0, dragY = 0;
  let padsEnabled = true;
  let lastUpdate = 0;
  const drag = { active: false, src: '', kind: '', id: null, x: 0, y: 0 };

  const I = SL.input = {
    players: [blankPlayer(), blankPlayer()],
    menu: { up: false, down: false, left: false, right: false, confirm: false, back: false, pause: false, any: false },
    coop: false,
    lastDevice: 'keyboard',
    /** [pad index for P1, pad index for P2]; -1 = none. In solo every pad drives P1. */
    padFor: [-1, -1],
    /** When true (default) padFor is recomputed every frame from the connected pads. */
    autoPads: true,
    /** True while the last device is touch: auto-fire is forced on. */
    forceAutoFire: false,
    gamepads: 0,
    dragging: false,
    maps: { SOLO, COOP1, COOP2 },

    update() {
      const now = performance.now();
      const realDt = lastUpdate ? Math.min(0.1, (now - lastUpdate) / 1000) : 1 / 60;
      lastUpdate = now;
      const P = I.players, m = I.menu;
      clearPlayer(P[0]);
      clearPlayer(P[1]);
      m.up = m.down = m.left = m.right = m.confirm = m.back = m.pause = m.any = false;

      const maps = I.coop ? [COOP1, COOP2] : [SOLO, null];
      for (let i = 0; i < 2; i++) {
        const map = maps[i];
        if (!map) continue;
        const p = P[i];
        let x = (anyHeld(map.right) ? 1 : 0) - (anyHeld(map.left) ? 1 : 0);
        let y = (anyHeld(map.down) ? 1 : 0) - (anyHeld(map.up) ? 1 : 0);
        if (x && y) { x *= Math.SQRT1_2; y *= Math.SQRT1_2; }
        p.mx = x;
        p.my = y;
        p.fire = anyHeld(map.fire);
        p.focus = anyHeld(map.focus);
        p.bomb = anyDown(map.bomb);
        p.skill = anyDown(map.skill);
        p.pause = anyDown(map.pause);
      }
      for (let i = 0; i < menuDowns.length; i++) {
        const code = menuDowns[i];
        const k = MENU_KEYS[code];
        if (k) m[k] = true;
        if (code === 'Escape' || code === 'KeyP') m.pause = true;
        m.any = true;
      }

      pollPads(realDt);

      if (dragX || dragY) {
        const w = (SL.render && SL.render.cssW) || cssWidth();
        const sens = (SL.save && SL.save.settings && SL.save.settings.touchSensitivity) || 1;
        const k = (SL.W / Math.max(1, w)) * sens;
        P[0].dragX = dragX * k;
        P[0].dragY = dragY * k;
      }
      dragX = 0;
      dragY = 0;

      for (let i = 0; i < 2; i++) {
        const q = queued[i];
        for (let j = 0; j < q.length; j++) P[i][q[j]] = true;
        q.length = 0;
      }
      for (let i = 0; i < 2; i++) {
        const p = P[i];
        p.any = !!(p.mx || p.my || p.dragX || p.dragY || p.fire || p.focus || p.bomb || p.skill || p.pause);
      }
      I.forceAutoFire = I.lastDevice === 'touch';
      I.dragging = drag.active;
      downs.length = 0;
      menuDowns.length = 0;
    },

    /** Overrides fields of a player's state for the current frame (autopilot, tests). */
    inject(i, partial) {
      const p = I.players[i];
      if (!p || !partial) return;
      for (const k in partial) if (k in p) p[k] = partial[k];
      p.any = !!(p.mx || p.my || p.dragX || p.dragY || p.fire || p.focus || p.bomb || p.skill || p.pause);
    },

    /** Queues a pressed-this-frame edge ('bomb' | 'skill' | 'pause') for the next update. */
    press(i, action) {
      if ((i !== 0 && i !== 1) || (action !== 'bomb' && action !== 'skill' && action !== 'pause')) return;
      queued[i].push(action);
    },

    setCoop(on) { I.coop = !!on; },

    reset() {
      held.clear();
      downs.length = 0;
      menuDowns.length = 0;
      queued[0].length = 0;
      queued[1].length = 0;
      dragX = dragY = 0;
      drag.active = false;
      clearPlayer(I.players[0]);
      clearPlayer(I.players[1]);
    },

    isHeld(code) { return held.has(code); },
  };

  function anyHeld(codes) {
    for (let i = 0; i < codes.length; i++) if (held.has(codes[i])) return true;
    return false;
  }
  function anyDown(codes) {
    for (let i = 0; i < codes.length; i++) if (downs.indexOf(codes[i]) >= 0) return true;
    return false;
  }
  function cssWidth() {
    const g = document.getElementById('game');
    return g ? g.clientWidth : SL.W;
  }

  // ---------------------------------------------------------------- gamepads
  function stick(x, y) {
    const len = Math.sqrt(x * x + y * y);
    if (len < DEADZONE) return [0, 0];
    const k = Math.min(1, (len - DEADZONE) / (1 - DEADZONE)) / len;
    return [x * k, y * k];
  }
  function btn(pad, i) {
    const b = pad.buttons[i];
    return !!b && (b.pressed || b.value > 0.5);
  }

  function pollPads(realDt) {
    if (!padsEnabled || typeof navigator === 'undefined' || !navigator.getGamepads) return;
    let pads;
    try { pads = navigator.getGamepads(); } catch (e) { padsEnabled = false; return; }
    const list = [];
    for (let i = 0; i < pads.length; i++) if (pads[i] && pads[i].connected) list.push(pads[i]);
    I.gamepads = list.length;
    if (I.autoPads) {
      if (!I.coop) { I.padFor[0] = list.length ? list[0].index : -1; I.padFor[1] = -1; }
      else if (list.length >= 2) { I.padFor[0] = list[0].index; I.padFor[1] = list[1].index; }
      else if (list.length === 1) { I.padFor[0] = -1; I.padFor[1] = list[0].index; }
      else { I.padFor[0] = -1; I.padFor[1] = -1; }
    }
    const P = I.players, m = I.menu;
    for (let n = 0; n < list.length; n++) {
      const pad = list[n];
      const prev = padPrev[pad.index] || (padPrev[pad.index] = []);
      const nb = pad.buttons.length;
      const now = [];
      for (let b = 0; b < nb; b++) now[b] = btn(pad, b);
      const edge = (b) => now[b] && !prev[b];
      const ax = stick(pad.axes[0] || 0, pad.axes[1] || 0);
      let x = ax[0] + (now[PAD.RIGHT] ? 1 : 0) - (now[PAD.LEFT] ? 1 : 0);
      let y = ax[1] + (now[PAD.DOWN] ? 1 : 0) - (now[PAD.UP] ? 1 : 0);
      const len = Math.sqrt(x * x + y * y);
      if (len > 1) { x /= len; y /= len; }

      let active = len > 0;
      for (let b = 0; b < nb; b++) if (now[b]) { active = true; break; }
      if (active) I.lastDevice = 'gamepad';

      const target = !I.coop ? 0 : pad.index === I.padFor[0] ? 0 : pad.index === I.padFor[1] ? 1 : -1;
      if (target >= 0) {
        const p = P[target];
        p.mx = U.clamp(p.mx + x, -1, 1);
        p.my = U.clamp(p.my + y, -1, 1);
        p.fire = p.fire || now[PAD.RT];
        p.focus = p.focus || now[PAD.LB] || now[PAD.RB];
        p.bomb = p.bomb || edge(PAD.A);
        p.skill = p.skill || edge(PAD.X) || edge(PAD.B);
        p.pause = p.pause || edge(PAD.START);
      }

      // menu edges with auto-repeat on directions
      const rep = padRepeat[pad.index] || (padRepeat[pad.index] = { up: 0, down: 0, left: 0, right: 0 });
      const dirs = { up: y < -0.5, down: y > 0.5, left: x < -0.5, right: x > 0.5 };
      for (const d in dirs) {
        if (dirs[d]) {
          if (rep[d] === 0) { m[d] = true; rep[d] = 0.38; } else {
            rep[d] -= realDt;
            if (rep[d] <= 0) { m[d] = true; rep[d] = 0.11; }
          }
        } else rep[d] = 0;
      }
      if (edge(PAD.A)) m.confirm = true;
      if (edge(PAD.B)) m.back = true;
      if (edge(PAD.START)) m.pause = true;
      for (let b = 0; b < nb; b++) if (edge(b)) m.any = true;
      for (let b = 0; b < nb; b++) prev[b] = now[b];
    }
  }

  // ---------------------------------------------------------------- DOM listeners
  function isEditable(t) {
    if (!t || t.nodeType !== 1) return false;
    if (t.isContentEditable) return true;
    const tag = t.tagName;
    if (tag === 'TEXTAREA' || tag === 'SELECT') return true;
    if (tag === 'INPUT') {
      const type = (t.type || 'text').toLowerCase();
      return ['button', 'checkbox', 'radio', 'range', 'submit', 'reset', 'color'].indexOf(type) < 0;
    }
    return false;
  }
  function isControl(t) {
    return !!(t && t.closest && t.closest('button, a, input, select, textarea, label, [tabindex], .sl-interactive'));
  }
  function unlockAudio() {
    if (SL.audio && !SL.audio.ready && typeof SL.audio.unlock === 'function') {
      try { SL.audio.unlock(); } catch (e) { /* audio may refuse; the next gesture retries */ }
    }
  }
  function blurPause() {
    held.clear();
    drag.active = false;
    const g = SL.game;
    if (!g || g.state !== 'mission' || g.paused) return;
    if (SL.debug && SL.debug.noBlurPause) return;
    if (typeof g.pause === 'function') g.pause('blur');
  }

  window.addEventListener('keydown', (e) => {
    if (isEditable(e.target)) return;
    const code = e.code || e.key;
    if (!code) return;
    if (PREVENT.has(code) && !isControl(e.target)) e.preventDefault();
    I.lastDevice = 'keyboard';
    if (!e.repeat) {
      if (!held.has(code)) downs.push(code);
      held.add(code);
    }
    menuDowns.push(code);
    unlockAudio();
  }, { passive: false });

  window.addEventListener('keyup', (e) => {
    const code = e.code || e.key;
    held.delete(code);
    // Releasing Shift can swallow the other side's keyup on some platforms.
    if (code === 'ShiftLeft' || code === 'ShiftRight') { if (!e.shiftKey) { held.delete('ShiftLeft'); held.delete('ShiftRight'); } }
  });

  window.addEventListener('blur', blurPause);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') blurPause(); });

  function attachPointer() {
    const game = document.getElementById('game');
    if (!game) return;
    const hasPointer = typeof window.PointerEvent === 'function';
    // Touch events and pointer events both report fingers. Once a real TouchEvent arrives, touch is
    // tracked through touch events only and pointer events of type 'touch' are ignored.
    let touchSeen = false;

    game.addEventListener('contextmenu', (e) => e.preventDefault());

    game.addEventListener('touchstart', (e) => {
      touchSeen = true;
      I.lastDevice = 'touch';
      unlockAudio();
      if (isControl(e.target)) return;
      if (e.cancelable) e.preventDefault();
      if (drag.active && drag.src === 'touch') return;
      const t = e.changedTouches[0];
      if (!t) return;
      drag.active = true; drag.src = 'touch'; drag.kind = 'touch'; drag.id = t.identifier;
      drag.x = t.clientX; drag.y = t.clientY;
    }, { passive: false });

    const touchMove = (e) => {
      if (!drag.active || drag.src !== 'touch') return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier !== drag.id) continue;
        dragX += t.clientX - drag.x;
        dragY += t.clientY - drag.y;
        drag.x = t.clientX;
        drag.y = t.clientY;
        if (e.cancelable) e.preventDefault();
      }
    };
    const touchEnd = (e) => {
      unlockAudio();
      if (!drag.active || drag.src !== 'touch') return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier !== drag.id) continue;
        touchMove(e);
        drag.active = false;
        drag.id = null;
        // another finger still down on the playfield (thumb swap) takes over the drag
        const rest = e.touches || [];
        for (let j = 0; j < rest.length; j++) {
          const t = rest[j];
          if (isControl(t.target)) continue;
          drag.active = true; drag.id = t.identifier; drag.x = t.clientX; drag.y = t.clientY;
          break;
        }
        break;
      }
    };
    game.addEventListener('touchmove', touchMove, { passive: false });
    game.addEventListener('touchend', touchEnd);
    game.addEventListener('touchcancel', touchEnd);

    const down = (e) => {
      const type = e.pointerType || 'mouse';
      if (type === 'touch' && touchSeen) return;
      unlockAudio();
      if (isControl(e.target)) return;
      I.lastDevice = type === 'touch' ? 'touch' : 'mouse';
      if (e.button === 2) { I.press(0, 'bomb'); e.preventDefault(); return; }
      if (e.button !== 0 || drag.active) return;
      drag.active = true; drag.src = 'pointer'; drag.kind = type; drag.id = hasPointer ? e.pointerId : 'mouse';
      drag.x = e.clientX; drag.y = e.clientY;
      if (hasPointer) { try { game.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ } }
    };
    const move = (e) => {
      if (!drag.active || drag.src !== 'pointer') return;
      if (hasPointer && e.pointerId !== drag.id) return;
      dragX += e.clientX - drag.x;
      dragY += e.clientY - drag.y;
      drag.x = e.clientX;
      drag.y = e.clientY;
    };
    const up = (e) => {
      if (!drag.active || drag.src !== 'pointer') return;
      if (hasPointer && e.pointerId !== drag.id) return;
      move(e);
      drag.active = false;
      drag.id = null;
    };
    if (hasPointer) {
      game.addEventListener('pointerdown', down);
      game.addEventListener('pointermove', move);
      game.addEventListener('pointerup', up);
      game.addEventListener('pointercancel', up);
      game.addEventListener('lostpointercapture', (e) => {
        if (drag.active && drag.src === 'pointer' && e.pointerId === drag.id) { drag.active = false; drag.id = null; }
      });
    } else {
      game.addEventListener('mousedown', down);
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
    }
  }

  SL.onBoot(attachPointer);
})(window.SL = window.SL || {});

</script>
<script>
/* STUB: replaced by audio
   03_audio.js provides: SL.audio = { unlock(), sfx(id, {vol, pitch, pan, x}), loop(id, opts) -> {set, stop},
   music(trackId, {fade}), stopMusic(fade), duck(amount, seconds), setVolumes({master, music, sfx}),
   ready, muted, current }.
   This stub keeps the full API as no-ops, plus tiny UI beeps so the unlock path can be heard and tested.
   Core calls unlock() on the first pointerdown/touch/keydown; ?mute=1 sets muted = true. */
(function (SL) {
  'use strict';

  let ac = null;
  let out = null;
  const vol = { master: 0.9, music: 0.7, sfx: 0.85 };
  const BEEPS = {
    ui_move: { f: 660, d: 0.035, g: 0.05 },
    ui_confirm: { f: 880, f2: 1320, d: 0.08, g: 0.06 },
    ui_back: { f: 520, f2: 330, d: 0.08, g: 0.05 },
  };

  function applyVolume() {
    if (out) out.gain.value = A.muted ? 0 : vol.master * vol.sfx;
  }

  const A = SL.audio = {
    ready: false,
    muted: false,
    current: null,
    unlock() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!ac) {
          ac = new AC();
          out = ac.createGain();
          out.connect(ac.destination);
          applyVolume();
        }
        if (ac.state === 'suspended') ac.resume().catch(() => {});
        A.ready = true;
      } catch (e) {
        A.ready = false;
      }
    },
    sfx(id) {
      const b = BEEPS[id];
      if (!b || !ac || A.muted || ac.state !== 'running') return;
      const t = ac.currentTime;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(b.f, t);
      if (b.f2) o.frequency.exponentialRampToValueAtTime(b.f2, t + b.d);
      g.gain.setValueAtTime(b.g, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + b.d);
      o.connect(g);
      g.connect(out);
      o.start(t);
      o.stop(t + b.d + 0.02);
    },
    loop() { return { set() {}, stop() {} }; },
    music(trackId) { A.current = trackId || null; },
    stopMusic() { A.current = null; },
    duck() {},
    setVolumes(v) {
      if (!v) return;
      ['master', 'music', 'sfx'].forEach((k) => { if (typeof v[k] === 'number') vol[k] = v[k]; });
      applyVolume();
    },
  };

  SL.onBoot(() => {
    const s = SL.save && SL.save.settings;
    if (s) A.setVolumes(s);
    SL.bus.on('settingsChanged', (e) => { if (e && /^(master|music|sfx)$/.test(e.key)) A.setVolumes(e.settings); });
  });
})(window.SL = window.SL || {});

</script>
<script>
/* 04_render.js (core)
   Provides: SL.render = { ctx (scene 2D context in 720x1280 logical space), hud (HUD context, logical
   space), scene (offscreen scene canvas), hasGL, distortion, quality, qualitySetting, auto, q, bloom,
   setQuality(q), addLens(x, y, radius, strength), addRipple(x, y, radius, amplitude, width),
   chromatic(amount), flash(color, alpha), desaturate(amount), vignette(amount), setTransform(ctx, x, y,
   rot, sx, sy), resetTransform(ctx), frame(), beginUpdate(), endUpdate(), resize(), toLogical(clientX,
   clientY), toScreen(x, y), cssW, cssH, dpr, scale, base, fps, frameMs, glInfo, loseContextForTest() }.
   Pipeline (WebGL1): scene canvas -> texture -> bright pass + 1/4 downsample -> separable gaussian blur
   at 1/4, 1/8, 1/16 (Medium: 1/8 and 1/16) -> composite with lens and ripple UV distortion, chromatic
   aberration, soft-limited bloom, flash, desaturate, vignette, dither -> #screen.
   Fallback (no WebGL, ?nogl=1, context lost, Low quality): the scene is blitted to a 2D #screen with 2D
   flash, desaturate and vignette; lens and ripple are skipped (distortion = false).
   Post effects are per frame: those added during SL.update persist until the next update step (so a
   paused frame keeps them); those added while drawing are cleared after the frame. Also owns the
   blurred #ambient backdrop that fills the page around the 9:16 game box. */
(function (SL) {
  'use strict';

  const W = SL.W, H = SL.H, U = SL.util;
  const MAX_LENS = 6, MAX_RIPPLE = 8;
  const QUALITY = {
    high: { q: 1, gl: true, levels: 3, particles: 2500 },
    medium: { q: 1, gl: true, levels: 2, particles: 1600 },
    low: { q: 0.75, gl: false, levels: 0, particles: 900 },
  };
  const ORDER = ['high', 'medium', 'low'];

  // ------------------------------------------------------------------ per-frame post effects
  function makeFx() {
    return {
      lens: Array.from({ length: MAX_LENS }, () => ({ x: 0, y: 0, r: 0, s: 1 })), nLens: 0,
      rip: Array.from({ length: MAX_RIPPLE }, () => ({ x: 0, y: 0, r: 0, a: 0, w: 1 })), nRip: 0,
      chroma: 0, flashA: 0, flashC: [255, 255, 255], desat: 0, vig: -1,
    };
  }
  function clearFx(f) { f.nLens = 0; f.nRip = 0; f.chroma = 0; f.flashA = 0; f.desat = 0; f.vig = -1; }
  const fxU = makeFx(), fxD = makeFx();
  let inUpdate = false;
  const cur = () => (inUpdate ? fxU : fxD);

  // ------------------------------------------------------------------ state
  let gameEl = null, appEl = null, hudEl = null, ambientEl = null;
  let glCanvas = null, c2Canvas = null, c2 = null;
  let hudCtx = null, ambCtx = null;
  let G = null;
  let glLost = false;
  let noGL = false;
  let glActive = false;
  let dirty = true;
  let bw = 1, bh = 1;
  let frameNo = 0;
  let lastFrame = 0;
  let autoAcc = 0, autoN = 0, autoStart = 0;
  let vigCanvas = null;
  let cqSupported = true;
  const drawErrors = new Set();

  const R = SL.render = {
    ctx: null,
    hud: null,
    scene: null,
    hasGL: false,
    distortion: false,
    quality: 'high',
    qualitySetting: 'auto',
    auto: true,
    q: 1,
    cssW: W * 0.5,
    cssH: H * 0.5,
    left: 0,
    top: 0,
    dpr: 1,
    scale: 0.5,
    /** Scene base transform (uniform scale + shake offset, in scene-canvas pixels). */
    base: { s: 1, x: 0, y: 0, shakeX: 0, shakeY: 0 },
    fps: 60,
    frameMs: 16.7,
    glInfo: '',
    QUALITY,
    /** Bloom tuning, read every frame: bright-pass threshold and knee (0..1 of the brightest channel),
        overall strength, weights of the 1/4, 1/8 and 1/16 blur levels, and knee2 (soft limit on the
        added bloom, b / (1 + knee2 * b), so hot cores cannot run away). */
    bloom: { threshold: 0.74, knee: 0.22, strength: 2.8, weights: [1.0, 0.95, 0.85], knee2: 0.55 },

    addLens(x, y, radius, strength) {
      const f = cur();
      if (f.nLens >= MAX_LENS || !(radius > 0) || !isFinite(x) || !isFinite(y) || !isFinite(radius)) return;
      const l = f.lens[f.nLens++];
      l.x = x; l.y = y; l.r = radius; l.s = strength == null || !isFinite(strength) ? 1 : U.clamp(strength, 0, 3);
    },
    addRipple(x, y, radius, amplitude, width) {
      const f = cur();
      if (f.nRip >= MAX_RIPPLE || !(radius >= 0) || !isFinite(x) || !isFinite(y) || !isFinite(radius)) return;
      const r = f.rip[f.nRip++];
      r.x = x; r.y = y; r.r = radius; r.a = isFinite(amplitude) ? amplitude : 0; r.w = Math.max(1, isFinite(width) && width > 0 ? width : 30);
    },
    chromatic(amount) { const f = cur(); f.chroma = Math.max(f.chroma, U.clamp(+amount || 0, 0, 1)); },
    flash(color, alpha) {
      const f = cur();
      alpha = U.clamp(+alpha || 0, 0, 1);
      if (alpha <= f.flashA) return;
      f.flashA = alpha;
      const p = SL.color.parse(color || '#ffffff');
      f.flashC[0] = p[0]; f.flashC[1] = p[1]; f.flashC[2] = p[2];
    },
    desaturate(amount) { const f = cur(); f.desat = Math.max(f.desat, U.clamp(+amount || 0, 0, 1)); },
    vignette(amount) { const f = cur(); f.vig = Math.max(f.vig, U.clamp(+amount || 0, 0, 1)); },

    /** Called by the game around every update step. Clears update-phase effects unless keep is true
        (hit-stop: the world is frozen, so its lenses and ripples must stay on screen). */
    beginUpdate(keep) { if (!keep) clearFx(fxU); inUpdate = true; },
    endUpdate() { inUpdate = false; },

    setQuality(q) {
      if (!QUALITY[q]) return;
      R.quality = q;
      R.q = QUALITY[q].q;
      if (!R.scene) return;
      sizeScene();
      chooseOutput();
      if (SL.fx && SL.fx.setCap) SL.fx.setCap(QUALITY[q].particles);
      SL.bus.emit('qualityChange', { quality: q });
    },

    resize() { dirty = true; },

    /** Scene ctx helper: translate(x, y) * rotate(rot) * scale(sx, sy) composed with the scene base
        (quality scale + camera shake). Cheaper than save/translate/rotate/restore in hot draw code. */
    setTransform(ctx, x, y, rot, sx, sy) {
      const b = R.base, s = b.s;
      sx = sx == null ? 1 : sx;
      sy = sy == null ? sx : sy;
      const c = rot ? Math.cos(rot) : 1, n = rot ? Math.sin(rot) : 0;
      ctx.setTransform(c * sx * s, n * sx * s, -n * sy * s, c * sy * s, b.x + x * s, b.y + y * s);
    },
    /** Restores the scene base transform, alpha 1 and source-over. */
    resetTransform(ctx) {
      const b = R.base;
      ctx.setTransform(b.s, 0, 0, b.s, b.x, b.y);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    },

    toLogical(clientX, clientY) {
      return { x: ((clientX - R.left) / Math.max(1, R.cssW)) * W, y: ((clientY - R.top) / Math.max(1, R.cssH)) * H };
    },
    toScreen(x, y) {
      return { x: R.left + (x / W) * R.cssW, y: R.top + (y / H) * R.cssH };
    },

    frame,

    /** Test hook: simulates a lost WebGL context (and restores it after `restoreMs` if given). */
    loseContextForTest(restoreMs) {
      if (!G) return false;
      const ext = G.gl.getExtension('WEBGL_lose_context');
      if (!ext) return false;
      ext.loseContext();
      if (restoreMs != null) setTimeout(() => { try { ext.restoreContext(); } catch (e) { /* ignore */ } }, restoreMs);
      return true;
    },
  };

  // ------------------------------------------------------------------ sizing
  function measure() {
    dirty = false;
    if (!gameEl) return;
    if (!cqSupported && appEl) {
      const aw = appEl.clientWidth, ah = appEl.clientHeight;
      const w = Math.max(1, Math.min(aw, (ah * 9) / 16));
      gameEl.style.width = w + 'px';
      gameEl.style.height = (w * 16) / 9 + 'px';
    }
    const r = gameEl.getBoundingClientRect();
    R.cssW = Math.max(1, r.width);
    R.cssH = Math.max(1, r.height);
    R.left = r.left;
    R.top = r.top;
    R.dpr = Math.min(window.devicePixelRatio || 1, 2);
    R.scale = R.cssW / W;
    const nw = Math.max(1, Math.round(R.cssW * R.dpr)), nh = Math.max(1, Math.round(R.cssH * R.dpr));
    if (nw !== bw || nh !== bh) {
      bw = nw; bh = nh;
      if (glCanvas) { glCanvas.width = bw; glCanvas.height = bh; }
      if (c2Canvas) { c2Canvas.width = bw; c2Canvas.height = bh; }
      if (hudEl) { hudEl.width = bw; hudEl.height = bh; }
      SL.bus.emit('resize', { w: R.cssW, h: R.cssH, dpr: R.dpr });
    }
  }

  function sizeScene() {
    const sw = Math.round(W * R.q), sh = Math.round(H * R.q);
    if (R.scene.width !== sw || R.scene.height !== sh) {
      R.scene.width = sw;
      R.scene.height = sh;
    }
    if (G) sizeTargets();
  }

  // ------------------------------------------------------------------ WebGL
  const VS = 'attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.0,1.0);}';

  const FS_BRIGHT = [
    'precision mediump float;',
    'varying vec2 vUv;uniform sampler2D uTex;uniform vec2 uTexel;uniform float uThresh;uniform float uKnee;',
    'vec3 bright(vec3 c){',
    '  float m=max(c.r,max(c.g,c.b));',
    '  float soft=clamp(m-uThresh+uKnee,0.0,2.0*uKnee);',
    '  soft=soft*soft/(4.0*uKnee+0.00001);',
    '  return c*(max(soft,m-uThresh)/max(m,0.00001));',
    '}',
    'void main(){',
    '  vec3 a=bright(texture2D(uTex,vUv+uTexel*vec2(-1.0,-1.0)).rgb);',
    '  vec3 b=bright(texture2D(uTex,vUv+uTexel*vec2(1.0,-1.0)).rgb);',
    '  vec3 c=bright(texture2D(uTex,vUv+uTexel*vec2(-1.0,1.0)).rgb);',
    '  vec3 d=bright(texture2D(uTex,vUv+uTexel*vec2(1.0,1.0)).rgb);',
    '  gl_FragColor=vec4((a+b+c+d)*0.25,1.0);',
    '}',
  ].join('\n');

  const FS_DOWN = [
    'precision mediump float;',
    'varying vec2 vUv;uniform sampler2D uTex;uniform vec2 uTexel;',
    'void main(){',
    '  vec3 c=texture2D(uTex,vUv+uTexel*vec2(-1.0,-1.0)).rgb+texture2D(uTex,vUv+uTexel*vec2(1.0,-1.0)).rgb',
    '        +texture2D(uTex,vUv+uTexel*vec2(-1.0,1.0)).rgb+texture2D(uTex,vUv+uTexel*vec2(1.0,1.0)).rgb;',
    '  gl_FragColor=vec4(c*0.25,1.0);',
    '}',
  ].join('\n');

  const FS_BLUR = [
    'precision mediump float;',
    'varying vec2 vUv;uniform sampler2D uTex;uniform vec2 uDir;',
    'void main(){',
    '  vec3 c=texture2D(uTex,vUv).rgb*0.2270270270;',
    '  c+=texture2D(uTex,vUv+uDir*1.3846153846).rgb*0.3162162162;',
    '  c+=texture2D(uTex,vUv-uDir*1.3846153846).rgb*0.3162162162;',
    '  c+=texture2D(uTex,vUv+uDir*3.2307692308).rgb*0.0702702703;',
    '  c+=texture2D(uTex,vUv-uDir*3.2307692308).rgb*0.0702702703;',
    '  gl_FragColor=vec4(c,1.0);',
    '}',
  ].join('\n');

  function compositeSrc(prec) {
    return [
      'precision ' + prec + ' float;',
      'varying vec2 vUv;',
      'uniform sampler2D uScene;uniform sampler2D uB0;uniform sampler2D uB1;uniform sampler2D uB2;',
      'uniform vec2 uRes;',
      'uniform vec4 uLens[6];uniform int uLensN;',
      'uniform vec4 uRip[8];uniform float uRipW[8];uniform int uRipN;',
      'uniform vec3 uBloomW;uniform float uBloomK;uniform float uChroma;uniform vec4 uFlash;uniform float uDesat;uniform float uVig;uniform float uTime;',
      'float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}',
      'void main(){',
      '  vec2 p=vUv*uRes;',
      '  vec2 src=p;',
      '  float mask=1.0;',
      '  float rim=0.0;',
      '  for(int i=0;i<6;i++){',
      '    if(i>=uLensN)break;',
      '    vec4 L=uLens[i];',
      '    vec2 d=p-L.xy;',
      '    float r=max(length(d),0.001);',
      '    float E=L.w;',
      '    float win=1.0-smoothstep(E*2.5,E*5.0,r);',
      // point-mass lens equation: the source seen at image radius r lies at r - E^2/r (Einstein ring at r = E)
      '    src-=(d/r)*(E*E/r)*win;',
      '    mask*=smoothstep(L.z*0.9,L.z*1.03,r);',
      '    float z=(r-L.z*1.06)/(L.z*0.07);',
      '    rim+=exp(-z*z);',
      '  }',
      '  for(int i=0;i<8;i++){',
      '    if(i>=uRipN)break;',
      '    vec4 Q=uRip[i];',
      '    vec2 d=p-Q.xy;',
      '    float r=max(length(d),0.001);',
      '    float x=(r-Q.z)/uRipW[i];',
      '    if(abs(x)<1.0){',
      '      float k=1.0-x*x;',
      '      src-=(d/r)*Q.w*x*k*k*2.6;',
      '    }',
      '  }',
      '  vec2 uv=src/uRes;',
      '  vec3 col;',
      '  if(uChroma>0.001){',
      '    vec2 off=(vUv-0.5)*uChroma*0.022;',
      '    col.r=texture2D(uScene,uv+off).r;',
      '    col.g=texture2D(uScene,uv).g;',
      '    col.b=texture2D(uScene,uv-off).b;',
      '  }else col=texture2D(uScene,uv).rgb;',
      '  vec3 bloom=texture2D(uB0,uv).rgb*uBloomW.x+texture2D(uB1,uv).rgb*uBloomW.y+texture2D(uB2,uv).rgb*uBloomW.z;',
      // soft knee on the bloom term: faint halos stay linear, hot cores (explosions) cannot run away
      '  col+=bloom/(1.0+bloom*uBloomK);',
      '  col*=mask;',
      '  col+=vec3(1.0,0.82,0.62)*rim*0.10*mask;',
      '  col=1.0-(1.0-col)*(1.0-uFlash.rgb*uFlash.a);',
      '  float l=dot(col,vec3(0.299,0.587,0.114));',
      '  col=mix(col,vec3(l),uDesat);',
      '  vec2 q=vUv-0.5;',
      '  float v=smoothstep(0.32,0.92,length(q*vec2(1.25,1.0))*1.18);',
      '  col*=1.0-uVig*v;',
      '  col+=(hash(gl_FragCoord.xy+uTime)-0.5)/255.0;',
      '  gl_FragColor=vec4(col,1.0);',
      '}',
    ].join('\n');
  }

  function compile(gl, type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS) && !gl.isContextLost()) {
      const log = gl.getShaderInfoLog(s);
      gl.deleteShader(s);
      throw new Error('shader compile failed: ' + log);
    }
    return s;
  }
  function program(gl, fs, uniforms) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, VS));
    gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS) && !gl.isContextLost()) throw new Error('program link failed: ' + gl.getProgramInfoLog(p));
    const u = {};
    for (const name of uniforms) u[name] = gl.getUniformLocation(p, name);
    return { p, u };
  }
  function texture(gl, w, h) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (w && h) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    return t;
  }
  function target(gl, w, h) {
    const tex = texture(gl, w, h);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!ok && !gl.isContextLost()) throw new Error('framebuffer incomplete');
    return { tex, fb, w, h };
  }

  function getContext(canvas) {
    const opts = {
      alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false,
      preserveDrawingBuffer: false, powerPreference: 'high-performance',
    };
    try { return canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts); } catch (e) { return null; }
  }

  function buildGL(gl) {
    const hp = gl.getShaderPrecisionFormat && gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
    const prec = hp && hp.precision > 0 ? 'highp' : 'mediump';
    const g = {
      gl,
      bright: program(gl, FS_BRIGHT, ['uTex', 'uTexel', 'uThresh', 'uKnee']),
      down: program(gl, FS_DOWN, ['uTex', 'uTexel']),
      blur: program(gl, FS_BLUR, ['uTex', 'uDir']),
      comp: program(gl, compositeSrc(prec), ['uScene', 'uB0', 'uB1', 'uB2', 'uRes', 'uLens', 'uLensN', 'uRip', 'uRipW',
        'uRipN', 'uBloomW', 'uBloomK', 'uChroma', 'uFlash', 'uDesat', 'uVig', 'uTime']),
      buf: gl.createBuffer(),
      sceneTex: texture(gl, 0, 0),
      sceneW: 0, sceneH: 0,
      black: texture(gl, 1, 1),
      lv: [], tmp: [],
      lensArr: new Float32Array(MAX_LENS * 4),
      ripArr: new Float32Array(MAX_RIPPLE * 4),
      ripW: new Float32Array(MAX_RIPPLE),
    };
    gl.bindBuffer(gl.ARRAY_BUFFER, g.buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    if (gl.UNPACK_COLORSPACE_CONVERSION_WEBGL) gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    gl.disable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    gl.bindTexture(gl.TEXTURE_2D, g.black);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    R.glInfo = (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)) + ' (' + prec + ')';
    return g;
  }

  function sizeTargets() {
    const gl = G.gl;
    for (const t of G.lv.concat(G.tmp)) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); }
    G.lv = []; G.tmp = [];
    const sw = R.scene.width, sh = R.scene.height;
    let w = Math.max(1, Math.round(sw / 4)), h = Math.max(1, Math.round(sh / 4));
    for (let i = 0; i < 3; i++) {
      G.lv.push(target(gl, w, h));
      G.tmp.push(target(gl, w, h));
      w = Math.max(1, Math.round(w / 2));
      h = Math.max(1, Math.round(h / 2));
    }
  }

  function initGL() {
    if (noGL) return false;
    if (!glCanvas) return false;
    const gl = getContext(glCanvas);
    if (!gl) return false;
    try {
      G = buildGL(gl);
      sizeTargets();
      R.hasGL = true;
      return true;
    } catch (err) {
      console.warn('[SL.render] WebGL setup failed; using 2D output.', err && err.message);
      G = null;
      R.hasGL = false;
      return false;
    }
  }

  function pass(prog, tgt, w, h) {
    const gl = G.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, tgt ? tgt.fb : null);
    gl.viewport(0, 0, w, h);
    gl.useProgram(prog.p);
  }
  function draw() { G.gl.drawArrays(G.gl.TRIANGLES, 0, 3); }
  function bindTex(unit, tex) {
    const gl = G.gl;
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
  }
  function blurLevel(i) {
    const gl = G.gl, a = G.lv[i], b = G.tmp[i], pr = G.blur;
    pass(pr, b, b.w, b.h);
    gl.uniform1i(pr.u.uTex, 0);
    bindTex(0, a.tex);
    gl.uniform2f(pr.u.uDir, 1 / a.w, 0);
    draw();
    pass(pr, a, a.w, a.h);
    bindTex(0, b.tex);
    gl.uniform2f(pr.u.uDir, 0, 1 / a.h);
    draw();
  }

  function compositeGL(fx) {
    const gl = G.gl;
    if (gl.isContextLost()) return false;
    const sc = R.scene;
    // upload the scene
    bindTex(0, G.sceneTex);
    if (G.sceneW !== sc.width || G.sceneH !== sc.height) {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, sc);
      G.sceneW = sc.width;
      G.sceneH = sc.height;
    } else {
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, sc);
    }
    const levels = QUALITY[R.quality].levels || 2;
    // bright pass into 1/4
    const l0 = G.lv[0];
    pass(G.bright, l0, l0.w, l0.h);
    gl.uniform1i(G.bright.u.uTex, 0);
    gl.uniform2f(G.bright.u.uTexel, 1 / sc.width, 1 / sc.height);
    const bl = R.bloom;
    gl.uniform1f(G.bright.u.uThresh, U.clamp(+bl.threshold || 0.6, 0.05, 2));
    gl.uniform1f(G.bright.u.uKnee, U.clamp(+bl.knee || 0.28, 0.01, 1));
    draw();
    if (levels >= 3) blurLevel(0);
    for (let i = 1; i < 3; i++) {
      const src = G.lv[i - 1], dst = G.lv[i];
      pass(G.down, dst, dst.w, dst.h);
      gl.uniform1i(G.down.u.uTex, 0);
      bindTex(0, src.tex);
      gl.uniform2f(G.down.u.uTexel, 1 / src.w, 1 / src.h);
      draw();
      blurLevel(i);
    }
    // composite
    const c = G.comp, u = c.u;
    pass(c, null, bw, bh);
    bindTex(0, G.sceneTex);
    bindTex(1, levels >= 3 ? G.lv[0].tex : G.black);
    bindTex(2, G.lv[1].tex);
    bindTex(3, G.lv[2].tex);
    gl.uniform1i(u.uScene, 0);
    gl.uniform1i(u.uB0, 1);
    gl.uniform1i(u.uB1, 2);
    gl.uniform1i(u.uB2, 3);
    gl.uniform2f(u.uRes, W, H);
    const sx = R.base.shakeX, sy = R.base.shakeY;
    let n = 0;
    const lists = [fxU, fxD];
    for (const f of lists) {
      for (let i = 0; i < f.nLens && n < MAX_LENS; i++, n++) {
        const l = f.lens[i];
        G.lensArr[n * 4] = l.x + sx;
        G.lensArr[n * 4 + 1] = H - (l.y + sy);
        G.lensArr[n * 4 + 2] = l.r;
        G.lensArr[n * 4 + 3] = l.r * (1 + 1.2 * l.s);
      }
    }
    gl.uniform4fv(u.uLens, G.lensArr);
    gl.uniform1i(u.uLensN, n);
    n = 0;
    for (const f of lists) {
      for (let i = 0; i < f.nRip && n < MAX_RIPPLE; i++, n++) {
        const r = f.rip[i];
        G.ripArr[n * 4] = r.x + sx;
        G.ripArr[n * 4 + 1] = H - (r.y + sy);
        G.ripArr[n * 4 + 2] = r.r;
        G.ripArr[n * 4 + 3] = r.a;
        G.ripW[n] = r.w;
      }
    }
    gl.uniform4fv(u.uRip, G.ripArr);
    gl.uniform1fv(u.uRipW, G.ripW);
    gl.uniform1i(u.uRipN, n);
    const bw3 = bl.weights || [0.8, 0.9, 1.05], str = bl.strength != null ? +bl.strength : 1;
    if (levels >= 3) gl.uniform3f(u.uBloomW, bw3[0] * str, bw3[1] * str, bw3[2] * str);
    else gl.uniform3f(u.uBloomW, 0, (bw3[1] + bw3[0] * 0.35) * str, bw3[2] * 1.1 * str);
    gl.uniform1f(u.uBloomK, bl.knee2 != null ? Math.max(0, +bl.knee2) : 0.55);
    gl.uniform1f(u.uChroma, fx.chroma);
    gl.uniform4f(u.uFlash, fx.flashC[0] / 255, fx.flashC[1] / 255, fx.flashC[2] / 255, fx.flashA);
    gl.uniform1f(u.uDesat, fx.desat);
    gl.uniform1f(u.uVig, fx.vig);
    gl.uniform1f(u.uTime, (frameNo % 997) * 0.731);
    draw();
    return true;
  }

  // ------------------------------------------------------------------ 2D output
  function ensure2D() {
    if (c2Canvas) return;
    c2Canvas = document.createElement('canvas');
    c2Canvas.className = 'sl-screen-canvas';
    c2Canvas.width = bw;
    c2Canvas.height = bh;
    c2Canvas.hidden = true;
    if (glCanvas && glCanvas.parentNode) glCanvas.parentNode.insertBefore(c2Canvas, glCanvas.nextSibling);
    else if (gameEl) gameEl.insertBefore(c2Canvas, gameEl.firstChild);
    c2 = c2Canvas.getContext('2d', { alpha: false });
  }

  function makeVignette() {
    const c = document.createElement('canvas');
    c.width = 90; c.height = 160;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(45, 80, 30, 45, 80, 108);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.55, 'rgba(0,0,0,0.25)');
    g.addColorStop(1, 'rgba(0,0,0,1)');
