name: Smoke tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Build the game
        run: python3 tools/build.py --no-publish
      - name: Run campaign smoke tests
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/smoke.mjs --no-shots --gpu swiftshader
